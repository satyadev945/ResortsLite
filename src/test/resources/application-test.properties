# Test profile configuration for ResortsLite
spring.application.name=ResortsLite-Test

# Use in-memory H2 database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=false

# Disable JPA schema creation warnings
spring.jpa.hibernate.ddl-auto=create-drop

# Suppress unnecessary startup logs during tests
logging.level.root=WARN
logging.level.com.demo.resortslite=INFO
