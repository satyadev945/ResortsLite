# bootstrap.properties — Spring Cloud GCP Secret Manager bootstrap configuration
# This file is loaded before application.properties so that sm:// URI references
# in application.properties are resolved from GCP Secret Manager at startup.
#
# cr-java-0069 remediation: Spring Cloud GCP Secret Manager requires the GCP project
# to be identified at bootstrap time. Set GCP_PROJECT_ID as an environment variable
# in the cloud runtime (Cloud Run, GKE, GCE) or via Workload Identity.
spring.cloud.gcp.project-id=${GCP_PROJECT_ID}
spring.cloud.gcp.secretmanager.enabled=true
