# ---------------------------------------------------------------------------
# Spring Cloud Bootstrap configuration
# cr-java-0069 FIX: Activates the Google Secret Manager property source BEFORE
# the main ApplicationContext is refreshed, so that sm:// URIs in
# application.properties are resolved at startup.
#
# The GCP project ID is read from the environment variable GCP_PROJECT_ID,
# which must be set in the Cloud Run / GKE workload configuration.
# ---------------------------------------------------------------------------

spring.application.name=ResortsLite

# Enable Spring Cloud GCP Secret Manager bootstrap property source
spring.cloud.gcp.secretmanager.enabled=true

# GCP project ID — injected at runtime via environment variable; never hard-coded
spring.cloud.gcp.project-id=${GCP_PROJECT_ID}
