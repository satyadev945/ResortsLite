# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# -----------------------------------------------------------------------
# cr-java-0065 fix: Spring Session backed by Amazon ElastiCache for Redis.
# All HTTP session state is stored in Redis instead of the local JVM heap,
# enabling stateless application instances that can be freely scaled
# horizontally behind an AWS ALB without sticky sessions.
#
# Connection values are supplied at runtime via environment variables:
#   REDIS_HOST  — ElastiCache primary endpoint (e.g. my-cluster.abc123.ng.0001.use1.cache.amazonaws.com)
#   REDIS_PORT  — Redis port (default 6379)
#   REDIS_TTL_SECONDS — session time-to-live in seconds (default 1800 = 30 min)
#
# For local development without ElastiCache, set REDIS_HOST=localhost and
# start a local Redis instance (e.g. `docker run -p 6379:6379 redis:7`).
# -----------------------------------------------------------------------
# Spring Session store type — delegates HttpSession to Redis
spring.session.store-type=redis
# Session time-to-live (30 minutes default; override via REDIS_TTL_SECONDS)
spring.session.timeout=${REDIS_TTL_SECONDS:1800}
# Redis connection — resolved from environment variables at runtime
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
# Redis SSL (recommended for ElastiCache in-transit encryption)
spring.redis.ssl=${REDIS_SSL:false}

# -----------------------------------------------------------------------
# cr-java-0067 fix: Amazon ElastiCache for Redis — booking cache TTL.
# Replaces the unbounded in-memory HashMap (bookingCache) that caused
# indefinite memory growth, stale data, and cache inconsistency across
# multiple EC2 instances.
#
# Each booking entry is stored in the shared Redis cluster with a TTL
# controlled by the property below. When the TTL expires Redis automatically
# evicts the entry, preventing memory growth and ensuring data freshness.
#
# Override via the environment variable BOOKING_CACHE_TTL_SECONDS or the
# Spring property app.cache.booking.ttl-seconds.
# Default: 3600 seconds (1 hour).
# -----------------------------------------------------------------------
# Booking cache TTL in seconds (cr-java-0067)
app.cache.booking.ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:3600}

# -----------------------------------------------------------------------
# cr-java-0062 fix: Amazon S3 configuration for durable report/backup storage.
# These values are overridden at runtime by the environment variables
# REPORT_S3_BUCKET, BACKUP_S3_BUCKET, and AWS_REGION respectively,
# so no bucket name or region is hard-coded in the deployed artefact.
# -----------------------------------------------------------------------
report.s3.bucket=${REPORT_S3_BUCKET:resorts-lite-reports}
backup.s3.bucket=${BACKUP_S3_BUCKET:resorts-lite-backups}
cloud.aws.region.static=${AWS_REGION:us-east-1}

# -----------------------------------------------------------------------
# cr-java-0077 fix: Hard-coded port 8080 replaced with AWS Parameter Store /
# environment variable injection.  At runtime the SERVER_PORT environment
# variable (set by ECS task definition, EKS pod spec, or Elastic Beanstalk
# environment configuration) controls the listening port.  The SSM parameter
# /resortslite/server/port is fetched by SsmParameterStoreConfig on startup
# and registered as the Spring property server.port so no port number is
# hard-coded in the deployed artefact.
# Fallback: 8080 is used only for local development when neither SSM nor the
# environment variable is available.
# -----------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
# SSM parameter path for the server port (cr-java-0077)
server.port.ssm-path=/resortslite/server/port

# -----------------------------------------------------------------------
# cr-java-0071 fix: Environment-specific URLs externalized to AWS SSM Parameter Store.
# The SsmParameterStoreConfig bean fetches the actual values from SSM at startup
# and registers them as Spring properties (app.inventory.url and
# app.report.download.base-url). The properties below define:
#   1. The SSM parameter paths used to look up each URL.
#   2. Fallback values (via environment variables) for local development
#      where SSM is not available.
# -----------------------------------------------------------------------
# SSM parameter paths (configurable per environment)
app.inventory.url.ssm-path=/resortslite/inventory/url
app.report.download.base-url.ssm-path=/resortslite/report/download-base-url
# Fallback values used when SSM is unavailable (local dev / CI)
app.inventory.url=${INVENTORY_SERVICE_URL:http://inventory-service.internal:8081/rooms/available}
app.report.download.base-url=${REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download/}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:oracle:thin:@db-prod.resorts-internal.com:1521:ORCL
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send
