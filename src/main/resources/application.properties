spring.application.name=ResortsLite
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.payment.endpoint=${APP_PAYMENT_ENDPOINT:https://payment-svc.internal/payments/charge}
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms/available}
app.notification.endpoint=${APP_NOTIFICATION_ENDPOINT:https://notify.internal/send}
app.report.download-base-url=${APP_REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download}

azure.appconfig.connection-string=${AZURE_APPCONFIG_CONNECTION_STRING:}
azure.keyvault.url=${AZURE_KEYVAULT_URL:}
azure.storage.blob.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:}
azure.storage.blob.container-name=${AZURE_STORAGE_BLOB_CONTAINER_NAME:reports}
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE_NAME:report-jobs}
azure.redis.host=${AZURE_REDIS_HOST:localhost}
azure.redis.port=${AZURE_REDIS_PORT:6379}
azure.redis.password=${AZURE_REDIS_PASSWORD:}

spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6379}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session
spring.session.timeout=30m

spring.cache.type=redis
