# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077: port injected by Azure (App Service / Container Apps / AKS) via environment variables
server.port=${SERVER_PORT:${PORT:${WEBSITES_PORT:8080}}}

# Azure Key Vault (authenticated via DefaultAzureCredential / managed identity).
# Secrets: datasource-host, datasource-username, datasource-password
spring.cloud.azure.keyvault.secret.property-sources[0].endpoint=${AZURE_KEYVAULT_ENDPOINT}
spring.datasource.url=jdbc:sqlserver://${datasource-host}:1433;databaseName=ResortsDB;encrypt=true;trustServerCertificate=false
spring.datasource.username=${datasource-username}
spring.datasource.password=${datasource-password}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA-Hibernate properties (SQL Server) — IDENTITY keys, same entity shape as the Oracle Doctor
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0065: HTTP session state externalised to Azure Cache for Redis (Spring Session).
# Azure Cache for Redis requires TLS on port 6380; host and access key come from environment / Key Vault.
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session
spring.session.redis.flush-mode=on-save
spring.session.redis.repository-type=default
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6380}
spring.redis.password=${AZURE_REDIS_KEY:}
spring.redis.ssl=${AZURE_REDIS_SSL:true}

# cr-java-0067: booking cache lives in Azure Cache for Redis with a TTL (seconds)
app.booking-cache.ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:1800}
