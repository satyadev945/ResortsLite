# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=${PORT:${SERVER_PORT:8080}}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:postgresql://db-prod.resorts-internal.com:5432/ResortsDB
# Credentials are NOT stored here. They are loaded from Azure Key Vault (DefaultAzureCredential)
# by DbCredentialsProvider. Env vars below are only a fallback for local development.
azure.keyvault.uri=${AZURE_KEYVAULT_URI:}
azure.keyvault.secret.db-username=${AZURE_KEYVAULT_DB_USERNAME_SECRET:db-username}
azure.keyvault.secret.db-password=${AZURE_KEYVAULT_DB_PASSWORD_SECRET:db-password}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# JPA-Hibernate properties (PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=${PAYMENT_SERVICE_ENDPOINT:http://payment-svc.internal/charge}
app.inventory.endpoint=${INVENTORY_SERVICE_ENDPOINT:http://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_SERVICE_ENDPOINT:http://notify.internal/send}

# Azure Blob Storage for reports/backups (replaces local file paths)
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.account-endpoint=${AZURE_STORAGE_ACCOUNT_ENDPOINT:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:resort-reports}
app.reports.download-base-url=${REPORT_DOWNLOAD_BASE_URL:}
app.reports.blob-prefix=${APP_REPORTS_BLOB_PREFIX:reports/}
app.backups.blob-prefix=${APP_BACKUPS_BLOB_PREFIX:backups/nightly/}

# Azure Cache for Redis - externalised state (replaces HTTP session state storage)
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6380}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.redis.ssl=${AZURE_REDIS_SSL:true}
spring.redis.timeout=${AZURE_REDIS_TIMEOUT:5000ms}
app.state.ttl-minutes=${APP_STATE_TTL_MINUTES:30}
