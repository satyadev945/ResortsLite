# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# ============================================================================
# Server Port Configuration
# ============================================================================
# FIXED cr-java-0077: Port externalized to support dynamic assignment by container orchestration
# 
# In cloud environments (ECS, EKS, Elastic Beanstalk), override via environment variable:
#   export SERVER_PORT=8080
# Or configure in AWS Parameter Store: /resortslite/server/port
# 
# Default port for local development:
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:postgresql://db-prod.resorts-internal.com:5432/orcl
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA-Hibernate properties (PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# AWS S3 Configuration for Report Storage (replaces hard-coded file paths)
# S3 bucket name should be provided via environment variable in cloud deployment
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:resorts-lite-reports}
aws.s3.region=${AWS_REGION:us-east-1}
# AWS credentials will be automatically retrieved from IAM role in cloud environment
# For local development, use AWS CLI configuration or environment variables

# ============================================================================
# AWS Systems Manager Parameter Store Configuration
# ============================================================================
# FIXED cr-java-0071: Hard-coded environment URLs externalized to Parameter Store
# 
# Required Parameter Store parameters (create these in AWS Console or CLI):
# - /resortslite/inventory/service/url      : Inventory service endpoint URL
# - /resortslite/reports/download/url       : Reports download base URL
# - /resortslite/payment/endpoint           : Payment service endpoint URL
# - /resortslite/notification/endpoint      : Notification service endpoint URL
#
# Example AWS CLI command to create parameter:
# aws ssm put-parameter --name "/resortslite/inventory/service/url" \
#     --value "https://inventory-service.prod.internal:8081/rooms/available" --type String

# ============================================================================
# Redis Configuration for Distributed Session Management (Amazon ElastiCache)
# ============================================================================
# FIXED cr-java-0065: HTTP Session State Storage migrated to Amazon ElastiCache for Redis
#
# Spring Session Data Redis automatically stores all HTTP session data in Redis instead of
# local memory, enabling stateless application instances and horizontal scaling.
#
# AWS ElastiCache Configuration:
# - Create ElastiCache Redis cluster in AWS Console (recommended: cluster mode disabled)
# - Use Redis 7.x or later for best performance
# - Configure in same VPC as application instances
# - Update security group to allow inbound traffic on port 6379 from application security group
#
# Environment Variables (set in ECS task definition, Elastic Beanstalk, or EKS deployment):
# - SPRING_REDIS_HOST: ElastiCache primary endpoint hostname (without port)
#   Example: my-redis-cluster.abc123.0001.use1.cache.amazonaws.com
# - SPRING_REDIS_PORT: Redis port (default: 6379)
# - SPRING_REDIS_PASSWORD: Redis AUTH password (if enabled, recommended for production)
#
# Local Development (requires local Redis):
# docker run -d -p 6379:6379 --name redis redis:7-alpine

# Redis connection settings (override via environment variables in cloud)
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.password=${SPRING_REDIS_PASSWORD:}
spring.redis.timeout=2000ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=2

# ============================================================================
# Redis Cache Configuration for Amazon ElastiCache
# ============================================================================
# FIXED cr-java-0067: In-Memory Caching Without TTL migrated to Amazon ElastiCache for Redis
#
# Spring Cache with Redis backend provides distributed caching with TTL policies across all
# application instances. This prevents indefinite memory growth, out-of-memory errors, and
# stale data inconsistencies that occur with unbounded in-memory caching.
#
# Cache TTL Configuration:
# - Default cache TTL: 3600 seconds (1 hour) for general-purpose caching
# - Booking cache TTL: 1800 seconds (30 minutes) for transactional booking data
#
# Uses the same ElastiCache Redis cluster as session management (no additional infrastructure)
spring.cache.redis.time-to-live=3600
spring.cache.redis.booking-ttl=1800
