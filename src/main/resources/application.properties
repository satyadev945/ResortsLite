# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
# cr-java-0077 fix: Hard-coded port 8080 replaced with an environment-variable placeholder.
# The SERVER_PORT environment variable is injected at runtime by:
#   - ECS: task definition 'environment' or 'secrets' block (from SSM Parameter Store key
#          /resortslite/server/port)
#   - EKS: pod spec env[].valueFrom.configMapKeyRef or secretKeyRef
#   - Elastic Beanstalk: environment property SERVER_PORT
# A default of 8080 is retained for local development only.
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.

# cr-java-0071 fix: Hard-coded environment URLs replaced with AWS Systems Manager
# Parameter Store references. Each property below is resolved from an SSM parameter
# at application startup, making the URL environment-agnostic across dev/staging/prod.
#
# SSM parameter: /resortslite/inventory/url
# Inject via environment variable INVENTORY_URL or set the SSM parameter directly.
app.inventory.url=${INVENTORY_URL:http://inventory-service.internal:8081/rooms/available}
#
# SSM parameter: /resortslite/reports/download-base-url
# Inject via environment variable REPORTS_DOWNLOAD_BASE_URL or set the SSM parameter directly.
app.reports.download.base-url=${REPORTS_DOWNLOAD_BASE_URL:http://reports.resorts-internal.com:8080/download}
# Set DB_SECRET_NAME to the name/ARN of the secret in AWS Secrets Manager that holds

# ---------------------------------------------------------------------------
# cr-java-0090 fix: Amazon Cognito User Pool — File-based Authentication
# ---------------------------------------------------------------------------
# Replaces local file-based credential storage and MD5-based token generation
# with Amazon Cognito for centralized, encrypted user identity management.
#
# At runtime, set the following environment variables (ECS task definition /
# EKS pod spec / Elastic Beanstalk environment properties):
#
#   COGNITO_USER_POOL_ID  — The Cognito User Pool ID (e.g. us-east-1_AbCdEfGhI)
#   COGNITO_CLIENT_ID     — The Cognito App Client ID for this service
#
# The IAM role attached to the running service must have
# cognito-idp:AdminGetUser permission on the User Pool.
# Defaults are empty strings so the application starts in local dev mode
# without a Cognito pool configured (identity validation is bypassed).
app.cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
app.cognito.client-id=${COGNITO_CLIENT_ID:}
app.notification.endpoint=http://notify.internal:7070/send

# ---------------------------------------------------------------------------
# cr-java-0065 fix: Spring Session — Amazon ElastiCache for Redis
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# cr-java-0067 fix: Amazon ElastiCache for Redis — Booking Cache TTL
# ---------------------------------------------------------------------------
# Replaces the unbounded in-memory HashMap (bookingCache) with a Redis-backed
# cache that enforces an explicit TTL on every entry.  This ensures:
#   - Memory growth is bounded and controlled by Redis eviction policies.
#   - Stale booking data is automatically expired after the configured period.
#   - All application instances share the same cache — no per-instance divergence.
#   - Cache survives instance restarts and auto-scaling events.
#
# At runtime, set the following environment variable (ECS task definition /
# EKS pod spec / Elastic Beanstalk environment properties):
#
#   BOOKING_CACHE_TTL_MINUTES — TTL in minutes for each booking cache entry
#                               (default: 30 minutes)
#
# The Redis connection (host/port) is shared with the Spring Session configuration
# above (REDIS_HOST / REDIS_PORT environment variables).
app.cache.booking.ttl-minutes=${BOOKING_CACHE_TTL_MINUTES:30}
# application instances that share session state through a central Redis cluster.
#
# At runtime, set the following environment variables (ECS task definition /
# EKS pod spec / Elastic Beanstalk environment properties):
#
#   REDIS_HOST  — DNS name or IP of the Amazon ElastiCache for Redis primary endpoint
#                 (e.g. resortslite-session.abc123.ng.0001.use1.cache.amazonaws.com)
#   REDIS_PORT  — Redis port (default 6379)
#
# The defaults below allow the application to start locally without a Redis instance.
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
# Persist session attributes to Redis immediately on each setAttribute call.
spring.session.redis.flush-mode=on_save
# Namespace prefix for all session keys stored in Redis — avoids collisions when
# multiple applications share the same ElastiCache cluster.
spring.session.redis.namespace=resortslite:session
# Session timeout — 30 minutes of inactivity before the Redis key expires.
server.servlet.session.timeout=30m
