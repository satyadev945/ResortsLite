# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# AWS Secrets Manager Configuration
# Database credentials are retrieved from AWS Secrets Manager instead of hard-coded values
aws.secretsmanager.secret.name=${AWS_SECRET_NAME:resortslite/database/credentials}
aws.region=${AWS_REGION:us-east-1}

# For local development, set these environment variables:
# DB_HOST, DB_USER, DB_PASS

# FIXED cr-java-0090: AWS Cognito Configuration for user authentication
# Replace file-based authentication with AWS Cognito for centralized user management
aws.cognito.userPoolId=${AWS_COGNITO_USER_POOL_ID:}
aws.cognito.clientId=${AWS_COGNITO_CLIENT_ID:}
aws.cognito.clientSecret=${AWS_COGNITO_CLIENT_SECRET:}
aws.cognito.region=${AWS_REGION:us-east-1}

# FIXED cr-java-0077: Port now uses environment variable for dynamic assignment by ECS/EKS
# Set SERVER_PORT environment variable or retrieve from AWS Systems Manager Parameter Store
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# FIXED cr-java-0077: Service endpoints now use environment variables for dynamic port assignment
# These should be retrieved from AWS Systems Manager Parameter Store or Service Discovery
app.payment.endpoint=${APP_PAYMENT_ENDPOINT:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:http://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${APP_NOTIFICATION_ENDPOINT:http://notify.internal:7070/send}

# AWS S3 Configuration for Report Storage
# Replace hard-coded file paths with S3 object storage

# FIXED cr-java-0071 & cr-java-0077: Externalized report download base URL with dynamic port
# This value should be retrieved from AWS Systems Manager Parameter Store in production
app.reports.download.baseurl=${APP_REPORTS_DOWNLOAD_BASEURL:https://reports.resorts-internal.com}
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:resorts-lite-reports}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.reports.prefix=reports/
aws.s3.backups.prefix=backups/nightly/
aws.s3.endpoint=${AWS_S3_ENDPOINT:}

# FIXED cr-java-0065: Spring Session with Amazon ElastiCache for Redis
# Distributed session management enables stateless application instances
# Sessions are stored in Redis cluster, accessible across all EC2 instances
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=spring:session

# Amazon ElastiCache for Redis Configuration
# Use environment variables for dynamic configuration in AWS
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# FIXED cr-java-0067: Redis Cache Configuration with TTL
# Cache entries automatically expire after configured TTL to prevent memory growth
# Adjust TTL based on data freshness requirements and memory constraints
cache.ttl.minutes=${CACHE_TTL_MINUTES:30}
