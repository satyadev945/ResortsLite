# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0090 fix: Amazon Cognito User Pool configuration for cloud-native authentication.
# Replaces file-based authentication credentials and MD5-based token generation with
# Amazon Cognito User Pools for centralised, encrypted, and auditable user identity management.
# Set the following environment variables in your ECS task definition / Parameter Store:
#   COGNITO_USER_POOL_ID  – the Cognito User Pool ID (e.g. us-east-1_AbCdEfGhI)
#   COGNITO_CLIENT_ID     – the Cognito App Client ID
#   COGNITO_REGION        – the AWS region where the User Pool is hosted (defaults to AWS_REGION)
# AWS Systems Manager Parameter Store paths:
#   /resortslite/cognito/user-pool-id
#   /resortslite/cognito/client-id
#   /resortslite/cognito/region
aws.cognito.user-pool-id=${COGNITO_USER_POOL_ID:us-east-1_PLACEHOLDER}
aws.cognito.client-id=${COGNITO_CLIENT_ID:PLACEHOLDER_CLIENT_ID}
aws.cognito.region=${COGNITO_REGION:${AWS_REGION:us-east-1}}

# cr-java-0069 fix: AWS Secrets Manager configuration for database credentials.
# Set DB_SECRET_NAME env-var (or aws.secretsmanager.db-secret-name property) to the
# Secrets Manager secret name / ARN that holds {"username":"...","password":"..."}.
aws.secretsmanager.db-secret-name=${DB_SECRET_NAME:resortslite/db/credentials}

# cr-java-0021 fix: DB host externalised – set DB_HOST env-var in ECS task definition.
app.db.host=${DB_HOST:localhost}

# cr-java-0061 fix: Amazon S3 configuration for report storage (replaces hard-coded file paths)
# Set AWS_S3_REPORT_BUCKET environment variable in your cloud deployment (ECS task definition, etc.)
aws.s3.report.bucket=${AWS_S3_REPORT_BUCKET:resorts-lite-reports}
aws.s3.region=${AWS_REGION:us-east-1}

# cr-java-0077 fix: Hard-coded port 8080 replaced with environment variable injection.
# Set the SERVER_PORT environment variable in the ECS task definition, EKS pod spec, or
# Elastic Beanstalk environment configuration so the port is assigned dynamically at runtime.
# AWS Parameter Store path: /resortslite/server/port
server.port=${SERVER_PORT:8080}

# cr-java-0077 fix: Application-level server port property (used by ReportService).
# Resolved from SERVER_PORT env-var; falls back to 8080 for local development only.
app.server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0071 fix: Environment-specific URLs externalised to AWS Systems Manager Parameter Store.
# BookingController – inventory service URL
# SSM parameter path: /resortslite/inventory/service-url
# Set the INVENTORY_SERVICE_URL environment variable (or the SSM-backed property below) in each
# deployment environment so no URL is baked into the application binary.
app.inventory.service.url=${INVENTORY_SERVICE_URL:http://inventory-service.internal:8081/rooms/available}

# cr-java-0071 fix: ReportService – report download base URL
# SSM parameter path: /resortslite/report/download-base-url
# Set the REPORT_DOWNLOAD_BASE_URL environment variable (or the SSM-backed property below) in each
# deployment environment so no URL is baked into the application binary.
app.report.download.base-url=${REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download/}

# cr-java-0065 fix: Amazon ElastiCache for Redis — Spring Session configuration.
# All HTTP session data is stored in the shared Redis cluster so every application
# instance reads and writes the same session state, enabling stateless horizontal scaling.
#
# Set REDIS_HOST to the ElastiCache primary endpoint (e.g. my-cluster.abc123.ng.0001.use1.cache.amazonaws.com).
# Set REDIS_PORT if your cluster uses a non-default port (default: 6379).
# Set SESSION_TIMEOUT_SECONDS to control session TTL (default: 1800 = 30 minutes).
#
# AWS ElastiCache (Redis) connection
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# Spring Session — use Redis as the session store
spring.session.store-type=redis
spring.session.timeout=${SESSION_TIMEOUT_SECONDS:1800}s

# cr-java-0067 fix: Amazon ElastiCache for Redis — booking cache TTL configuration.
# Replaces the unbounded static in-memory HashMap (bookingCache) with a Redis-backed
# cache entry that expires automatically after the configured TTL, preventing indefinite
# memory growth and stale data inconsistencies across multiple application instances.
#
# Set BOOKING_CACHE_TTL_SECONDS to the desired cache lifetime in seconds.
# AWS Parameter Store path: /resortslite/cache/booking-ttl-seconds
# Default: 3600 seconds (1 hour)
app.cache.booking.ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:3600}
