# ResortsLite - Legacy Configuration
# cr-java-0065 FIX: Azure Cache for Redis — Spring Session Data Redis configuration.
# HTTP session state is externalized to Azure Cache for Redis so that all application
# instances share the same session store, enabling stateless horizontal scaling.
#
# Set the following environment variables in your Azure environment
# (App Service → Configuration → Application settings, Container Apps env vars, or AKS secrets):
#
#   SPRING_REDIS_HOST      – Azure Cache for Redis hostname
#                            e.g. <your-cache-name>.redis.cache.windows.net
#   SPRING_REDIS_PORT      – Redis TLS port (Azure default: 6380)
#   SPRING_REDIS_PASSWORD  – Redis primary/secondary access key
#                            (retrieve from Azure Key Vault secret "redis-access-key")
#   SPRING_REDIS_SSL       – true  (Azure Cache for Redis enforces TLS)
#
# Session timeout (default 30 minutes; adjust to your application's requirements):
#   SPRING_SESSION_TIMEOUT – e.g. 30m
#
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6380}
spring.redis.password=${SPRING_REDIS_PASSWORD:}
spring.redis.ssl=${SPRING_REDIS_SSL:true}
# cr-java-0067 FIX: Azure Cache for Redis — Booking cache TTL configuration.
# The static in-memory HashMap (bookingCache) in BookingController has been replaced
# with a Spring Data RedisTemplate backed by Azure Cache for Redis. Each booking entry
# is stored with a TTL to prevent indefinite memory growth and stale data across instances.
#
# Override via BOOKING_CACHE_TTL_MINUTES environment variable or Azure App Configuration key.
# Recommended values:
#   Development  : 10  (short TTL for rapid iteration)
#   Staging      : 30  (moderate TTL for integration testing)
#   Production   : 60  (default — balances freshness and cache efficiency)
#
# Set in Azure environment: App Service → Configuration → Application settings,
# Container Apps environment variables, or AKS ConfigMap / Secret.
app.booking.cache.ttl-minutes=${BOOKING_CACHE_TTL_MINUTES:60}

# Use spring-session-data-redis as the session store type
spring.session.store-type=redis
# Session namespace to avoid key collisions when multiple apps share the same Redis instance
spring.session.redis.namespace=resortsLite:sessions
# Session timeout — 30 minutes default; override via SPRING_SESSION_TIMEOUT env var
spring.session.timeout=${SPRING_SESSION_TIMEOUT:30m}

# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0069 FIX: Azure Key Vault URI for secure credential retrieval.
# Set the AZURE_KEY_VAULT_URI environment variable to your Key Vault endpoint, e.g.:
#   AZURE_KEY_VAULT_URI=https://<your-vault-name>.vault.azure.net/
# In Azure-hosted environments (App Service, Container Apps, AKS) assign a Managed Identity
# to the resource and grant it "Key Vault Secrets User" role on the vault.
# Required secrets: "db-username", "db-password"
azure.keyvault.uri=${AZURE_KEY_VAULT_URI:https://your-vault-name.vault.azure.net/}

# Azure Blob Storage configuration (cr-java-0061 fix: replaces hard-coded file paths).
# Set AZURE_STORAGE_CONNECTION_STRING environment variable in the cloud environment.
# The connection string is injected at runtime; do NOT hard-code credentials here.
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=https;AccountName=<your-account>;AccountKey=<your-key>;EndpointSuffix=core.windows.net}
# Container names can be overridden via environment variables for different deployment stages.
azure.storage.reports-container=${AZURE_STORAGE_REPORTS_CONTAINER:resort-reports}
azure.storage.backup-container=${AZURE_STORAGE_BACKUP_CONTAINER:resort-backups}

# =============================================================================
# cr-java-0111 FIX: Azure Service Bus — Scheduled Message Delivery Configuration
# Replaces java.util.Timer and server-local scheduling with Azure Service Bus
# scheduled messages for distributed, timezone-agnostic task execution.
#
# All scheduled times use UTC (OffsetDateTime.now(ZoneOffset.UTC)), eliminating
# timezone inconsistencies across multi-region cloud deployments and container restarts.
#
# Set the following environment variables in your Azure environment
# (App Service → Configuration → Application settings, Container Apps env vars,
# or AKS secrets / Azure Key Vault references):
#
#   AZURE_SERVICEBUS_CONNECTION_STRING – Azure Service Bus namespace connection string
#                                        Found in: Azure Portal → Service Bus → Shared access policies
#   AZURE_SERVICEBUS_REPORT_QUEUE      – Queue name for report generation tasks
#                                        Create in: Azure Portal → Service Bus → Queues
# =============================================================================
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:Endpoint=sb://your-namespace.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=your-key}
azure.servicebus.report-queue=${AZURE_SERVICEBUS_REPORT_QUEUE:resort-report-tasks}

# cr-java-0077 FIX: Hard-coded port 8080 replaced with environment variable SERVER_PORT.
# Azure App Configuration / container orchestration (Azure Container Apps, AKS) dynamically
# assigns ports at runtime. Set the SERVER_PORT environment variable in your Azure environment
# (App Service → Configuration → Application settings, or Container Apps environment variables).
# Falls back to 8080 for local development only.
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# cr-java-0071 FIX: Hard-coded environment URLs replaced with externalized configuration.
# These endpoint values are loaded from Azure App Configuration at runtime, enabling
# environment-agnostic deployments across dev / staging / production without code changes.
# Override each property via the corresponding environment variable or Azure App Configuration key.
#
# Inventory service available-rooms endpoint (replaces hard-coded
# "http://inventory-service.internal:8081/rooms/available" in BookingController.java line 66).
# Set APP_INVENTORY_AVAILABLE_ENDPOINT in the environment or Azure App Configuration.
app.inventory.available-endpoint=${APP_INVENTORY_AVAILABLE_ENDPOINT:https://inventory-service.internal:8081/rooms/available}
#
# Payment service charge endpoint (replaces hard-coded
# "http://10.0.1.45:9090/payments/charge" in BookingService.java).
# Set APP_PAYMENT_ENDPOINT in the environment or Azure App Configuration.
app.payment.endpoint=${APP_PAYMENT_ENDPOINT:https://payment-svc.internal:9090/charge}
#
# Inventory service rooms endpoint.
# Set APP_INVENTORY_ENDPOINT in the environment or Azure App Configuration.
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:https://inventory-svc.internal:8081/rooms}
#
# Notification service send endpoint.
# Set APP_NOTIFICATION_ENDPOINT in the environment or Azure App Configuration.
app.notification.endpoint=${APP_NOTIFICATION_ENDPOINT:https://notify.internal:7070/send}

# =============================================================================
# cr-java-0090 FIX: Azure Active Directory (Entra ID) Authentication Configuration
# Replaces local file-based credential storage with centralized Azure AD identity
# management using MSAL and Spring Security Azure AD integration.
#
# Register the application in Azure Active Directory (Entra ID) and set the
# following environment variables in your Azure environment
# (App Service → Configuration → Application settings, Container Apps env vars,
# or AKS secrets / Azure Key Vault references):
#
#   AZURE_ACTIVEDIRECTORY_TENANT_ID      – Azure AD tenant ID (Directory ID)
#                                          Found in: Azure Portal → Azure Active Directory → Overview
#   AZURE_ACTIVEDIRECTORY_CLIENT_ID      – Application (client) ID of the registered app
#                                          Found in: Azure Portal → App registrations → <app> → Overview
#   AZURE_ACTIVEDIRECTORY_CLIENT_SECRET  – Client secret for the registered application
#                                          Store in Azure Key Vault; inject via Managed Identity reference
#                                          Create: Azure Portal → App registrations → <app> → Certificates & secrets
#   AZURE_ACTIVEDIRECTORY_APP_ID_URI     – Application ID URI (e.g. api://<client-id>)
#                                          Set in: Azure Portal → App registrations → <app> → Expose an API
#
# The application acts as an OAuth2 Resource Server: it validates Azure AD JWT bearer
# tokens on every request. No local user store, password file, or credential file is used.
# All identity decisions are delegated to Azure Active Directory.
# =============================================================================
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.credential.tenant-id=${AZURE_ACTIVEDIRECTORY_TENANT_ID:your-tenant-id}
spring.cloud.azure.active-directory.credential.client-id=${AZURE_ACTIVEDIRECTORY_CLIENT_ID:your-client-id}
spring.cloud.azure.active-directory.credential.client-secret=${AZURE_ACTIVEDIRECTORY_CLIENT_SECRET:your-client-secret}
spring.cloud.azure.active-directory.app-id-uri=${AZURE_ACTIVEDIRECTORY_APP_ID_URI:api://your-client-id}
# Configure the application as an OAuth2 resource server (validates bearer tokens)
spring.cloud.azure.active-directory.application-type=resource-server
# Azure AD authorization endpoint (auto-resolved from tenant-id; explicit for clarity)
spring.cloud.azure.active-directory.authorization-clients.graph.scopes=https://graph.microsoft.com/.default
