# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0069 REMEDIATED: Azure Key Vault URI for retrieving DB credentials at runtime.
# Set AZURE_KEYVAULT_URI as an environment variable in Azure App Service / Container Apps
# (e.g. https://<vault-name>.vault.azure.net/). DefaultAzureCredential will authenticate
# via Managed Identity when running in Azure, or via Azure CLI / env vars locally.
azure.keyvault.uri=${AZURE_KEYVAULT_URI:https://changeme.vault.azure.net/}

# cr-java-0077 REMEDIATED: Server port externalized via SERVER_PORT environment variable.
# Set SERVER_PORT in Azure App Service application settings or Container Apps environment variables
# to enable dynamic port assignment by Azure container orchestration platforms.
# Defaults to 8080 for local development if SERVER_PORT is not set.
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0071 fix: Externalized inventory service URL for Azure App Configuration.
# Override INVENTORY_SERVICE_URL environment variable in Azure App Service / Container Apps
# application settings, or configure via Azure App Configuration service.
# Example: https://inventory-service.internal:8081/rooms/available
app.inventory.url=${INVENTORY_SERVICE_URL:http://inventory-service.internal:8081/rooms/available}

# Azure Blob Storage configuration (cr-java-0061 remediation).
# Set AZURE_STORAGE_CONNECTION_STRING in the environment or Azure App Service application settings.
# Do NOT hard-code the connection string here; use environment variable substitution.
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=https;AccountName=changeme;AccountKey=changeme;EndpointSuffix=core.windows.net}
# Container names – override per environment via environment variables if needed.
azure.storage.reports-container=${AZURE_STORAGE_REPORTS_CONTAINER:resort-reports}
azure.storage.backup-container=${AZURE_STORAGE_BACKUP_CONTAINER:resort-backups}

# cr-java-0065 REMEDIATED: Azure Cache for Redis connection configuration.
# Replace in-memory HttpSession storage with Redis-backed distributed session state,
# enabling stateless horizontal scaling across multiple Azure App Service /
# Container Apps instances without server affinity.
# Set REDIS_HOST, REDIS_PORT, and REDIS_PASSWORD as environment variables in
# Azure App Service application settings or Container Apps environment variables.
# REDIS_HOST  – hostname of the Azure Cache for Redis instance
#               (e.g. <cache-name>.redis.cache.windows.net)
# REDIS_PORT  – TLS port, typically 6380 for Azure Cache for Redis
# REDIS_PASSWORD – primary or secondary access key from the Azure portal
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=resortslite:session

# cr-java-0067 REMEDIATED: Booking cache TTL for Azure Cache for Redis entries.
# Replaces the static in-memory HashMap (bookingCache) that had no expiry policy,
# causing indefinite memory growth and stale data across instances.
# Set BOOKING_CACHE_TTL_MINUTES in Azure App Service application settings or
# Container Apps environment variables to control how long booking cache entries
# are retained in Redis before automatic expiry.
# Recommended values: 30–120 minutes depending on booking workflow duration.
# Defaults to 60 minutes if the environment variable is not set.
app.booking.cache.ttl-minutes=${BOOKING_CACHE_TTL_MINUTES:60}

# cr-java-0090 REMEDIATED: Azure Active Directory (Entra ID) OAuth2 Resource Server
# configuration. Replaces file-based authentication (local credential files, MD5 token
# generation) with centralised Azure AD identity management via Spring Security OAuth2.
#
# Required environment variables (set in Azure App Service / Container Apps application settings):
#   AZURE_AD_TENANT_ID  – Azure AD tenant ID (GUID), e.g. xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
#   AZURE_AD_CLIENT_ID  – Application (client) ID registered in Azure AD (App Registration)
#
# Spring Security uses these URIs to:
#   1. Fetch the Azure AD public JWKS to validate JWT signatures (jwk-set-uri).
#   2. Verify the 'iss' (issuer) claim in incoming JWT bearer tokens (issuer-uri).
#   3. Verify the 'aud' (audience) claim matches the registered application (AZURE_AD_CLIENT_ID).
#
# Azure AD JWKS endpoint pattern:
#   https://login.microsoftonline.com/{tenant-id}/discovery/v2.0/keys
# Azure AD issuer URI pattern:
#   https://login.microsoftonline.com/{tenant-id}/v2.0
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://login.microsoftonline.com/${AZURE_AD_TENANT_ID:changeme-tenant-id}/discovery/v2.0/keys
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AZURE_AD_TENANT_ID:changeme-tenant-id}/v2.0

# cr-java-0111 REMEDIATED: Azure Service Bus configuration for scheduled message delivery.
# Replaces java.util.Timer and server-local SimpleDateFormat(timezone) scheduling with
# Azure Service Bus scheduled messages, enabling distributed, timezone-agnostic task execution
# across multiple cloud regions and container instances without server affinity.
#
# Required environment variables (set in Azure App Service / Container Apps application settings):
#   AZURE_SERVICEBUS_CONNECTION_STRING – connection string from the Azure Service Bus namespace
#     (e.g. Endpoint=sb://<namespace>.servicebus.windows.net/;SharedAccessKeyName=...;SharedAccessKey=...)
#
# azure.servicebus.report-queue – name of the Service Bus queue for scheduled report tasks.
#   Override AZURE_SERVICEBUS_REPORT_QUEUE per environment if needed.
#   The queue must be created in the Azure Service Bus namespace before deployment.
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.report-queue=${AZURE_SERVICEBUS_REPORT_QUEUE:resort-report-tasks}
