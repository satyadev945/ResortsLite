# ResortsLite - Cloud-Ready Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# -----------------------------------------------------------------------
# cr-java-0065 FIX: Spring Session backed by Amazon ElastiCache for Redis.
# All HTTP session state is stored centrally in Redis, making every application
# instance stateless and enabling horizontal scaling across EC2 instances behind
# an AWS ALB without sticky sessions or server affinity.
#
# Override these via environment variables in cloud deployments:
#   SPRING_REDIS_HOST  — ElastiCache primary endpoint (e.g. my-cluster.abc123.ng.0001.use1.cache.amazonaws.com)
#   SPRING_REDIS_PORT  — Redis port (default 6379)
#   SPRING_SESSION_STORE_TYPE — must be "redis"
# -----------------------------------------------------------------------
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session
spring.session.timeout=1800
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
# -----------------------------------------------------------------------

# -----------------------------------------------------------------------
# cr-java-0067 FIX: Amazon ElastiCache for Redis — booking cache TTL configuration.
# Replaces the former unbounded in-memory HashMap (bookingCache) in BookingController.
# Each booking entry is stored in Redis with a TTL to prevent indefinite memory growth,
# ensure stale entries are evicted, and provide a single shared cache visible to every
# node in the Auto Scaling group.
#
# Override via environment variable:
#   BOOKING_CACHE_TTL_MINUTES — TTL in minutes for each booking cache entry (default 30)
# -----------------------------------------------------------------------
booking.cache.ttl.minutes=${BOOKING_CACHE_TTL_MINUTES:30}
# -----------------------------------------------------------------------

# -----------------------------------------------------------------------
# cr-java-0061 FIX: Amazon S3 configuration replaces hard-coded file paths
# Override these via environment variables in cloud deployments:
#   REPORT_S3_BUCKET, REPORT_S3_BACKUP_PREFIX, AWS_REGION
# -----------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}
report.s3.bucket=${REPORT_S3_BUCKET:resort-reports-bucket}
report.s3.backup-prefix=${REPORT_S3_BACKUP_PREFIX:backups/nightly/}
# -----------------------------------------------------------------------

# -----------------------------------------------------------------------
# cr-java-0077 FIX: Hard-coded port 8080 replaced with AWS SSM Parameter Store +
# environment variable injection. The resolved port value is stored in the Spring
# property 'app.server.port' which is fetched from SSM at startup by SsmParameterStoreConfig.
# Override via environment variable SERVER_PORT or SSM parameter at APP_SERVER_PORT_SSM_PARAM.
# -----------------------------------------------------------------------
app.server.port.ssm-param=${APP_SERVER_PORT_SSM_PARAM:/resortslite/server/port}
server.port=${SERVER_PORT:8080}
app.server.port=${SERVER_PORT:8080}

# -----------------------------------------------------------------------
# cr-java-0069 FIX: DB credentials are NO LONGER stored here.
# They are retrieved at runtime from AWS Secrets Manager using the secret
# identified by DB_SECRET_NAME (or db.secret.name property).
# Set the environment variable DB_SECRET_NAME to the name/ARN of the secret
# in AWS Secrets Manager that holds {"username":"...","password":"..."}.
# -----------------------------------------------------------------------
db.secret.name=${DB_SECRET_NAME:resortslite/db/credentials}

spring.datasource.url=jdbc:postgresql://${DB_HOST:db-prod.resorts-internal.com}:${DB_PORT:5432}/${DB_NAME:resortsdb}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA-Hibernate properties (PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# -----------------------------------------------------------------------
# cr-java-0071 FIX: Environment-specific URLs externalised via AWS SSM Parameter Store.
#
# SSM parameter names (paths) — set these to the actual SSM parameter paths in your
# AWS account. The application fetches the live URL values from SSM at startup.
#
# To override the SSM parameter name itself, set the corresponding environment variable:
#   APP_INVENTORY_URL_SSM_PARAM   — SSM path for the inventory service URL
#   APP_REPORT_DOWNLOAD_BASE_URL_SSM_PARAM — SSM path for the report download base URL
#
# Fallback values (used when SSM is unreachable, e.g. local dev):
#   app.inventory.url             — fallback inventory service URL
#   app.report.download.base-url  — fallback report download base URL
# -----------------------------------------------------------------------
app.inventory.url.ssm-param=${APP_INVENTORY_URL_SSM_PARAM:/resortslite/inventory/url}
app.report.download.base-url.ssm-param=${APP_REPORT_DOWNLOAD_BASE_URL_SSM_PARAM:/resortslite/report/download-base-url}

# Fallback values used when SSM Parameter Store is not reachable (local/dev environments).
# In production these values are overridden by the SSM-resolved values.
app.inventory.url=${APP_INVENTORY_URL:http://inventory-service.internal:8081/rooms/available}
app.report.download.base-url=${APP_REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download/}
