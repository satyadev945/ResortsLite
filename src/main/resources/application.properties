# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:postgresql://db-prod.resorts-internal.com:5432/resorts
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA-Hibernate properties (PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cz-java-0057 Fix: Externalized absolute file paths via environment variables (AKS ConfigMap)
# Override at runtime by setting REPORT_BASE_PATH and BACKUP_PATH environment variables
app.report.base-path=${REPORT_BASE_PATH:/var/reports}
app.backup.path=${BACKUP_PATH:/var/backups/nightly}

# Health Check: Spring Boot Actuator - exposes /actuator/health for container liveness/readiness probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# cz-java-0063 Fix: Spring Session backed by Azure Cache for Redis (AKS + Key Vault CSI Driver)
# Redis host, port, and password are injected at runtime from Azure Key Vault secrets
# mounted as environment variables via the Secrets Store CSI Driver on AKS.
# Set REDIS_HOST, REDIS_PORT, and REDIS_PASSWORD as environment variables (or K8s secret refs).
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=spring:session
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:true}
