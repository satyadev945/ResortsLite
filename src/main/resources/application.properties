# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite
# cr-java-0077 fix: Hard-coded port replaced with environment variable.
# Set SERVER_PORT as an Azure App Service application setting or environment variable to
# allow dynamic port assignment by Azure Container Apps / AKS without code changes.
# Falls back to 8080 when running locally without the variable set.
server.port=${SERVER_PORT:8080}
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0071 fix: Hard-coded inventory availability URL (BookingController line 66) replaced
# with externalized configuration. Override APP_INVENTORY_AVAILABLE_URL per environment via
# Azure App Configuration or App Service application settings.
app.inventory.available-url=${APP_INVENTORY_AVAILABLE_URL:http://inventory-service.internal:8081/rooms/available}

# cr-java-0071 fix: Hard-coded report download base URL (ReportService line 66) replaced
# with externalized configuration. Override APP_REPORTS_DOWNLOAD_BASE_URL per environment via
# Azure App Configuration or App Service application settings.
app.reports.download-base-url=${APP_REPORTS_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download/}

# cr-java-0061 fix: Azure Blob Storage configuration replaces hard-coded file paths.
# Set AZURE_STORAGE_CONNECTION_STRING as an environment variable or Azure App Service
# application setting — never commit real connection strings to source control.
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=https;AccountName=<your-account>;AccountKey=<your-key>;EndpointSuffix=core.windows.net}
azure.storage.reports-container=${AZURE_STORAGE_REPORTS_CONTAINER:reports}
azure.storage.backup-container=${AZURE_STORAGE_BACKUP_CONTAINER:backups}

# cr-java-0069 fix: Azure Key Vault URI for retrieving hard-coded DB credentials.
# Set AZURE_KEYVAULT_URI as an Azure App Service application setting or environment variable.
# When running locally without a vault, set DB_USER and DB_PASS environment variables instead.
# Secrets expected in Key Vault: "db-username", "db-password"
azure.keyvault.uri=${AZURE_KEYVAULT_URI:}

# cr-java-0065 fix: Azure Cache for Redis — externalised session state storage.
# Replace in-memory HttpSession with a distributed Redis-backed store so that all
# application instances share the same session data (stateless horizontal scaling).
# Set AZURE_REDIS_HOST and AZURE_REDIS_PASSWORD as Azure App Service application
# settings or environment variables — never commit real credentials to source control.
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6380}
spring.redis.password=${AZURE_REDIS_PASSWORD:}

# cr-java-0067 fix: Azure Cache for Redis TTL for booking cache entries.
# Replaces the former static in-memory bookingCache (HashMap without TTL) in BookingController.
# Cache entries stored under "cache:booking:<bookingId>" expire after this many minutes,
# preventing indefinite memory growth, OOM errors, and stale data across instances.
# Override BOOKING_CACHE_TTL_MINUTES via Azure App Service application settings or
# environment variable to tune cache lifetime per environment without code changes.
app.booking.cache-ttl-minutes=${BOOKING_CACHE_TTL_MINUTES:30}
# cr-java-0090 fix: Azure Active Directory (Entra ID) authentication configuration.
# Replaces file-based credential storage with centralised, cloud-native identity management.
# Spring Cloud Azure AD starter uses these properties to auto-configure the JwtDecoder
# that validates Azure AD-issued OAuth 2.0 / OIDC JWT bearer tokens on every request.
#
# Required Azure App Service application settings / environment variables:
#   AZURE_AD_TENANT_ID  — Azure AD tenant ID (Directory ID from Azure Portal)
#   AZURE_AD_CLIENT_ID  — Application (client) ID registered in Azure AD App Registrations
#
# To register the application in Azure AD:
#   1. Go to Azure Portal > Azure Active Directory > App registrations > New registration
#   2. Set the redirect URI to https://<your-app>.azurewebsites.net/login/oauth2/code/
#   3. Under "Expose an API", add a scope (e.g., api://<client-id>/Bookings.Read)
#   4. Copy the Tenant ID and Client ID into the environment variables below
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.profile.tenant-id=${AZURE_AD_TENANT_ID:common}
spring.cloud.azure.active-directory.credential.client-id=${AZURE_AD_CLIENT_ID:}
# Application type: resource-server — validates JWT bearer tokens (no redirect-based login)
spring.cloud.azure.active-directory.application-type=resource-server
# JWT issuer URI: Spring Security uses this to fetch the JWKS endpoint for token validation.
# The {tenantId} placeholder is resolved at runtime from spring.cloud.azure.active-directory.profile.tenant-id.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AZURE_AD_TENANT_ID:common}/v2.0

# cr-java-0111 fix: Azure Service Bus configuration for distributed, timezone-agnostic scheduled
# report task delivery. Replaces java.util.Timer and server-local scheduling (original line 70:
# new SimpleDateFormat("yyyy-MM-dd HH:mm:ss").format(new Date())) with Azure Service Bus
# scheduled messages using UTC-based OffsetDateTime — consistent across all cloud regions
# and container instances regardless of host server timezone settings.
#
# Required Azure App Service application settings / environment variables:
#   AZURE_SERVICEBUS_CONNECTION_STRING — Azure Service Bus namespace connection string
#   AZURE_SERVICEBUS_REPORT_QUEUE     — Queue name for report task messages (default: report-tasks)
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.report-queue=${AZURE_SERVICEBUS_REPORT_QUEUE:report-tasks}
