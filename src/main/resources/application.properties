# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 FIX: Port externalized to environment variable SERVER_PORT.
# Azure App Configuration / Azure Container Apps environment settings supply the value at runtime,
# enabling dynamic port assignment required by container orchestration platforms.
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0071 FIX: Externalized environment-specific URLs — replaces hardcoded URLs in
# BookingController and ReportService. Override via Azure App Configuration or environment
# variables (AZURE_INVENTORY_SERVICE_URL, AZURE_REPORTS_BASE_URL) per deployment environment.
# Inventory service URL used by BookingController.checkAvailability()
app.inventory.service.url=${AZURE_INVENTORY_SERVICE_URL:https://inventory-service.internal:8081/rooms/available}
# Report download base URL used by ReportService.buildReportDownloadUrl()
app.reports.base.url=${AZURE_REPORTS_BASE_URL:https://reports.resorts-internal.com/download/}

# Azure Blob Storage configuration — replaces hard-coded file system paths (cr-java-0061)
# Set AZURE_STORAGE_CONNECTION_STRING environment variable in your Azure App Service / Container Apps settings
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=https;AccountName=changeme;AccountKey=changeme;EndpointSuffix=core.windows.net}
# Container names for reports and backups (override via environment variables as needed)
azure.storage.reports-container=${AZURE_STORAGE_REPORTS_CONTAINER:reports}
azure.storage.backup-container=${AZURE_STORAGE_BACKUP_CONTAINER:backups}

# Azure Key Vault configuration — replaces hard-coded DB credentials (cr-java-0069)
# Set AZURE_KEYVAULT_URI to your Key Vault endpoint, e.g. https://<vault-name>.vault.azure.net/
# Secrets required: "db-username" and "db-password"
azure.keyvault.uri=${AZURE_KEYVAULT_URI:https://changeme.vault.azure.net/}

# cr-java-0065 FIX: Azure Cache for Redis — Spring Session configuration.
# Spring Session (enabled via @EnableRedisHttpSession in BookingController) uses these
# settings to connect to Azure Cache for Redis, externalizing all HTTP session state so
# every application instance shares the same session store. This eliminates server affinity
# and allows safe horizontal scaling / auto-scaling on Azure App Service / Container Apps.
#
# Set AZURE_REDIS_HOST to your Azure Cache for Redis hostname (e.g. <cache-name>.redis.cache.windows.net)
# Set AZURE_REDIS_PASSWORD to the primary or secondary access key from the Azure portal.
# Set AZURE_REDIS_PORT if your cache uses a non-default TLS port (default: 6380).
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6380}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.redis.ssl=true
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# cr-java-0111 FIX: Azure Service Bus configuration — replaces java.util.Timer / server-local
# scheduling with Azure Service Bus Scheduled Messages for distributed, timezone-agnostic
# task delivery. Set AZURE_SERVICEBUS_CONNECTION_STRING to your Service Bus namespace
# connection string (e.g. Endpoint=sb://<namespace>.servicebus.windows.net/;SharedAccessKeyName=...;SharedAccessKey=...).
# Set AZURE_SERVICEBUS_REPORT_QUEUE to the name of the queue used for report generation tasks.
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.report-queue=${AZURE_SERVICEBUS_REPORT_QUEUE:report-tasks}

# cr-java-0067 FIX: Azure Cache for Redis — distributed booking cache TTL configuration.
# Replaces the in-memory HashMap (bookingCache) in BookingController with a Redis-backed
# cache entry that automatically expires after the configured TTL. This prevents indefinite
# memory growth, eliminates stale data, and ensures cache consistency across all instances.
# Override AZURE_BOOKING_CACHE_TTL_MINUTES in Azure App Service / Container Apps settings
# to tune expiry per environment (e.g. 15 for staging, 60 for production).
azure.cache.booking.ttl-minutes=${AZURE_BOOKING_CACHE_TTL_MINUTES:30}
