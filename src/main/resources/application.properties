# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:postgresql://db-prod.resorts-internal.com:5432/resortslite
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA-Hibernate properties (PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cz-java-0062: Replaced hardcoded IP address (10.0.1.45) with Kubernetes Service DNS name.
# PAYMENT_SERVICE_URL is injected via Kubernetes ConfigMap / EKS Pod env spec.
PAYMENT_SERVICE_URL=${PAYMENT_SERVICE_URL:http://payment-service:9090/payments/charge}

# cz-java-0057: Absolute file paths externalised to environment variables (ConfigMap injection)
REPORT_BASE_PATH=${REPORT_BASE_PATH:/reports}
BACKUP_PATH=${BACKUP_PATH:/backups}

# health-check-endpoint: Spring Boot Actuator health endpoint configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

# cz-java-0069: Spring Session backed by Amazon ElastiCache (Redis).
# Replaces in-memory HttpSession (lost on container restart/scale) with Redis-backed store.
# REDIS_HOST and REDIS_PORT are injected via Kubernetes Secret / ConfigMap on EKS.
# IRSA (IAM Roles for Service Accounts) is used for secure, credential-free access
# to ElastiCache within the VPC — no static credentials required.
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.ssl=${REDIS_SSL:false}

# cz-java-0070: TTL (in seconds) for booking entries cached in Amazon ElastiCache (Redis).
# Replaces the local in-process HashMap bookingCache that was instance-local and invisible
# to other EKS pod replicas. Injected via Kubernetes ConfigMap on EKS.
BOOKING_CACHE_TTL_SECONDS=${BOOKING_CACHE_TTL_SECONDS:3600}
