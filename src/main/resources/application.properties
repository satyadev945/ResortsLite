# ResortsLite - Cloud-Ready Configuration
# cr-java-0069 FIXED: Hard-coded DB credentials removed from source code.
# Credentials are now fetched at startup from AWS Secrets Manager via
# AwsSecretsManagerConfig. The properties below use environment-variable
# placeholders so that no secret value is stored in this file.
spring.application.name=ResortsLite

# cr-java-0077 FIX (Hard-coded Ports):
# Server port is now driven by the SERVER_PORT environment variable injected at runtime
# by ECS task definition, EKS pod spec, or Elastic Beanstalk environment configuration.
# The SSM parameter /resortslite/server-port holds the authoritative port value per environment.
# Override SERVER_PORT via environment variable in cloud deployment; default is 8080 for local dev.
server.port=${SERVER_PORT:8080}

# cr-java-0069 FIX: DB credentials are loaded from AWS Secrets Manager at startup.
# Set DB_SECRET_NAME to the name/ARN of your Secrets Manager secret.
# The secret must be a JSON object containing at minimum: username, password, host.
# Example secret name: resortslite/db/credentials
DB_SECRET_NAME=${DB_SECRET_NAME:resortslite/db/credentials}

# cr-java-0021 FIX: DB URL now uses environment variable for host/port/SID.
# Override DB_HOST, DB_PORT, DB_SID via environment variables in cloud deployment.
spring.datasource.url=jdbc:oracle:thin:@${DB_HOST:db-prod.resorts-internal.com}:${DB_PORT:1521}:${DB_SID:ORCL}
# Username and password are injected programmatically from Secrets Manager;
# these placeholders serve as a fallback for local development only.
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# cr-java-0021 FIX: Internal service endpoints externalised to environment variables.
# Override via PAYMENT_API_URL, INVENTORY_API_URL, NOTIFICATION_API_URL in cloud deployment.
app.payment.endpoint=${PAYMENT_API_URL:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_API_URL:http://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_API_URL:http://notify.internal:7070/send}

# AWS S3 configuration — replaces hard-coded file-system paths (cr-java-0061)
# Override these values via environment variables in cloud deployment:
#   CLOUD_AWS_S3_BUCKET_NAME, CLOUD_AWS_S3_REPORT_PREFIX, CLOUD_AWS_REGION
cloud.aws.s3.bucket-name=${CLOUD_AWS_S3_BUCKET_NAME:resorts-lite-reports}
cloud.aws.s3.report-prefix=${CLOUD_AWS_S3_REPORT_PREFIX:reports/}
cloud.aws.region=${CLOUD_AWS_REGION:us-east-1}

# cr-java-0071 FIX: AWS SSM Parameter Store — environment-specific URL parameter names.
# Override SSM_INVENTORY_URL_PARAM and SSM_REPORT_DOWNLOAD_URL_PARAM via environment
# variables in cloud deployment to point to the correct SSM parameter paths per environment
# (e.g. /resortslite/dev/inventory-url, /resortslite/prod/inventory-url).
ssm.inventory.url.param=${SSM_INVENTORY_URL_PARAM:/resortslite/inventory-service-url}
ssm.report.download.url.param=${SSM_REPORT_DOWNLOAD_URL_PARAM:/resortslite/report-download-base-url}

# cr-java-0071 FIX: Local-development fallback URLs (used only when SSM is unreachable).
# In production these are overridden by the values stored in SSM Parameter Store.
# Override APP_INVENTORY_URL_DEFAULT and APP_REPORT_DOWNLOAD_URL_DEFAULT as needed.
app.inventory.url.default=${APP_INVENTORY_URL_DEFAULT:https://inventory-service.internal:8081/rooms/available}
app.report.download.url.default=${APP_REPORT_DOWNLOAD_URL_DEFAULT:https://reports.resorts-internal.com:8443/download/}

# cr-java-0077 FIX (Hard-coded Ports — ReportService line 28):
# SSM Parameter Store parameter name for the server port.
# The actual port value is stored in SSM at /resortslite/server-port and injected at runtime.
# Override SSM_SERVER_PORT_PARAM via environment variable to point to the correct SSM path
# per environment (e.g. /resortslite/dev/server-port, /resortslite/prod/server-port).
ssm.server.port.param=${SSM_SERVER_PORT_PARAM:/resortslite/server-port}
# Local-development fallback port (used only when SSM is unreachable).
app.server.port.default=${APP_SERVER_PORT_DEFAULT:8080}

# ---------------------------------------------------------------------------
# cr-java-0065 FIX: Spring Session — Amazon ElastiCache for Redis
# ---------------------------------------------------------------------------
# Spring Session is configured to use Redis as the centralised session store.
# All HttpSession attributes are serialised to ElastiCache so that every
# application instance is fully stateless and any instance can serve any request.
#
# Override the following via environment variables in cloud deployment:
#   SPRING_REDIS_HOST  — ElastiCache primary endpoint (e.g. my-cluster.abc123.ng.0001.use1.cache.amazonaws.com)
#   SPRING_REDIS_PORT  — Redis port (default 6379; TLS port is typically 6380)
#   SPRING_REDIS_SSL   — set to true when using in-transit encryption on ElastiCache
#   SPRING_REDIS_PASSWORD — Redis AUTH token (required when ElastiCache AUTH is enabled)
#   SPRING_SESSION_TIMEOUT — session idle timeout (default 30 minutes)
spring.session.store-type=redis
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.ssl=${SPRING_REDIS_SSL:false}
spring.redis.password=${SPRING_REDIS_PASSWORD:}
spring.session.timeout=${SPRING_SESSION_TIMEOUT:30m}
spring.redis.timeout=${SPRING_REDIS_TIMEOUT:2000ms}

# ---------------------------------------------------------------------------
# cr-java-0090 FIX: Amazon Cognito — replaces file-based authentication
# ---------------------------------------------------------------------------
# File-based authentication (MD5-hashed credentials/tokens stored in local files)
# has been replaced with Amazon Cognito for centralised user identity management.
# Confirmation codes are now Cognito-issued JWT tokens; the Cognito app-client
# secret is stored in AWS Secrets Manager (not in source code or this file).
#
# Override the following via environment variables in cloud deployment:
#   COGNITO_USER_POOL_ID         — Cognito User Pool ID (e.g. us-east-1_AbCdEfGhI)
#   COGNITO_CLIENT_ID            — App client ID within the User Pool
#   COGNITO_CLIENT_SECRET_NAME   — Secrets Manager secret name holding the app-client
#                                  secret (default: resortslite/cognito/client-secret)
#   COGNITO_REGION               — AWS region for Cognito (defaults to cloud.aws.region)
COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID:us-east-1_PLACEHOLDER}
COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID:PLACEHOLDER_CLIENT_ID}
COGNITO_CLIENT_SECRET_NAME=${COGNITO_CLIENT_SECRET_NAME:resortslite/cognito/client-secret}

# ---------------------------------------------------------------------------
# cr-java-0067 FIX: Amazon ElastiCache for Redis — Booking Cache TTL
# ---------------------------------------------------------------------------
# The unbounded static HashMap bookingCache has been replaced with a Redis-backed
# cache via Spring Data RedisTemplate. Each booking entry is stored in ElastiCache
# with a configurable TTL so that memory growth is bounded and all application
# instances share the same cache state.
#
# Override APP_BOOKING_CACHE_TTL_MINUTES via environment variable in cloud
# deployment to tune the expiration window per environment (dev / staging / prod).
# Default is 60 minutes.
app.booking.cache.ttl-minutes=${APP_BOOKING_CACHE_TTL_MINUTES:60}
