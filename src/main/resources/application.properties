spring.application.name=ResortsLite

# Cloud platforms can assign PORT dynamically; Azure App Configuration may also provide server:port.
server.port=${PORT:8080}

# Database configuration is externalized. In Azure, supply these from Key Vault references or managed identity-backed App Configuration.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Azure App Configuration / Key Vault / Blob Storage / Service Bus endpoints are supplied externally per environment.
azure.appconfiguration.endpoint=${AZURE_APP_CONFIGURATION_ENDPOINT:}
azure.keyvault.endpoint=${AZURE_KEY_VAULT_ENDPOINT:}
azure.storage.account-endpoint=${AZURE_STORAGE_ACCOUNT_ENDPOINT:}
azure.storage.reports-container=${AZURE_STORAGE_REPORTS_CONTAINER:reports}
azure.servicebus.fully-qualified-namespace=${AZURE_SERVICEBUS_FULLY_QUALIFIED_NAMESPACE:}
azure.servicebus.report-schedule-queue=${AZURE_SERVICEBUS_REPORT_SCHEDULE_QUEUE:report-schedule}

# Azure Cache for Redis configuration. Values should reference Azure Cache for Redis secrets/settings in deployed environments.
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6379}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.redis.ssl=${AZURE_REDIS_SSL:false}
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:sessions

# Azure Active Directory / Entra ID configuration; values are provided by Azure App Configuration or environment variables.
spring.cloud.azure.active-directory.enabled=${AZURE_AD_ENABLED:false}
spring.cloud.azure.active-directory.profile.tenant-id=${AZURE_AD_TENANT_ID:}
spring.cloud.azure.active-directory.credential.client-id=${AZURE_AD_CLIENT_ID:}
spring.cloud.azure.active-directory.credential.client-secret=${AZURE_AD_CLIENT_SECRET:}

# Cloud-native service endpoints are externalized and default to HTTPS placeholders.
app.payment.endpoint=${PAYMENT_CHARGE_URL:https://payment-service.resorts.example.com/payments/charge}
app.inventory.endpoint=${INVENTORY_AVAILABILITY_URL:https://inventory-service.resorts.example.com/rooms/available}
app.notification.endpoint=${NOTIFICATION_SEND_URL:https://notification-service.resorts.example.com/send}
