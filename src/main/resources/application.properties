# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# Port is injected via environment variable (SERVER_PORT) and can be sourced from AWS Parameter Store
app.server.port=${SERVER_PORT:8080}
app.server.port.ssm-parameter=${SERVER_PORT_SSM_PARAMETER:/resortslite/config/server-port}
server.port=${app.server.port}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
# Credentials are fetched from AWS Secrets Manager (secret id in DB_SECRET_NAME) by DatabaseSecretsConfig.
# DB_USERNAME / DB_PASSWORD are only a local-development fallback and have no defaults.
spring.datasource.url=${DB_URL:jdbc:sqlserver://db-prod.resorts-internal.com:1433;databaseName=ResortsDB;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
app.db.secret-name=${DB_SECRET_NAME:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA-Hibernate properties (SQL Server) — IDENTITY keys, same entity shape as the Oracle Doctor
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# Amazon S3 report storage (externalised via environment variables)
app.report.s3.bucket=${REPORT_S3_BUCKET:resorts-reports}
app.report.s3.prefix=${REPORT_S3_PREFIX:reports/}
app.report.s3.backup-prefix=${BACKUP_S3_PREFIX:backups/nightly/}
app.aws.region=${AWS_REGION:us-east-1}
app.aws.s3.endpoint=${AWS_S3_ENDPOINT:}

# Environment URLs are resolved from AWS Systems Manager Parameter Store (cr-java-0071);
# the values below are only fallbacks supplied via environment variables.
app.ssm.enabled=${SSM_ENABLED:true}
app.aws.ssm.endpoint=${AWS_SSM_ENDPOINT:}
app.inventory.ssm-parameter=${INVENTORY_URL_SSM_PARAMETER:/resortslite/config/inventory-url}
app.inventory.url=${INVENTORY_SERVICE_URL:}
app.report.download.ssm-parameter=${REPORT_DOWNLOAD_URL_SSM_PARAMETER:/resortslite/config/report-download-base-url}
app.report.download.base-url=${REPORT_DOWNLOAD_BASE_URL:}

# HTTP session state is stored in Amazon ElastiCache for Redis via Spring Session (cr-java-0065)
spring.session.store-type=redis
spring.session.redis.namespace=${SESSION_REDIS_NAMESPACE:resortslite:session}
spring.session.redis.flush-mode=on-save
spring.session.redis.repository-type=default
spring.session.timeout=${SESSION_TIMEOUT:30m}
spring.redis.host=${ELASTICACHE_REDIS_HOST:localhost}
spring.redis.port=${ELASTICACHE_REDIS_PORT:6379}
spring.redis.password=${ELASTICACHE_REDIS_AUTH_TOKEN:}
spring.redis.ssl=${ELASTICACHE_REDIS_TLS_ENABLED:true}
spring.redis.timeout=${ELASTICACHE_REDIS_TIMEOUT:2000ms}

# Booking cache in Amazon ElastiCache for Redis with TTL (cr-java-0067)
app.cache.booking.key-prefix=${BOOKING_CACHE_KEY_PREFIX:resortslite:booking:}
app.cache.booking.ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:900}
