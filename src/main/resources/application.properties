# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# Port externalized: set via Azure App Configuration (server.port) or SERVER_PORT/PORT env vars
server.port=${SERVER_PORT:${PORT:8080}}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:postgresql://db-prod.resorts-internal.com:5432/ResortsDB
# Credentials are NOT stored here. They are loaded from Azure Key Vault (DefaultAzureCredential)
# by DatabaseCredentialsConfig using the secret names below.
azure.keyvault.uri=${AZURE_KEYVAULT_URI:}
azure.keyvault.db-username-secret=${AZURE_KEYVAULT_DB_USERNAME_SECRET:db-username}
azure.keyvault.db-password-secret=${AZURE_KEYVAULT_DB_PASSWORD_SECRET:db-password}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool (Spring Boot default)
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.maximum-pool-size=10

# JPA-Hibernate properties (PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# Azure Blob Storage for reports/backups (cr-java-0061) - supply via environment variables / Key Vault
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.account-endpoint=${AZURE_STORAGE_ACCOUNT_ENDPOINT:}
azure.storage.reports-container=${AZURE_STORAGE_REPORTS_CONTAINER:resort-reports}
azure.storage.reports-prefix=${AZURE_STORAGE_REPORTS_PREFIX:reports/}
azure.storage.backup-prefix=${AZURE_STORAGE_BACKUP_PREFIX:backups/nightly/}

# cr-java-0071: Environment-specific URLs are externalized to Azure App Configuration.
# Keys below are resolved from App Configuration (or environment variables as fallback).
spring.config.import=optional:azureAppConfiguration
spring.cloud.azure.appconfiguration.enabled=${AZURE_APPCONFIG_ENABLED:false}
spring.cloud.azure.appconfiguration.stores[0].endpoint=${AZURE_APPCONFIG_ENDPOINT:}
app.inventory.availability-url=${INVENTORY_AVAILABILITY_URL:}
app.reports.download-base-url=${REPORTS_DOWNLOAD_BASE_URL:}

# cr-java-0065: HTTP session state externalized to Azure Cache for Redis (Spring Session).
# Session data is no longer held in instance memory, so any instance can serve any request.
spring.session.store-type=redis
spring.session.redis.namespace=${SPRING_SESSION_REDIS_NAMESPACE:resortslite:session}
spring.session.redis.flush-mode=on-save
spring.session.redis.repository-type=default
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
# Azure Cache for Redis: TLS port 6380; access key supplied via env var / Key Vault (never hardcoded)
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6380}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.redis.ssl=${AZURE_REDIS_SSL:true}
spring.redis.timeout=${AZURE_REDIS_TIMEOUT:5000ms}

# cr-java-0067: Booking cache lives in Azure Cache for Redis with a TTL (ISO-8601 duration)
app.cache.booking-ttl=${BOOKING_CACHE_TTL:PT30M}
