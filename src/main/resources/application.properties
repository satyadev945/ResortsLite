# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:postgresql://db-prod.resorts-internal.com:5432/resortsdb
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA-Hibernate properties (PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# Health check endpoint configuration (Spring Boot Actuator)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

# cz-java-0069 [In-Memory Session Storage - Transitional Fix]:
# ALB Target Group Stickiness is the transitional strategy while Redis migration is pending.
# Configure the ECS Fargate service ALB target group with the following settings:
#   stickiness.enabled                        = true
#   stickiness.type                           = lb_cookie
#   stickiness.lb_cookie.duration_seconds     = ${ALB_STICKY_SESSION_DURATION_SECONDS:86400}
# The ALB AWSALB cookie pins each client to the same Fargate task replica.
# Set ALB_STICKY_SESSION_DURATION_SECONDS in ECS task environment to control cookie TTL (default: 86400s).
alb.sticky.session.duration.seconds=${ALB_STICKY_SESSION_DURATION_SECONDS:86400}
