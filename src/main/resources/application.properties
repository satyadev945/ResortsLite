# ResortsLite - Modernised Configuration
spring.application.name=ResortsLite

# Port is now dynamically assignable; override via SERVER_PORT environment variable
# for local development. Container orchestration (ECS/EKS) will inject the correct value.
server.port=${SERVER_PORT:8080}

# PostgreSQL datasource — all sensitive values externalised to environment variables.
# Set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, and SPRING_DATASOURCE_PASSWORD
# via AWS Parameter Store / Secrets Manager injected as environment variables at runtime.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resortdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings (HikariCP defaults tuned for cloud deployment)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# H2 console disabled — not applicable for PostgreSQL
spring.h2.console.enabled=false

# Service endpoints externalised to environment variables.
# Inject via AWS Parameter Store / ECS task definition environment at runtime.
# HTTPS enforced for all internal service communication.
app.payment.endpoint=${APP_PAYMENT_ENDPOINT:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:https://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${APP_NOTIFICATION_ENDPOINT:https://notify.internal:7070/send}
