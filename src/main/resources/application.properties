# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite
# FIXED cz-java-0061 [Software Portability]: Port now configurable via environment variable
# Allows dynamic port assignment by ECS/EKS and injection from AWS Secrets Manager
# Default to 8080 if SERVER_PORT environment variable is not set
server.port=${SERVER_PORT:8080}


# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:postgresql://${DB_HOST:db-prod.resorts-internal.com}:${DB_PORT:5432}/${DB_NAME:orcl}
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA-Hibernate properties (PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# FIXED cz-java-0057: Configurable file paths for EFS volume mounts in ECS Fargate
# These paths should be mounted to EFS volumes in the ECS task definition
app.report.path=${REPORT_PATH:/mnt/efs/reports}
app.backup.path=${BACKUP_PATH:/mnt/efs/backups}

# Health Check Endpoint Configuration for Containerization
# Spring Boot Actuator provides /actuator/health endpoint for container health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# JWT Configuration for Stateless Authentication (cz-java-0063 fix)
# JWT signing secret should be injected from AWS Secrets Manager in production
# Example: JWT_SECRET environment variable from ECS task definition
jwt.secret=${JWT_SECRET:default-secret-key-for-development-only-min-256-bits-required-for-hs256-algorithm}
# Token expiration: 1 hour (3600000 ms)
jwt.expiration=${JWT_EXPIRATION:3600000}

# AWS ElastiCache Memcached Configuration (cz-java-0070 fix)
# Memcached endpoint should be injected from AWS SSM Parameter Store in ECS Fargate
# Example: MEMCACHED_ENDPOINT environment variable from ECS task definition
# Format: hostname:port (e.g., my-cluster.abc123.cfg.use1.cache.amazonaws.com:11211)
memcached.servers=${MEMCACHED_ENDPOINT:localhost:11211}
# Cache expiration time in seconds (default: 1 hour)
memcached.expiration=${MEMCACHED_EXPIRATION:3600}
