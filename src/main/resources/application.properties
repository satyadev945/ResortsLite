spring.application.name=ResortsLite

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.session.store-type=redis
spring.session.redis.namespace=${SPRING_SESSION_REDIS_NAMESPACE:resortslite}

app.payment.endpoint=${APP_PAYMENT_ENDPOINT:https://payment-svc.azure.internal/charge}
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:https://inventory-svc.azure.internal/rooms/available}
app.notification.endpoint=${APP_NOTIFICATION_ENDPOINT:https://notify.azure.internal/send}
app.report.download-base-url=${APP_REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com}
app.report.backup-location=${APP_REPORT_BACKUP_LOCATION:https://backup.resorts.blob.core.windows.net/nightly}
app.cache.booking.ttl-seconds=${APP_CACHE_BOOKING_TTL_SECONDS:900}

app.storage.blob.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:https://resortstorage.blob.core.windows.net}
app.storage.blob.container-name=${AZURE_STORAGE_BLOB_CONTAINER:reports}

app.keyvault.url=${AZURE_KEYVAULT_URL:https://resort-kv.vault.azure.net/}

app.servicebus.namespace=${AZURE_SERVICEBUS_NAMESPACE:resort-servicebus.servicebus.windows.net}
app.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE:report-jobs}

spring.cloud.azure.appconfiguration.stores[0].endpoint=${AZURE_APP_CONFIGURATION_ENDPOINT:https://resort-config.azconfig.io}
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.profile.tenant-id=${AZURE_TENANT_ID:tenant-id}
spring.cloud.azure.active-directory.credential.client-id=${AZURE_CLIENT_ID:client-id}
