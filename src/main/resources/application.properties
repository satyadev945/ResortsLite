# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# =============================================================================
# cr-java-0090 FIX: Amazon Cognito configuration — replaces file-based authentication
# =============================================================================
# File-based authentication (MD5 token generation stored locally) has been replaced
# with Amazon Cognito for centralised user identity management and AWS Secrets Manager
# for credential storage.  This provides encrypted, auditable authentication with
# built-in user lifecycle management that scales horizontally in cloud environments.
#
# Set the following environment variables in each deployment environment:
#   COGNITO_USER_POOL_ID  — Amazon Cognito User Pool ID (e.g. us-east-1_AbCdEfGhI)
#   COGNITO_REGION        — AWS region for Cognito (default: us-east-1)
#
# Authentication credentials (client secrets, pool credentials) are stored exclusively
# in AWS Secrets Manager — never in source code, local files, or version control.
aws.cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
aws.cognito.region=${COGNITO_REGION:${AWS_REGION:us-east-1}}

# cr-java-0077 fix: Server port is now resolved from AWS Systems Manager Parameter Store at startup
# via the serverPort bean in AwsSsmParameterStoreConfig (SSM param: /resortslite/server/port).
# The hard-coded value 8080 has been removed from application logic (ReportService.java line 28).
# Fallback chain: SSM /resortslite/server/port → SERVER_PORT env var → 8080 (local dev only).
# In ECS/EKS/Elastic Beanstalk, set SERVER_PORT env var or populate the SSM parameter to
# enable dynamic port assignment required by container orchestration and service discovery.
server.port=${SERVER_PORT:8080}
aws.ssm.param.server-port=${SSM_SERVER_PORT_PARAM:/resortslite/server/port}

# cr-java-0069 FIX: Database credentials are now fetched from AWS Secrets Manager at startup.
# The secret name is configured via DB_SECRET_NAME env var (default: resortslite/db/credentials).
# spring.datasource.username and spring.datasource.password are intentionally omitted here;
# they are supplied programmatically by AwsSecretsManagerConfig after secret retrieval.
# For local development without AWS access, set DB_USERNAME / DB_PASSWORD / DB_HOST env vars.
aws.secretsmanager.secret-name=${DB_SECRET_NAME:resortslite/db/credentials}
spring.datasource.url=jdbc:oracle:thin:@${DB_HOST:db-prod.resorts-internal.com}:1521:ORCL
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0061: Amazon S3 configuration — replaces hard-coded absolute file paths.
# Override these values via environment variables (CLOUD_AWS_S3_BUCKET_NAME, etc.)
# or AWS Parameter Store / Secrets Manager in cloud deployments.
cloud.aws.s3.bucket-name=${REPORTS_S3_BUCKET:resorts-reports-bucket}
cloud.aws.s3.report-prefix=${REPORTS_S3_PREFIX:reports/}
cloud.aws.s3.backup-prefix=${BACKUP_S3_PREFIX:backups/nightly/}
cloud.aws.region=${AWS_REGION:us-east-1}

# cr-java-0071 FIX: AWS Systems Manager Parameter Store configuration.
# Hard-coded environment-specific URLs in BookingController (line 66) and ReportService (line 66)
# have been replaced with values resolved from SSM Parameter Store at application startup.
#
# SSM parameter paths (set these in each environment's SSM Parameter Store):
#   /resortslite/inventory/url        — inventory service URL
#   /resortslite/reports/download-url — report download base URL
#
# Override the SSM parameter paths via environment variables:
#   SSM_INVENTORY_URL_PARAM       (default: /resortslite/inventory/url)
#   SSM_REPORT_DOWNLOAD_URL_PARAM (default: /resortslite/reports/download-url)
#
# Fallback environment variables (used when SSM is unreachable, e.g. local dev):
#   INVENTORY_SERVICE_URL       — inventory service URL fallback
#   REPORT_DOWNLOAD_BASE_URL    — report download base URL fallback
aws.ssm.param.inventory-url=${SSM_INVENTORY_URL_PARAM:/resortslite/inventory/url}
aws.ssm.param.report-download-url=${SSM_REPORT_DOWNLOAD_URL_PARAM:/resortslite/reports/download-url}

# =============================================================================
# cr-java-0065 FIX: Spring Session Data Redis — Amazon ElastiCache configuration
# =============================================================================
# All HttpSession state is now stored in Amazon ElastiCache for Redis via Spring
# Session Data Redis (@EnableRedisHttpSession in RedisSessionConfig).  This makes
# session data available to every EC2 instance behind the AWS ALB, eliminating
# server affinity and enabling safe horizontal auto-scaling.
#
# Set the following environment variables in each deployment environment:
#   REDIS_HOST               — ElastiCache primary endpoint hostname
#   REDIS_PORT               — ElastiCache port (default: 6379)
#   REDIS_PASSWORD           — ElastiCache AUTH token (leave empty if not configured)
#   SESSION_TIMEOUT_SECONDS  — session TTL in seconds (default: 1800 = 30 min)
#
# Spring Boot auto-configuration picks up spring.redis.* properties automatically.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
# Store session in Redis (not in-memory)
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session
# Session timeout — override via SERVER_SERVLET_SESSION_TIMEOUT env var (e.g. 1800s = 30 min)
server.servlet.session.timeout=${SESSION_TIMEOUT_SECONDS:1800}s

# =============================================================================
# cr-java-0067 FIX: Amazon ElastiCache for Redis — booking cache TTL configuration
# =============================================================================
# The unbounded in-memory HashMap cache (bookingCache) in BookingController has been
# replaced with Amazon ElastiCache for Redis via Spring Data RedisTemplate.
# Each booking cache entry is written with an explicit TTL enforced by Redis, preventing
# indefinite memory growth, stale data, and cross-instance cache inconsistencies.
#
# Set the following environment variable to control the booking cache TTL:
#   BOOKING_CACHE_TTL_SECONDS — TTL in seconds for each booking cache entry (default: 3600 = 1 hour)
#
# The RedisTemplate bean (bookingRedisTemplate) is defined in RedisCacheConfig and reuses
# the ElastiCache connection configured via REDIS_HOST / REDIS_PORT / REDIS_PASSWORD above.
booking.cache.ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:3600}
