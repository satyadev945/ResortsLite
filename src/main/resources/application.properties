# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:postgresql://db-prod.resorts-internal.com:5432/orcl
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA-Hibernate properties (PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cz-java-0057 [Fixed]: Absolute file paths externalized via environment variables.
# Override these via Kubernetes ConfigMap or Azure App Configuration in container deployments.
app.reports.base-path=${REPORTS_BASE_PATH:/var/reports}
app.reports.backup-path=${REPORTS_BACKUP_PATH:/var/backups/nightly}

# Health check endpoint (containerization requirement): GET /actuator/health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# ---------------------------------------------------------------------------
# cz-java-0063 [Fixed]: Spring Session backed by Azure Cache for Redis.
# HttpSession is now stored in Redis instead of JVM heap, enabling stateless
# horizontal scaling across AKS pods without sticky sessions.
#
# Redis credentials are injected at runtime via the Secrets Store CSI Driver
# mounted from Azure Key Vault — do NOT hardcode values here.
# ---------------------------------------------------------------------------
spring.session.store-type=redis
spring.session.timeout=1800

# Azure Cache for Redis connection — values supplied by Key Vault CSI secrets
# mounted as environment variables in the AKS pod spec.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6380}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:true}
