# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:postgresql://db-prod.resorts-internal.com:5432/orcl
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA-Hibernate properties (PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# Health check endpoint configuration (mandatory containerization requirement)
# Exposes /actuator/health for container liveness/readiness probes (ECS, EKS, ALB)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# ---------------------------------------------------------------------------
# cz-java-0069: ALB Session Affinity — Transitional Strategy for ECS Fargate
# ---------------------------------------------------------------------------
# Enable ALB target-group stickiness (lb_cookie) so that during the Redis
# migration window, a client is consistently routed to the same ECS Fargate
# task that holds its in-memory session state.
#
# ECS Service / ALB Target Group attributes to set (via AWS Console / IaC):
#   stickiness.enabled                  = true
#   stickiness.type                     = lb_cookie
#   stickiness.lb_cookie.duration_seconds = ${ALB_STICKY_DURATION_SECONDS:86400}
#
# Inject ALB_STICKY_DURATION_SECONDS via ECS task-definition environment variable.
alb.sticky.duration.seconds=${ALB_STICKY_DURATION_SECONDS:86400}
