# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# Health check endpoint: expose /actuator/health for container liveness/readiness probes
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# cz-java-0069 FIX: Redis-backed session storage for GKE Autopilot + Vertical Pod Autoscaler.
# Replaces in-memory HttpSession (session.setAttribute calls at source lines 34-35 of
# BookingController.java) with an external Redis store so that session data survives container
# restarts and is shared across all pod replicas without manual memory tuning.
# REDIS_HOST and REDIS_PORT are injected as environment variables at runtime (GKE Secret Store
# CSI driver / Kubernetes ConfigMap) — no hardcoded infrastructure values.
spring.session.store-type=redis
spring.session.redis.namespace=resortsLite:session

# cz-java-0070 FIX: Redis connection for the distributed booking cache (In-Cluster Redis
# StatefulSet on GKE Autopilot with GCP Persistent Disk-backed PVCs).
# Replaces the local in-memory HashMap cache (BookingController source line 19) with a
# distributed cache visible to all pod replicas.
# REDIS_HOST and REDIS_PORT are injected via environment variables — no hardcoded values.
spring.redis.host=${REDIS_HOST:redis-service}
spring.redis.port=${REDIS_PORT:6379}

# cz-java-0070 FIX: TTL for booking cache entries in Redis (seconds).
# Injected via BOOKING_CACHE_TTL_SECONDS env-var; defaults to 3600 s (1 hour).
# Prevents unbounded memory growth on the Redis StatefulSet PVC.
BOOKING_CACHE_TTL_SECONDS=${BOOKING_CACHE_TTL_SECONDS:3600}

# cz-java-0082 FIX: Google Cloud Pub/Sub configuration for async decoupled messaging on GKE.
# Replaces synchronous in-process calls (BookingController line 84, BookingService line 102)
# with event-driven Pub/Sub topics so microservices can operate and scale independently.
# All values are injected via environment variables — no hardcoded infrastructure values.
gcp.project.id=${GCP_PROJECT_ID:my-gcp-project}
pubsub.booking.topic=${PUBSUB_BOOKING_TOPIC:booking-events}
pubsub.report.topic=${PUBSUB_REPORT_TOPIC:report-events}
