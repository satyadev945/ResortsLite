# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 FIX: Hard-coded port 8080 replaced with environment variable SERVER_PORT.
# Azure Container Apps, AKS, and Azure App Service assign ports dynamically at runtime.
# Set SERVER_PORT as an Azure App Service application setting or environment variable.
# Falls back to 8080 for local development if SERVER_PORT is not set.
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:postgresql://db-prod.resorts-internal.com:5432/orcl
# Credentials are now retrieved at runtime from Azure Key Vault (cr-java-0069 remediation).
# The datasource username/password are intentionally omitted here; BookingService resolves
# them via SecretClient using DefaultAzureCredential and the Key Vault URI below.
spring.datasource.driver-class-name=org.postgresql.Driver

# Azure Key Vault URI — set AZURE_KEYVAULT_URI as an App Service application setting
# or as a local environment variable (e.g. export AZURE_KEYVAULT_URI=https://<vault>.vault.azure.net/).
# Secrets expected in the vault: "db-username", "db-password"
azure.keyvault.uri=${AZURE_KEYVAULT_URI:https://changeme.vault.azure.net/}

# JPA-Hibernate properties (PostgreSQL) — dialect updated from Oracle12cDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0071 FIX: Externalized inventory availability URL (was hard-coded in BookingController).
# Override via Azure App Configuration key: app.inventory.available-url
# Example Azure App Configuration value: https://inventory-service.internal:8081/rooms/available
app.inventory.available-url=${APP_INVENTORY_AVAILABLE_URL:http://inventory-service.internal:8081/rooms/available}

# cr-java-0071 FIX: Externalized report download base URL (was hard-coded in ReportService).
# Override via Azure App Configuration key: app.reports.download-base-url
# Example Azure App Configuration value: https://reports.resorts-internal.com/download/
app.reports.download-base-url=${APP_REPORTS_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download/}

# Azure Blob Storage configuration — replaces hard-coded absolute file paths (cr-java-0061).
# Set AZURE_STORAGE_CONNECTION_STRING as an environment variable or Azure App Service setting
# so credentials are never committed to source control.
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=https;AccountName=changeme;AccountKey=changeme;EndpointSuffix=core.windows.net}
# Container names can be overridden per environment via environment variables.
azure.storage.reports-container=${AZURE_STORAGE_REPORTS_CONTAINER:resort-reports}
azure.storage.backup-container=${AZURE_STORAGE_BACKUP_CONTAINER:resort-backups}

# cr-java-0065 FIX: Azure Cache for Redis configuration — replaces in-process HttpSession
# storage with a shared, distributed Redis store. All application instances connect to the
# same Azure Cache for Redis endpoint, enabling stateless horizontal scaling.
# Set AZURE_REDIS_HOST and AZURE_REDIS_PASSWORD as Azure App Service application settings
# or environment variables; never commit credentials to source control.
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6380}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.redis.ssl=${AZURE_REDIS_SSL:true}
spring.redis.timeout=2000ms

# Spring Session: use Redis as the session store and set a 30-minute session timeout.
spring.session.store-type=redis
spring.session.timeout=30m
spring.session.redis.namespace=resortsLite:session

# cr-java-0111 FIX: Azure Service Bus configuration — replaces java.util.Timer and
# server-local scheduling with Azure Service Bus scheduled message delivery for
# distributed, timezone-agnostic task execution across cloud regions and container instances.
# Set AZURE_SERVICEBUS_CONNECTION_STRING as an Azure App Service application setting
# or environment variable; never commit credentials to source control.
# All scheduled enqueue times are expressed in UTC to ensure consistent scheduling
# behaviour regardless of the host JVM's default timezone.
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
# Queue name for scheduled report generation tasks — override per environment.
azure.servicebus.reports-queue=${AZURE_SERVICEBUS_REPORTS_QUEUE:resort-reports-queue}
