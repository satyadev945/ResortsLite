# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# Port is externalised (Azure injects PORT / WEBSITES_PORT; may also come from Azure App Configuration)
server.port=${PORT:${SERVER_PORT:8080}}
app.server.port=${server.port}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db-prod.resorts-internal.com:5432/ResortsDB}
# Credentials are resolved from Azure Key Vault (secrets mapped to env vars at runtime); never committed
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# Azure Key Vault (accessed via DefaultAzureCredential)
app.azure.keyvault.uri=${AZURE_KEYVAULT_URI:}
app.azure.keyvault.db-username-secret=${AZURE_KEYVAULT_DB_USERNAME_SECRET:db-username}
app.azure.keyvault.db-password-secret=${AZURE_KEYVAULT_DB_PASSWORD_SECRET:db-password}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool (Spring Boot default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA-Hibernate properties (PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=${INVENTORY_ENDPOINT:}
app.notification.endpoint=http://notify.internal:7070/send

# Azure Blob Storage (replaces local file system paths for reports/backups)
app.azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
app.azure.storage.endpoint=${AZURE_STORAGE_ENDPOINT:}
app.azure.storage.container=${AZURE_STORAGE_CONTAINER:resort-reports}
app.report.blob.prefix=${REPORT_BLOB_PREFIX:reports/}
app.report.backup.blob.prefix=${REPORT_BACKUP_BLOB_PREFIX:backups/nightly/}

# Azure App Configuration (environment-specific URLs are resolved from the store at runtime;
# keys below are loaded from App Configuration and fall back to environment variables)
spring.cloud.azure.appconfiguration.enabled=${AZURE_APPCONFIG_ENABLED:false}
spring.cloud.azure.appconfiguration.stores[0].endpoint=${AZURE_APPCONFIG_ENDPOINT:}
spring.cloud.azure.appconfiguration.stores[0].selects[0].key-filter=/resortslite/
spring.cloud.azure.appconfiguration.stores[0].selects[0].label-filter=${AZURE_APPCONFIG_LABEL:}
app.inventory.availability-url=${INVENTORY_AVAILABILITY_URL:}
app.report.download-base-url=${REPORT_DOWNLOAD_BASE_URL:}

# Azure Cache for Redis (externalised booking/session state; TLS port 6380)
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6380}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.redis.ssl=${AZURE_REDIS_SSL:true}
spring.redis.timeout=${AZURE_REDIS_TIMEOUT:5000ms}
app.state.ttl-minutes=${APP_STATE_TTL_MINUTES:30}
