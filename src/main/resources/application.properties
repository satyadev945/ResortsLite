spring.application.name=ResortsLite
server.port=${SERVER_PORT:${APP_SERVER_PORT:8080}}

spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.payment.endpoint=${APP_PAYMENT_ENDPOINT:https://payment-svc.internal/charge}
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms}
app.notification.endpoint=${APP_NOTIFICATION_ENDPOINT:https://notify.internal/send}
app.report.download-base-url=${APP_REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download}
app.report.container-name=${AZURE_BLOB_REPORTS_CONTAINER:reports}
app.report.backup-container-name=${AZURE_BLOB_BACKUP_CONTAINER:report-backups}
app.report.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
app.report.storage.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:}
app.config.connection-string=${AZURE_APP_CONFIGURATION_CONNECTION_STRING:}
app.config.endpoint=${AZURE_APP_CONFIGURATION_ENDPOINT:}
app.keyvault.url=${AZURE_KEYVAULT_URL:}
app.keyvault.db-user-secret=${AZURE_KEYVAULT_DB_USER_SECRET:db-user}
app.keyvault.db-pass-secret=${AZURE_KEYVAULT_DB_PASS_SECRET:db-password}
app.redis.host=${AZURE_REDIS_HOST:localhost}
app.redis.port=${AZURE_REDIS_PORT:6379}
app.redis.password=${AZURE_REDIS_PASSWORD:}
app.redis.booking-ttl-seconds=${AZURE_REDIS_BOOKING_TTL_SECONDS:1800}
app.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
app.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE_NAME:report-jobs}
app.servicebus.schedule-delay-seconds=${AZURE_SERVICEBUS_SCHEDULE_DELAY_SECONDS:300}

spring.redis.host=${app.redis.host}
spring.redis.port=${app.redis.port}
spring.redis.password=${app.redis.password}
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session
spring.session.timeout=30m

spring.cloud.azure.active-directory.enabled=true
