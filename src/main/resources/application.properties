# ResortsLite - Azure Cloud Configuration
spring.application.name=ResortsLite

# cr-java-0077 FIX: Hard-coded port 8080 replaced with environment-variable-backed property.
# Override SERVER_PORT (env var) or app.server.port (Azure App Configuration key) per deployment.
# Azure Container Apps / AKS will inject the correct port at runtime; no code change required.
server.port=${SERVER_PORT:8080}

# cr-java-0077 FIX: Externalized server port reference used inside application logic
# (ReportService). Sourced first from Azure App Configuration key "app.server.port",
# then falls back to the SERVER_PORT environment variable, and finally defaults to 8080.
app.server.port=${APP_SERVER_PORT:${SERVER_PORT:8080}}

# cr-java-0021 FIX: Hardcoded DB credentials replaced with environment-variable-backed properties.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# cr-java-0071 FIX: Hard-coded environment-specific service URLs replaced with externalized
# properties sourced from Azure App Configuration. Override these values per environment
# (dev / staging / production) via Azure App Configuration key-value pairs or environment
# variables — no code change required between deployments.
#
# Azure App Configuration keys (recommended naming convention):
#   ResortsLite:app.inventory.url
#   ResortsLite:app.payment.endpoint
#   ResortsLite:app.notification.endpoint
#   ResortsLite:app.report.download.base-url
#
# Set AZURE_APPCONFIG_ENDPOINT to your Azure App Configuration endpoint, e.g.:
#   https://<appconfig-name>.azconfig.io
# The Spring Cloud Azure App Configuration starter will automatically load all
# key-values from that store at application startup.
app.inventory.url=${APP_INVENTORY_URL:http://inventory-svc.internal:8081/rooms}
app.payment.endpoint=${APP_PAYMENT_ENDPOINT:http://payment-svc.internal:9090/charge}
app.notification.endpoint=${APP_NOTIFICATION_ENDPOINT:http://notify.internal:7070/send}
app.report.download.base-url=${APP_REPORT_DOWNLOAD_BASE_URL:http://reports.resorts-internal.com:8080/download/}

# Azure Blob Storage configuration (cr-java-0061: replaces hard-coded local file paths)
# Set AZURE_STORAGE_CONNECTION_STRING as an environment variable or Azure App Service setting
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=https;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OGLjX+N30byaQuvaQaN/T2wZLskngwd4W6Az3QLZFbektA==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:resort-reports}
azure.storage.backup-container-name=${AZURE_STORAGE_BACKUP_CONTAINER_NAME:resort-backups}

# Azure Key Vault configuration (cr-java-0069: replaces hard-coded DB credentials)
# Set AZURE_KEYVAULT_URI to your Key Vault URI, e.g. https://<vault-name>.vault.azure.net/
# Secrets required in Key Vault:
#   - "db-username" : database username (replaces hard-coded "admin")
#   - "db-password" : database password (replaces hard-coded "Resort$Pass#2019!")
azure.keyvault.uri=${AZURE_KEYVAULT_URI:https://resortslite-kv.vault.azure.net/}


# cr-java-0065 FIX: Azure Cache for Redis configuration — externalizes HTTP session state
# to a distributed Redis store so all application instances are stateless and horizontally
# scalable. Set AZURE_REDIS_HOST and AZURE_REDIS_PASSWORD as environment variables or
# Azure App Service application settings. The Redis host is the <cache-name>.redis.cache.windows.net
# hostname from your Azure Cache for Redis resource; the password is the primary access key.
spring.redis.host=${AZURE_REDIS_HOST:localhost}

# cr-java-0090 FIX: Azure Active Directory (Entra ID) configuration for Spring Security.
# Replaces file-based authentication (local credential files, in-process MD5 token storage)
# with centralized, cloud-native identity management via Azure AD OAuth2/OIDC.
#
# Required Azure AD app registration values — set as environment variables or
# Azure App Service application settings (never hard-code in source):
#   AZURE_AD_TENANT_ID    : Azure AD tenant ID (Directory ID from Azure portal)
#   AZURE_AD_CLIENT_ID    : Application (client) ID of the registered app
#   AZURE_AD_CLIENT_SECRET: Client secret generated for the app registration
#
# Authentication flow:
#   1. Clients authenticate against Azure AD and receive a JWT Bearer token.
#   2. API requests include the token in the Authorization: Bearer <token> header.
#   3. Spring Security validates the token against Azure AD's JWKS endpoint.
#   4. No credentials or security tokens are stored in local files.
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.credential.client-id=${AZURE_AD_CLIENT_ID:}
spring.cloud.azure.active-directory.credential.client-secret=${AZURE_AD_CLIENT_SECRET:}
spring.cloud.azure.active-directory.profile.tenant-id=${AZURE_AD_TENANT_ID:}

# cr-java-0090 FIX: OAuth2 resource server JWT issuer URI — Spring Security uses this to
# fetch Azure AD's JWKS public keys and validate incoming Bearer token signatures.
# Format: https://login.microsoftonline.com/{tenant-id}/v2.0
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AZURE_AD_TENANT_ID:common}/v2.0
spring.redis.timeout=2000ms

# cr-java-0065 FIX: Spring Session store type set to Redis so HttpSession is transparently
# backed by Azure Cache for Redis. Session timeout is 30 minutes to match the TTL used
# in RedisTemplate.opsForValue().set() calls in BookingController.
spring.session.store-type=redis
spring.session.timeout=30m
# The Spring Cloud Azure App Configuration starter loads all key-values from this store
# at startup, allowing environment-specific URLs to be managed centrally without code changes.
spring.cloud.azure.appconfiguration.stores[0].endpoint=${AZURE_APPCONFIG_ENDPOINT:https://resortslite-appconfig.azconfig.io}

# cr-java-0111 FIX: Azure Service Bus configuration for distributed, timezone-agnostic
# scheduled task execution. Replaces java.util.Timer and server-local scheduling.
# Messages are enqueued with an explicit UTC OffsetDateTime via scheduleMessage(), ensuring
# consistent scheduling behaviour across all cloud regions and container instances.
#
# Required Azure Service Bus resources:
#   - A Service Bus Namespace (Standard or Premium tier for scheduled messages)
#   - A queue named as per AZURE_SERVICEBUS_REPORT_QUEUE_NAME (default: resort-report-tasks)
#
# Set AZURE_SERVICEBUS_CONNECTION_STRING as an environment variable or
# Azure App Service application setting (never hard-code in source):
#   AZURE_SERVICEBUS_CONNECTION_STRING : Primary/secondary connection string from the
#                                        Service Bus namespace Shared Access Policies blade.
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:Endpoint=sb://resortslite-sb.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=placeholder}
azure.servicebus.report-queue-name=${AZURE_SERVICEBUS_REPORT_QUEUE_NAME:resort-report-tasks}
