# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# ---------------------------------------------------------------------------
# cr-java-0065 FIX: Spring Session backed by Amazon ElastiCache for Redis
# ---------------------------------------------------------------------------
# Instructs Spring Boot to use Redis as the HTTP session store.  Spring
# Session's SessionRepositoryFilter intercepts all HttpSession calls and
# transparently reads/writes session data from/to the shared Redis cluster,
# so every EC2 instance in the Auto Scaling Group shares the same session
# state — no ALB sticky sessions required.
spring.session.store-type=redis

# Default session timeout (30 minutes).  Override via SESSION_TIMEOUT_SECONDS
# environment variable or AWS Systems Manager Parameter Store.
spring.session.timeout=${SESSION_TIMEOUT_SECONDS:1800}

# Redis namespace prefix for session keys stored in ElastiCache.
spring.session.redis.namespace=resortslite:session

# Amazon ElastiCache for Redis connection settings.
# Set REDIS_HOST to the ElastiCache Primary Endpoint (e.g. my-cluster.abc123.ng.0001.use1.cache.amazonaws.com).
# Set REDIS_PORT if using a non-default port (default: 6379).
# In production, store these values in AWS Secrets Manager or Parameter Store and
# inject them as environment variables in the ECS task definition / EC2 launch template.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
# Optional: set REDIS_PASSWORD if your ElastiCache cluster has AUTH enabled.
spring.redis.password=${REDIS_PASSWORD:}
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# cr-java-0067 FIX: Amazon ElastiCache for Redis — Booking Cache TTL
# ---------------------------------------------------------------------------
# TTL (in minutes) for booking entries stored in the Redis cache via RedisTemplate.
# This replaces the former unbounded in-memory HashMap (bookingCache) that had no
# expiration policy, causing indefinite memory growth and stale data across instances.
# Override via the BOOKING_CACHE_TTL_MINUTES environment variable at deployment time.
booking.cache.ttl.minutes=${BOOKING_CACHE_TTL_MINUTES:30}
# ---------------------------------------------------------------------------

# cr-java-0061 FIX: Amazon S3 configuration replaces hard-coded file paths.
# Set these via environment variables (AWS_S3_REPORTS_BUCKET_NAME, AWS_S3_BACKUP_BUCKET_NAME,
# AWS_S3_REGION) or AWS Parameter Store / Secrets Manager in production.
aws.s3.reports.bucket-name=${AWS_S3_REPORTS_BUCKET_NAME:resortslite-reports}
aws.s3.backup.bucket-name=${AWS_S3_BACKUP_BUCKET_NAME:resortslite-backups}
aws.s3.region=${AWS_S3_REGION:us-east-1}

# cr-java-0071 FIX: AWS Systems Manager Parameter Store configuration for environment URLs.
# Hard-coded environment-specific URLs have been removed from source code and replaced with
# SSM Parameter Store lookups. Set the parameter paths below to point to the SSM parameters
# that hold the actual URL values for each deployment environment (dev / staging / production).
# The SSM region defaults to the same region as S3 (aws.s3.region).
aws.ssm.region=${AWS_SSM_REGION:us-east-1}
# SSM parameter path for the inventory service URL (was hard-coded in BookingController.java:66)
aws.ssm.parameter.inventory-url=${AWS_SSM_PARAM_INVENTORY_URL:/resortslite/inventory/service-url}
# SSM parameter path for the report download base URL (was hard-coded in ReportService.java:66)
aws.ssm.parameter.report-download-url=${AWS_SSM_PARAM_REPORT_DOWNLOAD_URL:/resortslite/reports/download-base-url}


# cr-java-0077 FIX: Hard-coded port 8080 removed from application logic.
# server.port is now driven by the SERVER_PORT environment variable, which ECS task definitions,
# EKS pod specs, or Elastic Beanstalk environment configurations inject at deployment time.
# The recommended approach is to store the port value in AWS Systems Manager Parameter Store
# (path: /resortslite/server/port) and reference it in the container environment configuration.
# The default value (8080) is retained only for local development convenience.
server.port=${SERVER_PORT:8080}
# SSM Parameter Store path for the server port (used by ReportService to expose port metadata).
aws.ssm.parameter.server-port=${AWS_SSM_PARAM_SERVER_PORT:/resortslite/server/port}
# Alias property so @Value("${server.port.value}") resolves correctly alongside Spring's
# built-in server.port binding (Spring Boot reserves server.port for the embedded container).
server.port.value=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:postgresql://db-prod.resorts-internal.com:5432/resortslite
spring.datasource.driver-class-name=org.postgresql.Driver
# cr-java-0069 FIX: Hard-coded DB username and password removed.
# Credentials are now retrieved at runtime from AWS Secrets Manager via BookingService.
# Set DB_SECRET_NAME to the Secrets Manager secret name holding {"username":"...","password":"..."}.
# Set AWS_REGION to the AWS region where the secret is stored.
# For Spring DataSource auto-configuration, credentials can also be injected via:
#   spring.datasource.username=${DB_USERNAME} and spring.datasource.password=${DB_PASSWORD}
# where DB_USERNAME / DB_PASSWORD are populated from Secrets Manager by a startup hook or
# AWS Parameter Store integration (e.g. Spring Cloud AWS or ECS secrets injection).
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
DB_SECRET_NAME=${DB_SECRET_NAME:resortslite/db/credentials}
AWS_REGION=${AWS_REGION:us-east-1}

# JPA-Hibernate properties (PostgreSQL) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send
