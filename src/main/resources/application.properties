spring.application.name=ResortsLite

# Cloud platforms assign ports dynamically; SERVER_PORT can be supplied by Azure App Service,
# Azure Container Apps, or Azure App Configuration imported into the environment.
server.port=${SERVER_PORT:8080}

# Datasource values are externalized. In Azure, provide these from Azure Key Vault references
# or App Configuration; no source-code credentials are required.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Azure App Configuration and Key Vault endpoints used by Azure SDK clients.
azure.app-configuration.endpoint=${AZURE_APP_CONFIGURATION_ENDPOINT:}
azure.key-vault.endpoint=${AZURE_KEY_VAULT_ENDPOINT:}

# Azure Blob Storage for reports/backups. Either provide a connection string or rely on
# DefaultAzureCredential with AZURE_STORAGE_ACCOUNT_ENDPOINT.
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.account-endpoint=${AZURE_STORAGE_ACCOUNT_ENDPOINT:}
azure.storage.reports-container=${AZURE_STORAGE_REPORTS_CONTAINER:reports}
azure.storage.backups-container=${AZURE_STORAGE_BACKUPS_CONTAINER:backups}

# Azure Cache for Redis backs Spring Session and application booking cache.
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6379}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.session.store-type=redis
app.cache.booking-ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:3600}

# Azure Service Bus scheduled message delivery replaces local timers.
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.report-schedule-queue=${AZURE_SERVICEBUS_REPORT_QUEUE:report-schedule}

# Azure AD / Entra ID resource server configuration.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_AD_ISSUER_URI:}
spring.cloud.azure.active-directory.enabled=${AZURE_AD_ENABLED:false}
spring.cloud.azure.active-directory.profile.tenant-id=${AZURE_AD_TENANT_ID:}
spring.cloud.azure.active-directory.credential.client-id=${AZURE_AD_CLIENT_ID:}

# External service endpoints are loaded from Azure App Configuration first, then env vars.
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment.example.invalid/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory.example.invalid/rooms/available}
app.report.download-base-url=${REPORT_DOWNLOAD_BASE_URL:https://reports.example.invalid/download/}
