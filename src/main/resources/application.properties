# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
# cr-java-0077 fix: Hard-coded port 8080 replaced with environment variable injection backed by
# AWS Systems Manager Parameter Store at path /resortslite/server/port.
# In ECS, set the SERVER_PORT environment variable in the task definition (or inject from SSM).
# In EKS, set SERVER_PORT in the pod spec env section referencing a ConfigMap or SSM secret.
# In Elastic Beanstalk, set SERVER_PORT as an environment property.
# SSM Parameter Store path: /resortslite/server/port
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:oracle:thin:@db-prod.resorts-internal.com:1521:ORCL
# cr-java-0069 FIX: DB username and password are no longer stored here.
# Credentials are fetched at runtime from AWS Secrets Manager via BookingService.
# Set DB_SECRET_NAME env var (or app.db.secret-name property) to the Secrets Manager secret name.
# Set AWS_REGION env var (or app.db.secret-region property) to the AWS region.
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0071 fix: Environment-specific URLs externalized via AWS Systems Manager Parameter Store.
# These properties replace hard-coded URLs in BookingController and ReportService.
# In AWS deployments, set the corresponding environment variables (INVENTORY_SERVICE_URL,
# REPORT_DOWNLOAD_BASE_URL) from SSM Parameter Store using ECS task definition secrets,
# Spring Cloud AWS SSM integration, or the AWS AppConfig / Parameter Store agent.
# SSM Parameter Store paths:
#   /resortslite/inventory/service-url   -> INVENTORY_SERVICE_URL
#   /resortslite/report/download-base-url -> REPORT_DOWNLOAD_BASE_URL
app.inventory.service-url=${INVENTORY_SERVICE_URL:http://inventory-service.internal:8081/rooms/available}
app.report.download-base-url=${REPORT_DOWNLOAD_BASE_URL:http://reports.resorts-internal.com:8080/download/}

# cr-java-0061 fix: Amazon S3 configuration replaces hard-coded local file paths.
# Override these via environment variables (AWS_S3_BUCKET_NAME, AWS_S3_REPORT_PREFIX,
# AWS_S3_BACKUP_PREFIX) or inject from AWS Parameter Store / Secrets Manager at deploy time.
app.s3.bucket-name=${AWS_S3_BUCKET_NAME:resorts-reports-bucket}
app.s3.report-prefix=${AWS_S3_REPORT_PREFIX:reports/}
app.s3.backup-prefix=${AWS_S3_BACKUP_PREFIX:backups/nightly/}

# cr-java-0069: AWS Secrets Manager configuration for database credentials.
# DB_SECRET_NAME  — name/ARN of the Secrets Manager secret holding DB credentials JSON
#                   e.g. resorts/db/credentials  ->  {"username":"...","password":"..."}
# AWS_REGION      — AWS region where the secret is stored (e.g. us-east-1)
app.db.secret-name=${DB_SECRET_NAME:resorts/db/credentials}
app.db.secret-region=${AWS_REGION:us-east-1}

# cr-java-0065 fix: Amazon ElastiCache for Redis configuration via Spring Session.
# HttpSession state has been replaced with distributed session storage in Redis,
# enabling stateless application instances that can be horizontally scaled behind
# an AWS ALB without server affinity or sticky sessions.
#
# In AWS deployments, set REDIS_HOST and REDIS_PORT from the ElastiCache cluster
# endpoint (available in the ElastiCache console or via AWS CLI).
# For ECS: inject via task definition environment variables or Secrets Manager.
# For EKS: inject via ConfigMap or Secrets referencing the ElastiCache endpoint.
# For Elastic Beanstalk: set as environment properties in the EB console.
#
# ElastiCache cluster endpoint example: my-cluster.abc123.ng.0001.use1.cache.amazonaws.com
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# Spring Session store type — use Redis for distributed session management
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# cr-java-0067 fix: Amazon ElastiCache for Redis cache TTL configuration.
# Replaces the unbounded static in-memory HashMap (bookingCache) in BookingController
# with a centralized Redis cache that enforces automatic expiration via TTL.
# This prevents indefinite memory growth, stale data inconsistencies across instances,
# and ensures all horizontally scaled EC2 nodes share the same cache state.
#
# BOOKING_CACHE_TTL_MINUTES — TTL (in minutes) for booking cache entries stored in Redis.
# After this period, entries are automatically evicted by ElastiCache, ensuring freshness.
# Default: 60 minutes. Override via environment variable or SSM Parameter Store.
#
# SSM Parameter Store path: /resortslite/cache/booking-ttl-minutes
# Redis cache key pattern:  cache:booking:<bookingId>
app.cache.booking-ttl-minutes=${BOOKING_CACHE_TTL_MINUTES:60}

# cr-java-0090 fix: Amazon Cognito configuration for user identity management.
# Replaces file-based authentication (local credential files + MD5 hashing) with
# Amazon Cognito User Pools, providing centralized, encrypted, and auditable
# authentication with built-in user lifecycle management.
#
# In AWS deployments, set the following environment variables from AWS Secrets Manager
# or Parameter Store:
#   COGNITO_USER_POOL_ID  — the Cognito User Pool ID (e.g. us-east-1_AbCdEfGhI)
#   COGNITO_CLIENT_ID     — the Cognito App Client ID (e.g. 1example23456789)
#   COGNITO_REGION        — the AWS region where the User Pool is hosted (e.g. us-east-1)
#
# SSM Parameter Store paths (recommended):
#   /resortslite/cognito/user-pool-id   -> COGNITO_USER_POOL_ID
#   /resortslite/cognito/client-id      -> COGNITO_CLIENT_ID
#   /resortslite/cognito/region         -> COGNITO_REGION
app.cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
app.cognito.client-id=${COGNITO_CLIENT_ID:}
app.cognito.region=${COGNITO_REGION:${AWS_REGION:us-east-1}}
