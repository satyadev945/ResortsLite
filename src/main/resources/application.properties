spring.application.name=ResortsLite

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=${SPRING_H2_CONSOLE_PATH:/h2-console}

app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-service.internal/payments/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-service.internal/rooms/available}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal/send}
app.report.download-base-url=${REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download}
app.report.container-name=${AZURE_STORAGE_REPORTS_CONTAINER:reports}
app.report.backup-container-name=${AZURE_STORAGE_BACKUPS_CONTAINER:report-backups}
app.report.schedule-queue=${AZURE_SERVICEBUS_REPORT_QUEUE:report-jobs}
app.report.schedule-delay-seconds=${AZURE_SERVICEBUS_REPORT_DELAY_SECONDS:300}

azure.appconfiguration.enabled=${AZURE_APPCONFIGURATION_ENABLED:false}
azure.appconfiguration.stores[0].connection-string=${AZURE_APPCONFIG_CONNECTION_STRING:}

spring.cloud.azure.credential.managed-identity-enabled=${AZURE_MANAGED_IDENTITY_ENABLED:false}

spring.cloud.azure.redis.host=${AZURE_REDIS_HOST:localhost}
spring.cloud.azure.redis.port=${AZURE_REDIS_PORT:6379}
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6379}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session
spring.session.timeout=30m

spring.cloud.azure.active-directory.enabled=${AZURE_ACTIVE_DIRECTORY_ENABLED:false}
spring.cloud.azure.active-directory.profile.tenant-id=${AZURE_TENANT_ID:}
spring.cloud.azure.active-directory.credential.client-id=${AZURE_CLIENT_ID:}

app.keyvault.url=${AZURE_KEYVAULT_URL:}
app.keyvault.db-user-secret=${AZURE_KEYVAULT_DB_USER_SECRET:db-user}
app.keyvault.db-pass-secret=${AZURE_KEYVAULT_DB_PASS_SECRET:db-password}
app.keyvault.auth-secret=${AZURE_KEYVAULT_AUTH_SECRET:booking-auth-token}

app.azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:UseDevelopmentStorage=true}
app.azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:Endpoint=sb://localhost/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=local}

app.cache.booking.ttl-minutes=${BOOKING_CACHE_TTL_MINUTES:30}
