# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# FIXED cr-java-0077: Port configuration externalized to AWS Parameter Store and environment variables
# In production, set via:
# 1. AWS Parameter Store: /config/resortslite/server.port
# 2. Environment variable: SERVER_PORT (set by ECS/EKS/Elastic Beanstalk)
# 3. Container orchestration platform will dynamically assign ports
# Local development default: 8080
server.port=${SERVER_PORT:8080}

# AWS Secrets Manager Configuration for Database Credentials
# Database credentials are now stored in AWS Secrets Manager
# Secret name format: /secret/resortslite/database
# Expected secret JSON structure:
# {
#   "url": "jdbc:oracle:thin:@db-prod.resorts-internal.com:1521:ORCL",
#   "username": "admin",
#   "password": "Resort$Pass#2019!"
# }
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# FIXED cr-java-0071: Service endpoints externalized to AWS Systems Manager Parameter Store
# These values should be stored in AWS Systems Manager Parameter Store in production:
# - /config/resortslite/app.payment.endpoint
# - /config/resortslite/app.inventory.endpoint (base URL without path)
# - /config/resortslite/app.inventory.service.url (full service URL)
# - /config/resortslite/app.notification.endpoint
# - /config/resortslite/app.reports.download.base.url
# Default values below are for local development only
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:http://inventory-svc.internal:8081/rooms}
app.inventory.service.url=${APP_INVENTORY_SERVICE_URL:http://inventory-service.internal:8081}
app.notification.endpoint=http://notify.internal:7070/send
app.reports.download.base.url=${APP_REPORTS_DOWNLOAD_BASE_URL:http://reports.resorts-internal.com:8080}

# AWS S3 Configuration for Report Storage (replaces hard-coded file paths)
# These values should be externalized to AWS Parameter Store or environment variables in production
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:resorts-reports-bucket}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.reports.prefix=reports/
aws.s3.backups.prefix=backups/nightly/

# AWS Secrets Manager Configuration
# Enable AWS Secrets Manager integration
aws.secretsmanager.enabled=true
aws.secretsmanager.secret-name=/secret/resortslite/database
aws.secretsmanager.region=${AWS_REGION:us-east-1}

# AWS Systems Manager Parameter Store Configuration
# Enable Parameter Store integration for externalized configuration
aws.parameterstore.enabled=${AWS_PARAMETER_STORE_ENABLED:true}
aws.parameterstore.region=${AWS_REGION:us-east-1}
# Parameter Store paths follow the pattern: /config/resortslite/<property.name>
# Example: /config/resortslite/app.inventory.service.url

# Spring Session Redis Configuration (FIXED cr-java-0065)
# Replaces HTTP session storage with Amazon ElastiCache for Redis
# This enables stateless application instances with centralized, distributed session management
spring.session.store-type=redis
spring.session.redis.namespace=spring:session
spring.session.timeout=1800s

# Redis Connection Configuration for Amazon ElastiCache
# In production, set these via environment variables or AWS Parameter Store:
# - REDIS_HOST: ElastiCache cluster endpoint (e.g., resorts-session-cache.abc123.0001.use1.cache.amazonaws.com)
# - REDIS_PORT: ElastiCache port (default: 6379)
# - REDIS_PASSWORD: Auth token if ElastiCache encryption in-transit is enabled
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}

# Redis Cache Configuration (FIXED cr-java-0067: In-Memory Caching Without TTL)
# Replaces unbounded in-memory HashMap caching with Amazon ElastiCache for Redis
# Benefits:
# - Distributed caching across all application instances
# - Automatic TTL-based expiration (30 minutes default)
# - Prevents memory leaks from unbounded cache growth
# - Cache consistency across horizontally scaled instances
# - Automatic eviction policies (LRU) managed by Redis
spring.cache.type=redis
spring.cache.redis.time-to-live=1800000

# AWS Cognito Configuration (FIXED cr-java-0090: File-based Authentication)
# Replaces file-based authentication with AWS Cognito for centralized user identity management
# In production, set these via environment variables or AWS Parameter Store:
# - AWS_COGNITO_USER_POOL_ID: Cognito User Pool identifier (e.g., us-east-1_AbCdEfGhI)
# - AWS_COGNITO_CLIENT_ID: Application client ID from Cognito User Pool
# Benefits:
# - Centralized user authentication and authorization
# - Built-in user lifecycle management (registration, password reset, MFA)
# - Encrypted credential storage with automatic rotation support
# - Horizontal scalability for distributed cloud environments
aws.cognito.enabled=${AWS_COGNITO_ENABLED:false}
aws.cognito.user-pool-id=${AWS_COGNITO_USER_POOL_ID:}
aws.cognito.client-id=${AWS_COGNITO_CLIENT_ID:}
