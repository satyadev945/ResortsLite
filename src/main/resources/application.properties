# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 FIX: Hard-coded port 8080 replaced with environment-variable injection.
# The SERVER_PORT environment variable is injected at runtime by ECS task definitions,
# EKS pod specs, or Elastic Beanstalk environment properties, enabling dynamic port
# assignment required by container orchestration and cloud service discovery.
# AWS Systems Manager Parameter Store parameter: /resortslite/server/port
# Override at runtime: export SERVER_PORT=<port>  (ECS/EKS env var injection)
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:postgresql://db-prod.resorts-internal.com:5432/orcl
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA-Hibernate properties (PostgreSQL) — replaces Oracle12cDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0061 FIX: Amazon S3 configuration replacing hard-coded file paths.
# Override these values via environment variables or AWS Parameter Store.
# AWS_S3_BUCKET_NAME  – name of the pre-provisioned S3 bucket for reports
# AWS_S3_REPORT_PREFIX – key prefix for monthly reports (default: reports/)
# AWS_S3_BACKUP_PREFIX – key prefix for nightly backups (default: backups/)
# AWS_REGION           – AWS region where the bucket resides (default: us-east-1)
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:resort-reports-bucket}
aws.s3.report-prefix=${AWS_S3_REPORT_PREFIX:reports/}
aws.s3.backup-prefix=${AWS_S3_BACKUP_PREFIX:backups/}
aws.region=${AWS_REGION:us-east-1}

# cr-java-0071 FIX: AWS Systems Manager Parameter Store parameter names for environment-specific URLs.
# These properties replace hard-coded environment URLs with SSM Parameter Store lookups,
# enabling environment-agnostic deployments across dev, staging, and production.
# The actual URL values are stored in SSM Parameter Store per environment and resolved at runtime.
#
# SSM parameter: /resortslite/inventory/service-url
#   Stores the inventory service base URL (e.g. https://inventory-service.internal:8081/rooms/available)
app.ssm.inventory-url-param=${APP_SSM_INVENTORY_URL_PARAM:/resortslite/inventory/service-url}
# SSM parameter: /resortslite/reports/download-base-url
#   Stores the report download base URL (e.g. https://reports.resorts-internal.com/download/)
app.ssm.report-download-url-param=${APP_SSM_REPORT_DOWNLOAD_URL_PARAM:/resortslite/reports/download-base-url}
# cr-java-0077 FIX: SSM parameter name for the server port.
# Stores the server port value in AWS Systems Manager Parameter Store, enabling
# dynamic port assignment without code changes across dev, staging, and production.
# SSM parameter: /resortslite/server/port  (e.g. value: "8080")
app.ssm.server-port-param=${APP_SSM_SERVER_PORT_PARAM:/resortslite/server/port}

# =============================================================================
# cr-java-0065 FIX: Amazon ElastiCache for Redis — Spring Session configuration
# =============================================================================
# Spring Session with Redis replaces the in-process HttpSession store with a
# centralized, distributed session store on Amazon ElastiCache. This makes every
# application instance fully stateless, enabling AWS ALB load balancing without
# sticky sessions, horizontal auto-scaling, and zero-downtime rolling deployments.
#
# Set the following environment variables (or AWS Parameter Store parameters) to
# point the application at the ElastiCache cluster:
#
#   SPRING_REDIS_HOST     — ElastiCache primary endpoint hostname
#                           e.g. my-cluster.abc123.ng.0001.use1.cache.amazonaws.com
#   SPRING_REDIS_PORT     — ElastiCache port (default: 6379)
#   SPRING_REDIS_PASSWORD — ElastiCache AUTH token (if in-transit encryption is on)
#
# For local development, a Redis instance on localhost:6379 is used by default.
# -----------------------------------------------------------------------------

# ElastiCache primary endpoint (override via SPRING_REDIS_HOST env var)
spring.redis.host=${SPRING_REDIS_HOST:localhost}

# ElastiCache port (override via SPRING_REDIS_PORT env var)
spring.redis.port=${SPRING_REDIS_PORT:6379}

# ElastiCache AUTH token — leave blank for unauthenticated clusters
spring.redis.password=${SPRING_REDIS_PASSWORD:}

# Spring Session store type — set to redis to activate ElastiCache-backed sessions
spring.session.store-type=redis

# Session timeout (seconds) — matches @EnableRedisHttpSession(maxInactiveIntervalInSeconds)
spring.session.timeout=1800

# =============================================================================
# cr-java-0067 FIX: Amazon ElastiCache for Redis — Booking Cache TTL configuration
# =============================================================================
# The unbounded static in-memory HashMap (bookingCache) has been replaced with a
# centralized Redis cache backed by Amazon ElastiCache. Each booking entry is stored
# with a configurable TTL to prevent indefinite memory growth, stale data, and cache
# inconsistency across multiple EC2 instances.
#
# Set the following environment variable to control cache entry lifetime:
#
#   APP_CACHE_BOOKING_TTL_MINUTES — TTL in minutes for each booking cache entry.
#                                   Default: 30 minutes. Tune per environment
#                                   (e.g. shorter TTL in dev, longer in prod).
#
# All application instances share the same ElastiCache cluster, ensuring consistent
# cache reads regardless of which instance handles the request.
# -----------------------------------------------------------------------------
app.cache.booking-ttl-minutes=${APP_CACHE_BOOKING_TTL_MINUTES:30}
