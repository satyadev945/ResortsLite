# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 FIX: Hard-coded port 8080 replaced with environment variable SERVER_PORT.
# Azure Container Apps and AKS dynamically assign ports at runtime; externalising this
# value via an environment variable enables dynamic port binding and eliminates deployment
# conflicts caused by static port numbers.
# Set the SERVER_PORT environment variable in Azure App Configuration or the container
# environment to override the default (8080) for each deployment environment.
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0071 FIX: Hard-coded inventory service URL (BookingController line 66) and
# hard-coded report download base URL (ReportService line 66) have been removed from
# source code and externalised here. In Azure cloud deployments these values are
# supplied via Azure App Configuration or environment variables, enabling
# environment-agnostic deployments without code changes between dev/staging/production.
#
# Inventory service base URL — override with APP_INVENTORY_URL env var in each environment.
app.inventory.url=${APP_INVENTORY_URL:https://inventory-service.internal:8081/rooms}
#
# Report download base URL — override with APP_REPORTS_DOWNLOAD_BASE_URL env var in each environment.
app.reports.download-base-url=${APP_REPORTS_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download}

# cr-java-0067 FIX: Booking cache TTL for Azure Cache for Redis.
# Replaces the removed static in-memory HashMap (bookingCache) in BookingController.
# Cache entries stored in Redis will expire after this many minutes, preventing indefinite
# memory growth and ensuring stale booking data is automatically evicted.
# Override with APP_CACHE_BOOKING_TTL_MINUTES environment variable per deployment environment
# (e.g. shorter TTL in dev/test, longer TTL in production).
# Default: 60 minutes.
app.cache.booking.ttl-minutes=${APP_CACHE_BOOKING_TTL_MINUTES:60}

# Azure Blob Storage configuration (cr-java-0061)
# Replace hard-coded file paths /var/legacy/reports/ and C:\ResortBackups\nightly\
# with Azure Blob Storage containers. Connection string must be supplied via the
# AZURE_STORAGE_CONNECTION_STRING environment variable in cloud deployments.
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=https;AccountName=changeme;AccountKey=changeme;EndpointSuffix=core.windows.net}
azure.storage.reports.container-name=${AZURE_STORAGE_REPORTS_CONTAINER:reports}
azure.storage.backup.container-name=${AZURE_STORAGE_BACKUP_CONTAINER:backups}

# Azure Key Vault configuration (cr-java-0069)
# Replaces hard-coded DB_USER ("admin") and DB_PASS ("Resort$Pass#2019!") in BookingService.
# Set AZURE_KEY_VAULT_URI to your vault endpoint, e.g.:
#   https://<your-vault-name>.vault.azure.net/
# In Azure cloud the application uses Managed Identity (no extra credentials needed).
azure.keyvault.uri=${AZURE_KEY_VAULT_URI:https://changeme.vault.azure.net/}

# cr-java-0065 FIX: Azure Cache for Redis configuration.
# Replaces in-memory HttpSession storage with a distributed Redis-backed session store,
# enabling stateless application instances and horizontal scaling across multiple nodes.
# Set AZURE_REDIS_HOST to your Azure Cache for Redis hostname, e.g.:
#   <cache-name>.redis.cache.windows.net
# Set AZURE_REDIS_PASSWORD to the primary or secondary access key from the Azure portal.
# Set AZURE_REDIS_PORT if your cache uses a non-default TLS port (default: 6380).
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6380}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.redis.ssl=true

# Spring Session — use Redis as the session store (cr-java-0065)
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# cr-java-0090 FIX: Azure Active Directory (Entra ID) authentication configuration.
# Replaces local file-based credential storage with centralised Azure AD identity
# management using Spring Security OAuth2 resource-server and MSAL JWT validation.
#
# Required environment variables:
#   AZURE_AD_TENANT_ID  — Azure AD tenant ID (GUID), e.g. xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
#   AZURE_AD_CLIENT_ID  — Application (client) ID registered in Azure AD
#
# Azure AD tenant ID — set AZURE_AD_TENANT_ID in Azure App Configuration or container env.
azure.activedirectory.tenant-id=${AZURE_AD_TENANT_ID:common}
#
# Azure AD application (client) ID — set AZURE_AD_CLIENT_ID in Azure App Configuration.
azure.activedirectory.client-id=${AZURE_AD_CLIENT_ID:}
#
# JWT issuer URI — Spring Security uses this to fetch Azure AD's JWKS endpoint and
# validate the signature, expiry, and audience of every incoming bearer token.
# The issuer URI is constructed from the tenant ID automatically.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AZURE_AD_TENANT_ID:common}/v2.0

# cr-java-0111 FIX: Azure Service Bus configuration — replaces java.util.Timer and
# server-local scheduling with distributed, timezone-agnostic scheduled message delivery.
# Azure Service Bus delivers messages at the specified UTC time, ensuring consistent
# scheduling across all cloud regions and container instances without relying on
# server-local clock settings or JVM timezone configuration.
#
# Set AZURE_SERVICE_BUS_CONNECTION_STRING to your Azure Service Bus namespace connection
# string, e.g.: Endpoint=sb://<namespace>.servicebus.windows.net/;SharedAccessKeyName=...
azure.servicebus.connection-string=${AZURE_SERVICE_BUS_CONNECTION_STRING:}
#
# Azure Service Bus queue name for scheduled report tasks.
# Set AZURE_SERVICE_BUS_REPORT_QUEUE to override the default queue name.
azure.servicebus.report-queue-name=${AZURE_SERVICE_BUS_REPORT_QUEUE:report-tasks}
