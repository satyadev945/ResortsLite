# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# Port externalised: set SERVER_PORT (or Azure App Configuration key server.port) for dynamic assignment
server.port=${SERVER_PORT:${PORT:8080}}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:postgresql://db-prod.resorts-internal.com:5432/ResortsDB
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.maximum-pool-size=10

# JPA-Hibernate properties (PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# Azure Blob Storage for reports/backups (replaces local file system paths)
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.endpoint=${AZURE_STORAGE_ENDPOINT:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:resort-reports}
azure.storage.report-prefix=${AZURE_STORAGE_REPORT_PREFIX:reports/}
azure.storage.backup-prefix=${AZURE_STORAGE_BACKUP_PREFIX:backups/nightly/}

# Azure Key Vault (database credentials are stored as secrets; auth via DefaultAzureCredential)
azure.keyvault.uri=${AZURE_KEYVAULT_URI:}
azure.keyvault.db-username-secret-name=${AZURE_KEYVAULT_DB_USERNAME_SECRET:db-username}
azure.keyvault.db-password-secret-name=${AZURE_KEYVAULT_DB_PASSWORD_SECRET:db-password}

# HTTP session state externalized to Azure Cache for Redis (Spring Session) - stateless app instances
spring.session.store-type=redis
spring.session.redis.namespace=${SPRING_SESSION_REDIS_NAMESPACE:resortslite:session}
spring.session.redis.flush-mode=on-save
spring.session.timeout=${SESSION_TIMEOUT:30m}
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6380}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.redis.ssl=${AZURE_REDIS_SSL:true}
spring.redis.timeout=${AZURE_REDIS_TIMEOUT:5000ms}

# Booking cache TTL (Azure Cache for Redis), ISO-8601 duration
app.cache.booking-ttl=${BOOKING_CACHE_TTL:PT30M}
