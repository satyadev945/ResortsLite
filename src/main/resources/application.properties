spring.application.name=ResortsLite

server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal/send}
app.report.download-base-url=${REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download}
app.report.service-port=${REPORT_SERVICE_PORT:${SERVER_PORT:8080}}
app.report.schedule-queue=${REPORT_SCHEDULE_QUEUE:report-schedule-queue}
app.report.schedule-delay-seconds=${REPORT_SCHEDULE_DELAY_SECONDS:300}
app.report.container-name=${AZURE_BLOB_REPORT_CONTAINER:reports}
app.report.backup-container-name=${AZURE_BLOB_BACKUP_CONTAINER:report-backups}
app.report.base-path=${REPORT_BASE_PATH:reports}
app.report.backup-path=${REPORT_BACKUP_PATH:backups}

spring.cloud.azure.appconfiguration.enabled=${AZURE_APP_CONFIGURATION_ENABLED:false}
spring.cloud.azure.appconfiguration.stores[0].endpoint=${AZURE_APP_CONFIGURATION_ENDPOINT:}

spring.cloud.azure.credential.managed-identity-enabled=${AZURE_MANAGED_IDENTITY_ENABLED:false}

spring.cloud.azure.storage.blob.account-name=${AZURE_STORAGE_ACCOUNT_NAME:}
spring.cloud.azure.storage.blob.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:}
spring.cloud.azure.storage.blob.container-name=${AZURE_BLOB_REPORT_CONTAINER:reports}

spring.cloud.azure.redis.host=${AZURE_REDIS_HOST:localhost}
spring.cloud.azure.redis.port=${AZURE_REDIS_PORT:6379}
spring.cloud.azure.redis.password=${AZURE_REDIS_PASSWORD:}
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session
spring.session.timeout=30m
app.booking.cache.ttl-minutes=${BOOKING_CACHE_TTL_MINUTES:30}

azure.keyvault.uri=${AZURE_KEYVAULT_URI:}
azure.keyvault.db-user-secret-name=${AZURE_DB_USER_SECRET_NAME:db-username}
azure.keyvault.db-password-secret-name=${AZURE_DB_PASSWORD_SECRET_NAME:db-password}

spring.cloud.azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
app.security.aad-enabled=${AZURE_AAD_ENABLED:false}
