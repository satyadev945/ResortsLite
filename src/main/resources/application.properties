# ResortsLite - Cloud-Native Configuration
spring.application.name=ResortsLite

# Server port — kept here for Spring Boot startup binding.
# The application logic reads the port at runtime from AWS SSM Parameter Store
# via app.ssm.server-port-param (cr-java-0077 FIX).
server.port=8080

# Database (H2 in-memory for local/test; override with RDS via Secrets Manager in production)
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Internal service endpoints (override via environment variables in ECS/EKS)
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# -----------------------------------------------------------------------
# cr-java-0069 FIX: AWS Secrets Manager integration for database credentials.
# The secret name/ARN is resolved from the environment variable DB_SECRET_NAME.
# The secret must be a JSON string containing "username", "password", and "host" keys.
# Example AWS CLI command to create the secret:
#   aws secretsmanager create-secret \
#     --name resorts/db/credentials \
#     --secret-string '{"username":"admin","password":"<pwd>","host":"db-prod.resorts-internal.com"}'
# Override via environment variable: DB_SECRET_NAME=<your-secret-name-or-arn>
# -----------------------------------------------------------------------
app.db.secret-name=${DB_SECRET_NAME:resorts/db/credentials}

# -----------------------------------------------------------------------
# cr-java-0061 FIX: Amazon S3 configuration replacing hard-coded file paths.
# Override these values via environment variables or AWS Parameter Store.
# -----------------------------------------------------------------------
cloud.aws.s3.reports-bucket=${CLOUD_AWS_S3_REPORTS_BUCKET:resorts-reports-bucket}
cloud.aws.s3.backup-bucket=${CLOUD_AWS_S3_BACKUP_BUCKET:resorts-backup-bucket}
cloud.aws.region.static=${CLOUD_AWS_REGION_STATIC:us-east-1}

# -----------------------------------------------------------------------
# cr-java-0071 FIX: AWS Systems Manager Parameter Store configuration
# replacing hard-coded environment-specific URLs.
#
# BookingController - inventory service URL:
#   Parameter Store path: /resortslite/inventory/service-url
#   Override via environment variable: INVENTORY_URL_PARAM_NAME=<your-ssm-param-name>
#   Example SSM value: https://inventory-service.internal:8081/rooms/available
#
# ReportService - report download base URL:
#   Parameter Store path: /resortslite/reports/download-base-url
#   Override via environment variable: REPORT_URL_PARAM_NAME=<your-ssm-param-name>
#   Example SSM value: https://reports.resorts-internal.com/download
# -----------------------------------------------------------------------
app.ssm.inventory-url-param=${INVENTORY_URL_PARAM_NAME:/resortslite/inventory/service-url}
app.ssm.report-download-url-param=${REPORT_URL_PARAM_NAME:/resortslite/reports/download-base-url}

# -----------------------------------------------------------------------
# cr-java-0077 FIX: AWS Systems Manager Parameter Store configuration for server port.
# Hard-coded port 8080 (original line 28 of ReportService.java) is replaced with a
# dynamic AWS SSM Parameter Store lookup in ReportService.getServerPortFromSsm().
# The parameter name defaults to /resortslite/server/port and can be overridden via
# the environment variable SERVER_PORT_PARAM_NAME.
#
# Store the desired port value in SSM (example):
#   aws ssm put-parameter \
#     --name /resortslite/server/port \
#     --value "8080" \
#     --type String
#
# Override via environment variable: SERVER_PORT_PARAM_NAME=<your-ssm-param-name>
# -----------------------------------------------------------------------
app.ssm.server-port-param=${SERVER_PORT_PARAM_NAME:/resortslite/server/port}

# -----------------------------------------------------------------------
# cr-java-0065 FIX: Spring Session backed by Amazon ElastiCache for Redis.
# All HttpSession data is stored in the shared Redis cluster so every
# application instance is stateless and can serve any request without
# sticky sessions.
#
# In production, set SPRING_REDIS_HOST to the ElastiCache primary endpoint
# and SPRING_REDIS_PORT to 6379 (or the configured port).
#
# Example AWS CLI command to create an ElastiCache Redis cluster:
#   aws elasticache create-cache-cluster \
#     --cache-cluster-id resorts-session-cache \
#     --engine redis \
#     --cache-node-type cache.t3.micro \
#     --num-cache-nodes 1
#
# Override via environment variables:
#   SPRING_REDIS_HOST=<elasticache-primary-endpoint>
#   SPRING_REDIS_PORT=6379
# -----------------------------------------------------------------------
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save

# -----------------------------------------------------------------------
# cr-java-0067 FIX: Amazon ElastiCache for Redis — booking cache TTL configuration.
# The static in-memory HashMap (bookingCache) in BookingController has been replaced
# with a RedisTemplate-backed cache stored in Amazon ElastiCache for Redis.
#
# Key benefits:
#   - Shared across ALL application instances (no instance-local blind spots)
#   - TTL enforces automatic expiration, preventing indefinite memory growth
#   - Centralized cache management survives instance restarts and auto-scaling
#
# Cache key pattern: booking:<bookingId>
# TTL default: 60 minutes (configurable via BOOKING_CACHE_TTL_MINUTES env var)
#
# Required AWS setup: Amazon ElastiCache for Redis cluster
#   aws elasticache create-cache-cluster \
#     --cache-cluster-id resorts-booking-cache \
#     --engine redis \
#     --cache-node-type cache.t3.micro \
#     --num-cache-nodes 1
#
# Override via environment variable: BOOKING_CACHE_TTL_MINUTES=<ttl-in-minutes>
# -----------------------------------------------------------------------
app.cache.booking.ttl-minutes=${BOOKING_CACHE_TTL_MINUTES:60}
# user identity management. Replaces file-based authentication (local MD5
# hashing of credentials/tokens) with centralized, encrypted, and auditable
# authentication via AWS Cognito User Pools.
#
# Required AWS setup:
#   1. Create a Cognito User Pool:
#      aws cognito-idp create-user-pool --pool-name ResortsLiteUsers
#   2. Create an App Client (no secret):
#      aws cognito-idp create-user-pool-client \
#        --user-pool-id <pool-id> --client-name ResortsLiteApp \
#        --no-generate-secret
#   3. Add custom attribute: custom:bookingId (String, mutable)
#
# Override via environment variables:
#   COGNITO_USER_POOL_ID=<your-user-pool-id>   (e.g. us-east-1_XXXXXXXXX)
#   COGNITO_CLIENT_ID=<your-app-client-id>
# -----------------------------------------------------------------------
app.cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
app.cognito.client-id=${COGNITO_CLIENT_ID:}
