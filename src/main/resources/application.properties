# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 FIX: Replaced hard-coded port 8080 with environment variable injection.
# The SERVER_PORT environment variable is set at runtime by ECS task definitions, EKS pod specs,
# or Elastic Beanstalk environment properties — enabling dynamic port assignment by container
# orchestration platforms and cloud service discovery mechanisms.
# In AWS Systems Manager Parameter Store, store the value at /resorts-lite/server/port
# and inject it as the SERVER_PORT environment variable in your deployment configuration.
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0061 FIX: Amazon S3 configuration replacing hardcoded local file paths.
# Override these values via environment variables or AWS Parameter Store in cloud deployments.
# REPORT_BASE_PATH (/var/legacy/reports/) and BACKUP_PATH (C:\ResortBackups\nightly\) have been
# replaced with S3 bucket/prefix references sourced from the properties below.
app.s3.reports.bucket=${REPORTS_S3_BUCKET:resorts-lite-reports}
app.s3.backup.prefix=${BACKUP_S3_PREFIX:backups/nightly/}
aws.region=${AWS_REGION:us-east-1}

# cr-java-0071 FIX: Externalized environment-specific URLs via AWS Systems Manager Parameter Store.
# These properties replace hard-coded URLs that previously prevented environment-agnostic deployments.
# In cloud environments, set the corresponding environment variables or configure AWS SSM Parameter
# Store paths (/resorts-lite/inventory/available-url and /resorts-lite/reports/download-base-url)
# and inject them via Spring Cloud AWS or the ECS/EC2 task definition environment variables.
#
# Inventory availability service URL (was hard-coded: http://inventory-service.internal:8081/rooms/available)
app.inventory.available.url=${APP_INVENTORY_AVAILABLE_URL:http://inventory-service.internal:8081/rooms/available}
#
# Reports download base URL (was hard-coded with port 8080: http://reports.resorts-internal.com:8080/download/)
# cr-java-0077 FIX: The port is no longer embedded in application code. The full URL including
# any port is sourced from APP_REPORTS_DOWNLOAD_BASE_URL environment variable / AWS SSM Parameter Store.
app.reports.download.base-url=${APP_REPORTS_DOWNLOAD_BASE_URL:}

# ---------------------------------------------------------------------------
# cr-java-0065 FIX: Amazon ElastiCache for Redis — Spring Session Data Redis
# ---------------------------------------------------------------------------
# HTTP session state is now stored in Amazon ElastiCache for Redis via Spring Session.
# This eliminates server affinity, enables horizontal scaling across EC2 instances behind
# an AWS ALB, and preserves sessions across auto-scaling and rolling deployment events.
#
# Set the following environment variables in your ECS task definition, EC2 launch template,
# or Elastic Beanstalk environment properties to point to your ElastiCache cluster:
#
#   SPRING_REDIS_HOST     — ElastiCache primary endpoint (e.g., my-cluster.abc123.ng.0001.use1.cache.amazonaws.com)
#   SPRING_REDIS_PORT     — Redis port (default: 6379)
# ---------------------------------------------------------------------------
# cr-java-0067 FIX: Amazon ElastiCache for Redis — Booking Cache TTL
# ---------------------------------------------------------------------------
# The previous unbounded static in-memory HashMap (bookingCache) has been replaced with
# Amazon ElastiCache for Redis via Spring Data RedisTemplate. Booking entries are stored
# with a configurable TTL to ensure controlled expiration, prevent indefinite memory growth,
# and maintain consistent cache state across all EC2 instances in the cluster.
#
# Set the following environment variable in your ECS task definition, EC2 launch template,
# or Elastic Beanstalk environment properties to control the booking cache entry lifetime:
#
#   APP_CACHE_BOOKING_TTL_SECONDS — TTL in seconds for each cached booking entry (default: 3600 = 1 hour)
#
app.cache.booking.ttl-seconds=${APP_CACHE_BOOKING_TTL_SECONDS:3600}

spring.redis.ssl=${SPRING_REDIS_SSL:false}
spring.redis.password=${SPRING_REDIS_PASSWORD:}

# Spring Session store type — explicitly set to redis so Spring Session Data Redis is active.
spring.session.store-type=redis
# Session timeout aligned with RedisSessionConfig.maxInactiveIntervalInSeconds (30 minutes).
spring.session.timeout=1800s

# ---------------------------------------------------------------------------
# cr-java-0090 FIX: Amazon Cognito — User Identity Management
# ---------------------------------------------------------------------------
# Authentication credentials and user identity data are now managed by Amazon Cognito
# User Pools, replacing any file-based authentication or local credential storage.
# This provides centralized, encrypted, and auditable authentication with built-in
# user lifecycle management, MFA support, and seamless horizontal scaling.
#
# Set the following environment variables in your ECS task definition, EC2 launch template,
# or Elastic Beanstalk environment properties:
#
#   COGNITO_USER_POOL_ID  — The Cognito User Pool ID (e.g., us-east-1_AbCdEfGhI)
#   COGNITO_CLIENT_ID     — The Cognito App Client ID for this application
#
# These values are available in the AWS Console under Cognito > User Pools, or via:
#   aws cognito-idp describe-user-pool --user-pool-id <pool-id>
#
cognito.user-pool-id=${COGNITO_USER_POOL_ID:us-east-1_placeholder}
cognito.client-id=${COGNITO_CLIENT_ID:placeholder-client-id}
