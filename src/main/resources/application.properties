# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:postgresql://db-prod.resorts-internal.com:5432/ResortsDB
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA-Hibernate properties (PostgreSQL) — IDENTITY keys, same entity shape as the Oracle Doctor
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# Externalised file paths (cz-java-0057) - supplied via Kubernetes ConfigMap env vars
app.report.base-path=${REPORT_BASE_PATH:./reports/}
app.report.backup-path=${REPORT_BACKUP_PATH:./backups/}

# Health check
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# cz-java-0063: Externalised HTTP sessions - Spring Session backed by Amazon ElastiCache (Redis)
spring.session.store-type=redis
spring.session.redis.namespace=${SESSION_REDIS_NAMESPACE:resortslite:session}
spring.session.timeout=${SESSION_TIMEOUT:30m}
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL_ENABLED:false}

# cz-java-0070: Booking cache stored in Amazon ElastiCache (Redis) instead of local memory
app.cache.booking.key-prefix=${BOOKING_CACHE_KEY_PREFIX:resortslite:booking:}
app.cache.booking.ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:3600}
