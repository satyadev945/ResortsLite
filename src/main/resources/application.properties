# ResortsLite - Configuration
# Updated for Java 21 / Spring Boot 3.2.x compatibility
# Cloud-compatible: externalised credentials and endpoints
spring.application.name=ResortsLite

# Server port — dynamically assigned by container orchestration (ECS/EKS)
# Override via PORT environment variable if needed
server.port=${PORT:8080}

# Database configuration — externalize credentials to AWS Parameter Store / Secrets Manager
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@${DB_HOST:localhost}:1521:ORCL}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA-Hibernate properties (Oracle) — updated dialect for Spring Boot 3.x / Hibernate 6
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Internal service endpoints — externalize to environment variables for cloud deployment
# Fixed: HTTPS enforced (cr-java-0088)
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal/send}

# Report and backup paths — externalized for container portability (czr-java-001)
app.report.base-path=${REPORT_BASE_PATH:/tmp/reports}
app.backup.base-path=${BACKUP_BASE_PATH:/tmp/backups}
