# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# Port is externalised; GCP Cloud Run / GKE inject PORT dynamically
server.port=${PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# DB credentials are retrieved from Google Secret Manager (secrets: db-username, db-password).
spring.datasource.url=jdbc:sqlserver://db-prod.resorts-internal.com:1433;databaseName=ResortsDB;encrypt=false;trustServerCertificate=true
spring.config.import=sm://
spring.cloud.gcp.secretmanager.enabled=true
spring.datasource.username=${sm://db-username}
spring.datasource.password=${sm://db-password}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA-Hibernate properties (SQL Server) — IDENTITY keys, same entity shape as the Oracle Doctor
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
# Externalised environment-specific URLs (override via env vars or GCP Secret Manager, e.g. ${sm://inventory-available-url})
app.inventory.available-endpoint=${INVENTORY_SERVICE_URL:http://localhost:8081/rooms/available}
app.report.download-base-url=${REPORT_DOWNLOAD_BASE_URL:http://localhost:${server.port}/download/}
app.notification.endpoint=http://notify.internal:7070/send

# Report storage (Google Cloud Storage) - override via environment variables
app.report.bucket=${REPORT_BUCKET:resorts-reports}
app.report.base-path=${REPORT_BASE_PATH:reports/}
app.report.backup-path=${REPORT_BACKUP_PATH:backups/nightly/}

# Google Cloud Memorystore for Redis (externalised booking/session state)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_AUTH:}
spring.redis.ssl=${REDIS_SSL_ENABLED:false}
app.booking.state-ttl-seconds=${BOOKING_STATE_TTL_SECONDS:1800}
