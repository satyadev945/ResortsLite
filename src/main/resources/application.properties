# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0065 FIX: Spring Session backed by Amazon ElastiCache for Redis.
# All HTTP session attributes are stored in the shared Redis cluster, enabling
# stateless application instances, horizontal scaling, and zero session-data loss.
# Configure the ElastiCache primary endpoint via environment variables:
#   SPRING_REDIS_HOST     — ElastiCache primary endpoint hostname (required in AWS)
#   SPRING_REDIS_PORT     — Redis port (default 6379)
#   SPRING_REDIS_PASSWORD — Redis AUTH token (if cluster encryption-in-transit is enabled)
# Session TTL is controlled by spring.session.timeout (default 30 minutes).
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.password=${SPRING_REDIS_PASSWORD:}
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session
spring.session.timeout=1800
# Flush session to Redis immediately on each write (recommended for AWS ALB sticky-session-free deployments)
spring.session.redis.flush-mode=on_save

# cr-java-0067 FIX: Amazon ElastiCache for Redis — booking cache TTL configuration.
# Replaces the unbounded static in-memory HashMap (bookingCache) in BookingController.
# Each booking entry is stored in the shared ElastiCache cluster with a configurable TTL
# to prevent indefinite memory growth and stale-data inconsistencies across EC2 instances.
# Override via environment variable BOOKING_CACHE_TTL_MINUTES (default: 30 minutes).
booking.cache.ttl-minutes=${BOOKING_CACHE_TTL_MINUTES:30}

# cr-java-0071 FIX: Hard-coded environment URLs externalized to AWS SSM Parameter Store.
# In AWS environments, these properties are resolved from SSM Parameter Store paths:
#   /resortslite/inventory/service-url  -> app.inventory.service-url
#   /resortslite/reports/download-base-url -> app.report.download-base-url
# Override at runtime via environment variables APP_INVENTORY_SERVICE_URL and APP_REPORT_DOWNLOAD_BASE_URL,
# or inject directly from SSM using Spring Cloud AWS (aws.paramstore.enabled=true).
app.inventory.service-url=${APP_INVENTORY_SERVICE_URL:http://inventory-service.internal:8081/rooms/available}
app.report.download-base-url=${APP_REPORT_DOWNLOAD_BASE_URL:http://reports.resorts-internal.com:8080/download/}

# Cloud-native S3 configuration (cr-java-0062 fix: replaces local file system write operations)
# Override via environment variables: REPORT_S3_BUCKET, BACKUP_S3_PREFIX, AWS_REGION
cloud.aws.s3.bucket-name=${REPORT_S3_BUCKET:resorts-reports-bucket}
cloud.aws.s3.backup-prefix=${BACKUP_S3_PREFIX:backups/nightly/}
cloud.aws.region.static=${AWS_REGION:us-east-1}


# cr-java-0077 FIX: Hard-coded server port externalized to AWS SSM Parameter Store.
# In AWS environments, this value is resolved from SSM Parameter Store path:
#   /resortslite/server/port  -> SERVER_PORT environment variable
# Override at runtime via environment variable SERVER_PORT (ECS task definition / EKS env injection),
# or inject directly from SSM using Spring Cloud AWS (aws.paramstore.enabled=true).
# Defaults to 8080 for local development only.
server.port=${SERVER_PORT:8080}

# cr-java-0069 FIX: Hard-coded DB credentials removed from source code and properties file.
# Credentials are now retrieved at runtime from AWS Secrets Manager by BookingService.loadDatabaseCredentials().
# Set the DB_SECRET_NAME environment variable (or db.secret.name property) to the name of the secret
# in AWS Secrets Manager that holds {"username":"...","password":"..."}.
db.secret.name=${DB_SECRET_NAME:resortslite/db/credentials}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:oracle:thin:@db-prod.resorts-internal.com:1521:ORCL
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0090 FIX: Amazon Cognito User Pool configuration for guest identity management.
# File-based authentication (local user stores / credential files) is replaced by Amazon
# Cognito, which provides centralised, encrypted, and auditable authentication with
# built-in user lifecycle management.
#
# Required environment variables in AWS deployments:
#   COGNITO_USER_POOL_ID  — the Cognito User Pool ID (e.g. us-east-1_AbCdEfGhI)
#   COGNITO_AUTH_ENABLED  — set to "true" to activate Cognito identity validation
#                           (defaults to false for local development)
#
# The application uses the Cognito AdminGetUser API to verify guest identities before
# persisting bookings, replacing any file-based user-data lookup.
cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
cognito.auth.enabled=${COGNITO_AUTH_ENABLED:false}
