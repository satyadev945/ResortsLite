# ResortsLite - Cloud-Ready Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values replaced with env-var references
spring.application.name=ResortsLite

# -----------------------------------------------------------------------
# Amazon ElastiCache for Redis — cr-java-0065 fix
# Spring Session is backed by Redis so that HTTP session state is shared
# across all EC2 instances in the Auto Scaling group.  Set REDIS_HOST to
# the ElastiCache primary endpoint and REDIS_PORT to the cluster port
# (default 6379) in each deployment environment (ECS task definition,
# EC2 user-data, Lambda environment variables, etc.).
#
# Example ElastiCache endpoint:
#   REDIS_HOST=resortslite-sessions.abc123.0001.use1.cache.amazonaws.com
#   REDIS_PORT=6379
#   SESSION_TTL_SECONDS=1800
# -----------------------------------------------------------------------
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
# Spring Session store type — must be 'redis' to activate ElastiCache-backed sessions
spring.session.store-type=redis
# Session TTL in seconds (default 30 min); also used by RedisTemplate.opsForValue().set(…)
session.redis.ttl.seconds=${SESSION_TTL_SECONDS:1800}

# -----------------------------------------------------------------------
# Amazon S3 configuration — replaces hard-coded file paths (cr-java-0061)
# Override these via environment variables AWS_S3_REPORT_BUCKET,
# AWS_S3_BACKUP_BUCKET, and AWS_REGION at deployment time.
# -----------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}
aws.s3.report.bucket=${AWS_S3_REPORT_BUCKET:resort-reports-bucket}
aws.s3.backup.bucket=${AWS_S3_BACKUP_BUCKET:resort-backups-bucket}

# -----------------------------------------------------------------------
# AWS Secrets Manager — cr-java-0069 fix
# DB_SECRET_NAME must be set in the environment (e.g. ECS task definition,
# EC2 instance profile, or Lambda environment variables).  The secret must
# be a JSON object with "username" and "password" keys, e.g.:
#   { "username": "admin", "password": "<rotated-value>" }
# Hard-coded spring.datasource.username / spring.datasource.password have
# been REMOVED; credentials are now fetched at startup via SecretsManager.
# -----------------------------------------------------------------------
aws.db.secret.name=${DB_SECRET_NAME:resortslite/db/credentials}

# -----------------------------------------------------------------------
# Amazon Cognito — cr-java-0090 fix
# File-based authentication (local MD5 token generation) has been replaced
# with Amazon Cognito User Pools for centralized, encrypted, and auditable
# user identity management. Set COGNITO_USER_POOL_ID and COGNITO_APP_CLIENT_ID
# in each deployment environment (ECS task definition, EC2 user-data, etc.).
#
# Example values:
#   COGNITO_USER_POOL_ID=us-east-1_AbCdEfGhI
#   COGNITO_APP_CLIENT_ID=1example23456789
#
# When these are not set, a secure SHA-256 fallback is used (non-production only).
# -----------------------------------------------------------------------
aws.cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
aws.cognito.app-client-id=${COGNITO_APP_CLIENT_ID:}

server.port=${SERVER_PORT:8080}

# -----------------------------------------------------------------------
# AWS Systems Manager Parameter Store — cr-java-0077 fix
# Hard-coded server port (original: private static final int SERVER_PORT = 8080)
# has been replaced with a value fetched from SSM Parameter Store at startup.
# Set SERVER_PORT_PARAM_NAME to point to the correct SSM parameter path per environment.
# -----------------------------------------------------------------------
aws.ssm.server.port.param=${SERVER_PORT_PARAM_NAME:/resortslite/server/port}

# cr-java-0069 FIX: spring.datasource.username and spring.datasource.password
# have been removed from this file.  They are now loaded at runtime from
# AWS Secrets Manager by BookingService.loadDatabaseCredentialsFromSecretsManager().
# The datasource URL still uses an environment variable so the hostname is
# not hard-coded (consistent with the cr-java-0021 remediation).
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@db-prod.resorts-internal.com:1521:ORCL}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Internal service endpoints — externalised to environment variables (cr-java-0021)
app.payment.endpoint=${PAYMENT_API_URL:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_API_URL:http://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_API_URL:http://notify.internal:7070/send}

# -----------------------------------------------------------------------
# AWS Systems Manager Parameter Store — cr-java-0071 fix
# Hard-coded environment-specific URLs have been replaced with values
# fetched from SSM Parameter Store at application startup.
# Set these environment variables to point to the correct SSM parameter
# paths for each deployment environment (dev / staging / prod).
# -----------------------------------------------------------------------
# SSM parameter path for the inventory service URL (BookingController)
aws.ssm.inventory.url.param=${INVENTORY_URL_PARAM_NAME:/resortslite/inventory/service-url}
# SSM parameter path for the report download base URL (ReportService)
aws.ssm.report.url.param=${REPORT_URL_PARAM_NAME:/resortslite/reports/download-base-url}
# Fallback values used when SSM is unavailable (local development)
app.inventory.service.url=${INVENTORY_SERVICE_URL:http://inventory-service.internal:8081/rooms/available}
app.report.download.base.url=${REPORT_DOWNLOAD_BASE_URL:http://reports.resorts-internal.com:8080/download/}
