# ResortsLite - Cloud-Ready Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 FIX: Hard-coded port 8080 replaced with SERVER_PORT environment variable.
# In ECS set the SERVER_PORT environment variable in the task definition.
# In EKS set it in the pod spec env section.
# In Elastic Beanstalk set it in environment properties.
# Falls back to 8080 only for local development when SERVER_PORT is not set.
server.port=${SERVER_PORT:8080}

# cr-java-0069 FIX: Hard-coded database credentials removed.
# Credentials are now retrieved at runtime from AWS Secrets Manager.
# Set DB_SECRET_NAME env var (or app.db.secret-name property) to the secret name,
# e.g. "resortslite/db/credentials", which must contain JSON: {"username":"...","password":"..."}
# Set DB_SECRET_REGION env var (or app.db.secret-region property) to the AWS region.
app.db.secret-name=${DB_SECRET_NAME:resortslite/db/credentials}
app.db.secret-region=${DB_SECRET_REGION:us-east-1}

# Database connection URL — host/port may still be externalised via cr-java-0021 remediation.
spring.datasource.url=jdbc:oracle:thin:@db-prod.resorts-internal.com:1521:ORCL
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0071 FIX: AWS SSM Parameter Store parameter names for environment-specific URLs.
# These properties define WHICH SSM parameter to look up — the actual URL values are stored
# in AWS Systems Manager Parameter Store and retrieved at runtime, enabling environment-agnostic
# deployments across dev, staging, and production without code or config file changes.
#
# Set the corresponding SSM parameters in AWS before deploying:
#   aws ssm put-parameter --name "/resortslite/inventory/url" --value "https://inventory-service.internal:8081/rooms/available" --type String
#   aws ssm put-parameter --name "/resortslite/reports/download-url" --value "https://reports.resorts-internal.com/download/" --type String
app.ssm.inventory-url-param=${INVENTORY_URL_PARAM_NAME:/resortslite/inventory/url}
app.ssm.report-download-url-param=${REPORT_DOWNLOAD_URL_PARAM_NAME:/resortslite/reports/download-url}

# ---------------------------------------------------------------------------
# cr-java-0065 FIX: Spring Session backed by Amazon ElastiCache for Redis
# ---------------------------------------------------------------------------
# Instructs Spring Boot to use Redis as the HTTP session store.
# All HttpSession.setAttribute / getAttribute calls are transparently
# serialised to the shared Redis cluster, enabling stateless EC2 instances
# and eliminating the need for ALB sticky sessions.
#
# Set REDIS_HOST to the ElastiCache primary endpoint (e.g. my-cluster.abc123.ng.0001.use1.cache.amazonaws.com).
# Set REDIS_PORT if your cluster uses a non-default port (default: 6379).
# Set SESSION_TIMEOUT_SECONDS to control session TTL (default: 1800 = 30 min).
#
# Example ECS task-definition environment variables:
#   REDIS_HOST  = my-cluster.abc123.ng.0001.use1.cache.amazonaws.com
#   REDIS_PORT  = 6379
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
server.servlet.session.timeout=${SESSION_TIMEOUT_SECONDS:1800}s

# ---------------------------------------------------------------------------
# cr-java-0067 FIX: Amazon ElastiCache for Redis — Booking Cache TTL
# ---------------------------------------------------------------------------
# Replaces the unbounded static in-memory HashMap (bookingCache) in BookingController.
# All booking cache entries are stored in the shared ElastiCache Redis cluster with
# a configurable TTL so that:
#   - Memory growth is bounded (entries expire automatically)
#   - All EC2 instances in the Auto Scaling Group share the same cache view
#   - Stale data is automatically evicted after the TTL elapses
#
# Set BOOKING_CACHE_TTL_SECONDS to override the default 30-minute expiry.
app.cache.booking-ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:1800}
