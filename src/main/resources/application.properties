# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 FIX: Hard-coded port 8080 replaced with environment variable injection.
# SERVER_PORT is populated at deploy time from AWS Systems Manager Parameter Store
# (/resortslite/server/port) via ECS task definition environment properties,
# EKS pod environment variables, or Elastic Beanstalk environment configuration.
# The default 8080 is used only for local development when no env var is present.
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# cr-java-0090 FIX: Hardcoded credentials removed. Database credentials are now managed
# exclusively by AWS Secrets Manager (secret: resortslite/db/credentials).
# DB_HOST, DB_PORT, DB_NAME, DATASOURCE_USERNAME, and DATASOURCE_PASSWORD are injected
# at deploy time from the Secrets Manager secret via ECS task-definition environment
# variables, EKS pod env vars, or Elastic Beanstalk environment configuration.
# Amazon Cognito handles all guest user identity management (see BookingService).
spring.datasource.url=jdbc:oracle:thin:@${DB_HOST:localhost}:${DB_PORT:1521}:${DB_NAME:ORCL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Amazon Cognito configuration — injected at deploy time.
# COGNITO_USER_POOL_ID: the Cognito User Pool ID for ResortsLite guest accounts.
# COGNITO_CLIENT_ID:    the Cognito App Client ID (USER_PASSWORD_AUTH flow enabled).
# COGNITO_REGION:       AWS region where the User Pool is hosted (defaults to AWS_REGION).
cognito.userPoolId=${COGNITO_USER_POOL_ID:}
cognito.clientId=${COGNITO_CLIENT_ID:}
cognito.region=${COGNITO_REGION:${AWS_REGION:us-east-1}}

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0065 FIX: Spring Session — use Redis as the distributed session store.
# All HTTP session data (e.g. lastBooking, guestName) is stored in Amazon ElastiCache
# for Redis, making every application instance fully stateless. AWS ALB sticky sessions
# are no longer required; horizontal scaling and instance failover work transparently.
spring.session.store-type=redis

# Redis connection — point to the Amazon ElastiCache for Redis primary endpoint.
# REDIS_HOST and REDIS_PORT are injected at deploy time via ECS task-definition
# environment variables, EKS pod env vars, or Elastic Beanstalk environment config.
# Defaults (localhost:6379) are used only for local development.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# Session TTL — sessions expire after 30 minutes of inactivity (configurable).
spring.session.redis.flush-mode=on-save
spring.session.timeout=1800
