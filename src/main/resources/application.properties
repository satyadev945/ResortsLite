spring.application.name=ResortsLite
server.port=${SERVER_PORT:0}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.payment.endpoint=${APP_PAYMENT_ENDPOINT:https://payment-service.internal/charge}
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:https://inventory-service.internal/rooms}
app.notification.endpoint=${APP_NOTIFICATION_ENDPOINT:https://notify-service.internal/send}
app.report.base-path=${APP_REPORT_BASE_PATH:${java.io.tmpdir}/resort-reports}
app.backup.path=${APP_BACKUP_PATH:${java.io.tmpdir}/resort-backups}
app.report.download-base-url=${APP_REPORT_DOWNLOAD_BASE_URL:https://reports.example.internal/download}
