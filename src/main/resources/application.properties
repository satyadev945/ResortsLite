# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=${SERVER_PORT:${AZURE_APP_CONFIGURATION_SERVER_PORT:8080}}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Azure Key Vault configuration for externalized database credentials
azure.keyvault.url=${AZURE_KEYVAULT_URL:}
azure.keyvault.secrets.db-user=${AZURE_KEYVAULT_DB_USER_SECRET_NAME:db-user}
azure.keyvault.secrets.db-pass=${AZURE_KEYVAULT_DB_PASS_SECRET_NAME:db-pass}

# Azure Active Directory (Entra ID) authentication configuration
azure.activedirectory.tenant-id=${AZURE_TENANT_ID:}
azure.activedirectory.client-id=${AZURE_CLIENT_ID:}
azure.activedirectory.client-secret=${AZURE_CLIENT_SECRET:}
azure.activedirectory.user-group.allowed-groups=${AZURE_ALLOWED_GROUPS:}

# Azure Cache for Redis-backed HTTP session configuration
spring.session.store-type=redis
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6379}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.session.redis.namespace=resortslite
spring.session.redis.flush-mode=on_save

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send
