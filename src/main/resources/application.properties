# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# Port is injected by the platform (Cloud Run / GKE) through the PORT env var
server.port=${PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:postgresql://db-prod.resorts-internal.com:5432/ResortsDB
# Credentials are retrieved at runtime from Google Secret Manager (Spring Cloud GCP)
spring.cloud.gcp.secretmanager.project-id=${GCP_PROJECT_ID:}
spring.datasource.username=${sm://resorts-db-username}
spring.datasource.password=${sm://resorts-db-password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# JPA-Hibernate properties (PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# Google Cloud Storage for generated reports and backups (replaces local file paths)
app.reports.gcs.bucket=${GCS_REPORT_BUCKET:resorts-reports}
app.reports.gcs.report-prefix=${GCS_REPORT_PREFIX:reports/}
app.reports.gcs.backup-prefix=${GCS_BACKUP_PREFIX:backups/nightly/}

# Externalised environment-specific URLs (override via env vars or GCP Secret Manager, e.g. ${sm://inventory-service-url})
app.inventory.availability-url=${INVENTORY_SERVICE_URL:https://inventory-service.internal:8081/rooms/available}
app.reports.download-base-url=${REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download/}

# Google Cloud Memorystore for Redis - externalised state/session store
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_AUTH:}
spring.redis.ssl=${REDIS_SSL_ENABLED:false}
app.state.ttl-minutes=${APP_STATE_TTL_MINUTES:30}
