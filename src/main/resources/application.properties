spring.application.name=${SPRING_APPLICATION_NAME:ResortsLite}
server.port=${PORT:${SERVER_PORT:8080}}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=${H2_CONSOLE_PATH:/h2-console}

azure.appconfig.endpoint=${AZURE_APPCONFIG_ENDPOINT:}
azure.appconfig.label=${AZURE_APPCONFIG_LABEL:}
azure.keyvault.endpoint=${AZURE_KEYVAULT_ENDPOINT:}
azure.storage.blob.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:}
azure.storage.blob.container=${AZURE_STORAGE_BLOB_CONTAINER:resort-reports}
azure.servicebus.fully-qualified-namespace=${AZURE_SERVICEBUS_FULLY_QUALIFIED_NAMESPACE:}
azure.servicebus.report-queue=${AZURE_SERVICEBUS_REPORT_QUEUE:}

spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6379}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.redis.ssl=${AZURE_REDIS_SSL:false}
app.booking.cache.ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:900}

spring.cloud.azure.active-directory.enabled=${AZURE_AD_ENABLED:false}
spring.cloud.azure.active-directory.profile.tenant-id=${AZURE_TENANT_ID:}
spring.cloud.azure.active-directory.credential.client-id=${AZURE_CLIENT_ID:}
spring.cloud.azure.active-directory.credential.client-secret=${AZURE_CLIENT_SECRET:}

app.payment.endpoint=${APP_PAYMENT_ENDPOINT:https://payment-svc.internal/charge}
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms}
app.notification.endpoint=${APP_NOTIFICATION_ENDPOINT:https://notify.internal/send}
app.report.download-base-url=${APP_REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download/}
