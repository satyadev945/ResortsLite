spring.application.name=${SPRING_APPLICATION_NAME:ResortsLite}

# Dynamic cloud port assignment. Azure App Service/Container Apps can set PORT or SERVER_PORT.
server.port=${PORT:${SERVER_PORT:0}}

# Datasource values are externalized. For production, provide these from Azure Key Vault
# references or managed identity-backed application settings.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}

spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=${SPRING_H2_CONSOLE_PATH:/h2-console}

# Azure App Configuration is the source of environment-specific URLs and service settings.
azure.appconfiguration.endpoint=${AZURE_APPCONFIGURATION_ENDPOINT:}
app.payment.endpoint=${APP_PAYMENT_ENDPOINT:}
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:}
app.notification.endpoint=${APP_NOTIFICATION_ENDPOINT:}
app.reports.download-base-url=${APP_REPORTS_DOWNLOAD_BASE_URL:}

# Azure Key Vault secret names / endpoint used by AzureCloudConfigService.
azure.keyvault.url=${AZURE_KEYVAULT_URL:}
azure.keyvault.secrets.db-host=${AZURE_KEYVAULT_SECRET_DB_HOST:db-host}
azure.keyvault.secrets.db-user=${AZURE_KEYVAULT_SECRET_DB_USER:db-user}
azure.keyvault.secrets.db-password=${AZURE_KEYVAULT_SECRET_DB_PASSWORD:db-password}

# Azure Blob Storage replaces local report paths and file writes.
azure.storage.blob.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:}
azure.storage.blob.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.blob.container=${AZURE_STORAGE_BLOB_CONTAINER:reports}

# Azure Service Bus replaces server-local timers/scheduling.
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.fully-qualified-namespace=${AZURE_SERVICEBUS_FULLY_QUALIFIED_NAMESPACE:}
azure.servicebus.report-queue=${AZURE_SERVICEBUS_REPORT_QUEUE:}

# Spring Session and cache state are externalized to Azure Cache for Redis.
spring.session.store-type=redis
spring.session.timeout=${SPRING_SESSION_TIMEOUT:30m}
app.cache.booking.ttl=${APP_CACHE_BOOKING_TTL:PT30M}

# Entra ID (Azure Active Directory) integration. Enable when issuer/client settings are supplied.
app.security.azure-ad.enabled=${AZURE_AD_ENABLED:false}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_AD_ISSUER_URI:}
spring.cloud.azure.active-directory.enabled=${AZURE_AD_ENABLED:false}
spring.cloud.azure.active-directory.profile.tenant-id=${AZURE_AD_TENANT_ID:}
spring.cloud.azure.active-directory.credential.client-id=${AZURE_AD_CLIENT_ID:}
spring.cloud.azure.active-directory.credential.client-secret=${AZURE_AD_CLIENT_SECRET:}
