# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0061 FIX: Amazon S3 configuration — values should be overridden via environment
# variables (AWS_S3_BUCKET_NAME, AWS_S3_BACKUP_PREFIX) or AWS Parameter Store in production.
cloud.aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:resorts-reports-bucket}
cloud.aws.s3.backup-prefix=${AWS_S3_BACKUP_PREFIX:backups/nightly/}


# cr-java-0077 FIX: Replaced hard-coded port 8080 with SERVER_PORT environment variable.
# ECS task definitions, EKS pod specs, and Elastic Beanstalk environment properties inject
# SERVER_PORT at runtime. AWS Systems Manager Parameter Store can also supply this value.
# Falls back to 8080 only for local development when no environment variable is set.
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:oracle:thin:@db-prod.resorts-internal.com:1521:ORCL
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# ---------------------------------------------------------------------------
# cr-java-0065 FIX: Spring Session — Amazon ElastiCache for Redis
# ---------------------------------------------------------------------------
# Instructs Spring Boot to use Redis as the HTTP session store instead of the
# default in-process (JVM heap) store.  Every session attribute written via
# HttpSession.setAttribute() is transparently serialised to the shared Redis
# cluster, making session state visible to all application instances behind
# the AWS ALB and surviving instance termination / auto-scaling events.
#
# SPRING_REDIS_HOST must be set to the ElastiCache primary endpoint DNS name
# (e.g. my-cluster.abc123.ng.0001.use1.cache.amazonaws.com).
# SPRING_REDIS_PORT defaults to 6379 (standard Redis port).
# SESSION_TIMEOUT controls the idle-session expiry; defaults to 30 minutes.
# ---------------------------------------------------------------------------
spring.session.store-type=redis
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.session.timeout=${SESSION_TIMEOUT:1800}
