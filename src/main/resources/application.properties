# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0065 FIX: Spring Session backed by Google Cloud Memorystore for Redis.
# Spring Session intercepts all HttpSession operations and stores session data in Redis,
# enabling stateless application architecture with centralized session management across
# distributed instances. No session data is held in JVM heap memory.
#
# Prerequisites (GCP Memorystore for Redis):
#   1. Create a Memorystore Redis instance:
#        gcloud redis instances create resorts-session-store \
#          --size=1 --region=<REGION> --redis-version=redis_6_x
#   2. Set the following environment variables at runtime:
#        REDIS_HOST=<memorystore-redis-ip>   (from: gcloud redis instances describe ...)
#        REDIS_PORT=6379                      (default Redis port)
#        SESSION_TIMEOUT=1800                 (session TTL in seconds, default 30 min)
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.session.timeout=${SESSION_TIMEOUT:1800}
spring.session.redis.namespace=resorts:session

# cr-java-0067 FIX: Booking cache TTL configuration for Google Cloud Memorystore for Redis.
# The BOOKING_CACHE_TTL environment variable controls how long each booking entry is retained
# in the Redis cache before automatic expiry. This prevents unbounded memory growth and ensures
# stale data is not served across horizontally scaled instances.
# Default: 3600 seconds (1 hour). Override at runtime:
#   export BOOKING_CACHE_TTL=1800   # 30 minutes
#   export BOOKING_CACHE_TTL=7200   # 2 hours
booking.cache.ttl=${BOOKING_CACHE_TTL:3600}
# Redis key prefix used to namespace booking cache entries in Memorystore for Redis.
# Keeps booking cache keys isolated from session keys and other application namespaces.
booking.cache.key.prefix=booking:cache:

# Google Cloud Storage configuration — replaces hard-coded file paths (cr-java-0061)
# Override these via environment variables: GCS_BUCKET_NAME, GCS_REPORT_PREFIX, GCS_BACKUP_PREFIX
gcs.bucket.name=${GCS_BUCKET_NAME:resorts-reports-bucket}
gcs.report.prefix=${GCS_REPORT_PREFIX:reports/}
gcs.backup.prefix=${GCS_BACKUP_PREFIX:backups/nightly/}

# cr-java-0077 FIX: Hard-coded port 8080 replaced with environment-variable-driven binding.
# GCP Cloud Run injects the PORT environment variable automatically; other GCP runtimes
# (GKE, App Engine Flex) can set SERVER_PORT or PORT as needed.
# Falls back to 8080 for local development when neither variable is set.
server.port=${PORT:${SERVER_PORT:8080}}

# cr-java-0069 FIX: Hard-coded database credentials replaced with Google Secret Manager references.
# Spring Cloud GCP Secret Manager resolves sm:// URIs at application startup, fetching the latest
# version of each secret from GCP Secret Manager. No credentials appear in source code or git history.
# Prerequisites:
#   1. Create secrets in GCP Secret Manager:
#        gcloud secrets create db-host --replication-policy="automatic"
#        gcloud secrets create db-user --replication-policy="automatic"
#        gcloud secrets create db-pass --replication-policy="automatic"
#   2. Add secret versions:
#        echo -n "db-prod.resorts-internal.com" | gcloud secrets versions add db-host --data-file=-
#        echo -n "admin"                         | gcloud secrets versions add db-user --data-file=-
#        echo -n "Resort$Pass#2019!"             | gcloud secrets versions add db-pass --data-file=-
#   3. Grant the application's service account the Secret Manager Secret Accessor role:
#        gcloud projects add-iam-policy-binding <PROJECT_ID> \
#          --member="serviceAccount:<SA_EMAIL>" \
#          --role="roles/secretmanager.secretAccessor"
#   4. Set the GCP project ID (used by Spring Cloud GCP to resolve sm:// URIs):
#        spring.cloud.gcp.project-id=<YOUR_GCP_PROJECT_ID>
#      or export SPRING_CLOUD_GCP_PROJECT_ID=<YOUR_GCP_PROJECT_ID> as an environment variable.
spring.cloud.gcp.secretmanager.enabled=true

# Application-level DB credential properties resolved from GCP Secret Manager at runtime.
# Replace <PROJECT_ID> with your actual GCP project ID, or set spring.cloud.gcp.project-id.
app.db.host=${sm://projects/${spring.cloud.gcp.project-id}/secrets/db-host/versions/latest}
app.db.user=${sm://projects/${spring.cloud.gcp.project-id}/secrets/db-user/versions/latest}
app.db.pass=${sm://projects/${spring.cloud.gcp.project-id}/secrets/db-pass/versions/latest}

# Spring DataSource — credentials resolved from GCP Secret Manager via app.db.* properties above.
spring.datasource.url=jdbc:oracle:thin:@${app.db.host}:1521:ORCL
spring.datasource.username=${app.db.user}
spring.datasource.password=${app.db.pass}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send
