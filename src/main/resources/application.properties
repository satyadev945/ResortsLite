# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:postgresql://db-prod.resorts-internal.com:5432/ResortsDB
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# JPA-Hibernate properties (PostgreSQL) — IDENTITY keys, same entity shape as the Oracle Doctor
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# Health check endpoint for container probes (/actuator/health)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# cz-java-0063: Spring Session backed by Amazon ElastiCache (Redis) - sessions are shared across pods
spring.session.store-type=redis
spring.session.redis.namespace=${SESSION_REDIS_NAMESPACE:resortslite:session}
spring.session.redis.flush-mode=on-save
spring.session.timeout=${SESSION_TIMEOUT:30m}
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL_ENABLED:false}

# cz-java-0070: booking cache stored in ElastiCache (Redis) instead of in-process map
app.booking.cache.ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:3600}
