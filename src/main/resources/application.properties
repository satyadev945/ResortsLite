# ResortsLite - Application Configuration
# DB_MIGRATION: Migrated from H2/MySQL to PostgreSQL 16
spring.application.name=ResortsLite

# Server port — externalised via environment variable for cloud/container compatibility
# (czr-port-001 fix: use ${PORT:8080} to allow dynamic port assignment by ECS/EKS)
server.port=${PORT:8080}

# PostgreSQL DataSource Configuration
# (DB_MIGRATION: jdbc:h2:mem → jdbc:postgresql)
# Credentials and host externalised to environment variables for cloud security compliance
# (cr-java-0021 fix: no hardcoded DB hostname or credentials)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resortdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings — tuned for PostgreSQL 16
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# External service endpoints — externalised to environment variables
# (cr-java-0021 fix: no hardcoded internal hostnames)
app.payment.endpoint=${PAYMENT_ENDPOINT:http://payment-svc:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:http://inventory-svc:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:http://notify-svc:7070/send}

# Report storage path — externalised for container/cloud compatibility
# (czr-java-001 fix: no hardcoded absolute paths)
app.report.base-path=${REPORT_BASE_PATH:/tmp/reports/}
