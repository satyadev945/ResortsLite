# ResortsLite - Legacy Configuration
spring.application.name=ResortsLite

# ---------------------------------------------------------------------------
# cr-java-0077 FIX: Hard-coded port 8080 replaced with environment-variable
# driven configuration.  GCP Cloud Run injects the PORT environment variable
# at runtime; GKE / Cloud Endpoints use their own dynamic port binding.
# The SERVER_PORT variable is provided as a secondary fallback for local dev.
# This eliminates the hard-coded port that prevented dynamic port assignment
# required by container orchestration platforms and GCP service discovery.
# ---------------------------------------------------------------------------
# Server port — resolved from GCP Cloud Run PORT env-var, then SERVER_PORT,
# then defaults to 8080 for local development only.
server.port=${PORT:${SERVER_PORT:8080}}

# ---------------------------------------------------------------------------
# cr-java-0069 FIX: Database credentials migrated to Google Secret Manager.
# The sm:// URI scheme is provided by the Spring Cloud GCP Secret Manager
# property source (spring-cloud-gcp-starter-secretmanager).  At startup the
# library calls the Secret Manager API and substitutes the resolved secret
# value — no credentials are stored in source code, property files, or
# container image layers.
#
# Required GCP secrets (create once per project / environment):
#   gcloud secrets create resorts-lite-db-host     --replication-policy=automatic
#   gcloud secrets create resorts-lite-db-username --replication-policy=automatic
#   gcloud secrets create resorts-lite-db-password --replication-policy=automatic
#   gcloud secrets create resorts-lite-payment-api --replication-policy=automatic
#
# The running service account must have roles/secretmanager.secretAccessor.
# ---------------------------------------------------------------------------

# Database host — resolved from Secret Manager; falls back to env-var for local dev
app.db.host=${sm://resorts-lite-db-host}

# cr-java-0069 (Line 22): DB username — resolved from Google Secret Manager at runtime
app.db.username=${sm://resorts-lite-db-username}

# cr-java-0069 (Line 23): DB password — resolved from Google Secret Manager at runtime
app.db.password=${sm://resorts-lite-db-password}

# Spring DataSource wired from the Secret Manager-resolved properties above
spring.datasource.url=jdbc:oracle:thin:@${app.db.host}:1521:ORCL
spring.datasource.username=${app.db.username}
spring.datasource.password=${app.db.password}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Payment API URL — resolved from Secret Manager; no hard-coded private IP addresses
app.payment.api.url=${sm://resorts-lite-payment-api}

# Legacy endpoint keys kept for backward compatibility (now backed by Secret Manager)
app.payment.endpoint=${app.payment.api.url}

# ---------------------------------------------------------------------------
# cr-java-0071 FIX: Hard-coded environment-specific URLs replaced with
# externalized configuration backed by GCP Secret Manager.
#
# Inventory service endpoint (BookingController line 66):
#   - Sourced from GCP Secret Manager secret 'resorts-lite-inventory-url'
#   - Override locally via INVENTORY_SERVICE_URL environment variable
#
# Reports download base URL (ReportService line 66):
#   - Sourced from GCP Secret Manager secret 'resorts-lite-reports-download-url'
#   - Override locally via REPORTS_DOWNLOAD_BASE_URL environment variable
#
# Required GCP secrets (create once per project / environment):
#   gcloud secrets create resorts-lite-inventory-url         --replication-policy=automatic
#   gcloud secrets create resorts-lite-reports-download-url  --replication-policy=automatic
# ---------------------------------------------------------------------------

# Inventory service URL — resolved from GCP Secret Manager at runtime
app.inventory.endpoint=${sm://resorts-lite-inventory-url}

# Report download base URL — resolved from GCP Secret Manager at runtime
app.reports.download.base-url=${sm://resorts-lite-reports-download-url}

# ---------------------------------------------------------------------------
# cr-java-0090 FIX: Cloud-native confirmation-code signing key.
# The HMAC signing key used by BookingService.generateSecureConfirmationCode()
# is stored in Google Secret Manager and retrieved at runtime via the
# SecretManagerServiceClient API — no credential material in source code.
#
# Required GCP setup (one-time per environment):
#   openssl rand -base64 32 | \
#     gcloud secrets create resorts-lite-confirm-signing-key \
#       --replication-policy=automatic --data-file=-
#
#   gcloud secrets add-iam-policy-binding resorts-lite-confirm-signing-key \
#     --member="serviceAccount:<SA_EMAIL>" \
#     --role="roles/secretmanager.secretAccessor"
# ---------------------------------------------------------------------------
# (No property key needed — the secret is fetched directly via SecretManagerServiceClient)

# Notification endpoint
app.notification.endpoint=http://notify.internal:7070/send

# Google Cloud Storage configuration — replaces hard-coded local file paths (cr-java-0061).
# Override via environment variables GCS_REPORTS_BUCKET and GCS_BACKUP_PREFIX at runtime.
gcs.reports.bucket=${GCS_REPORTS_BUCKET:resorts-lite-reports}
gcs.backup.prefix=${GCS_BACKUP_PREFIX:backups/nightly/}

# ---------------------------------------------------------------------------
# cr-java-0065 FIX: GCP Memorystore for Redis — distributed session state storage.
# Replaces HttpSession (server-local) with a centralised Redis cache accessible
# from every application instance, enabling stateless horizontal scaling.
#
# Provision a Memorystore for Redis instance and set the following env-vars:
#   REDIS_HOST  — Private IP of the Memorystore instance (e.g. 10.0.0.3)
#   REDIS_PORT  — Redis port (default 6379)
#
# GCP setup commands:
#   gcloud redis instances create resorts-lite-session \
#       --size=1 --region=us-central1 --redis-version=redis_7_0
#   gcloud redis instances describe resorts-lite-session \
#       --region=us-central1 --format="get(host)"   # → set as REDIS_HOST
# ---------------------------------------------------------------------------
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# Spring Session — use Redis as the session store (backs HttpSession transparently
# for any remaining servlet-layer session usage and the new RedisTemplate writes).
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resorts-lite:session
