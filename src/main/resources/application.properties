# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# Port externalized: SERVER_PORT env var (injected from AWS Systems Manager Parameter Store)
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:sqlserver://db-prod.resorts-internal.com:1433;databaseName=ResortsDB;encrypt=false;trustServerCertificate=true
# cr-java-0069: Credentials are loaded from AWS Secrets Manager (secret JSON keys: username, password).
# Set DB_SECRET_NAME to the secret id/ARN; DB_USERNAME/DB_PASSWORD env vars are only a local fallback.
app.db.secret-name=${DB_SECRET_NAME:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA-Hibernate properties (SQL Server) — IDENTITY keys, same entity shape as the Oracle Doctor
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0061: Report/backup storage in Amazon S3 instead of local file paths (override via environment variables)
app.reports.s3.bucket=${REPORTS_S3_BUCKET:resorts-reports}
app.reports.s3.report-prefix=${REPORTS_S3_PREFIX:reports/}
app.reports.s3.backup-prefix=${REPORTS_S3_BACKUP_PREFIX:backups/nightly/}
app.aws.region=${AWS_REGION:us-east-1}

# cr-java-0065: HTTP sessions externalized to Amazon ElastiCache for Redis via Spring Session
spring.session.store-type=redis
spring.session.redis.namespace=${SESSION_REDIS_NAMESPACE:resorts:session}
spring.session.redis.flush-mode=on-save
spring.session.redis.repository-type=default
spring.session.timeout=${SESSION_TIMEOUT:30m}
spring.redis.host=${ELASTICACHE_REDIS_HOST:localhost}
spring.redis.port=${ELASTICACHE_REDIS_PORT:6379}
spring.redis.password=${ELASTICACHE_REDIS_AUTH_TOKEN:}
spring.redis.ssl=${ELASTICACHE_REDIS_SSL:false}

# cr-java-0067: Booking cache in Amazon ElastiCache for Redis with TTL expiration
app.cache.booking.key-prefix=${BOOKING_CACHE_KEY_PREFIX:resorts:booking:}
app.cache.booking.ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:3600}
