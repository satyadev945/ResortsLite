# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 FIX: Hard-coded port 8080 replaced with environment variable injection.
# Port is resolved at runtime from the SERVER_PORT environment variable (injected by ECS task
# definition, EKS pod spec, or Elastic Beanstalk environment configuration).
# Falls back to 8080 only for local development when no environment variable is set.
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:oracle:thin:@db-prod.resorts-internal.com:1521:ORCL
# cr-java-0069 FIXED: DB_USER and DB_PASS are no longer stored here.
# Credentials are retrieved at runtime from AWS Secrets Manager via BookingService.getDbCredentialsFromSecretsManager().
# The secret name is controlled by the property below (override with DB_SECRET_NAME env var).
# For Spring DataSource auto-configuration, supply credentials through environment variables
# injected by your ECS task definition / EC2 instance profile at deploy time:
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# AWS S3 configuration — replaces hard-coded file paths (cr-java-0061)
# Override via environment variables: AWS_S3_BUCKET_NAME, AWS_REGION
cloud.aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:resorts-lite-reports}
cloud.aws.s3.report-prefix=${AWS_S3_REPORT_PREFIX:reports/}
cloud.aws.region.static=${AWS_REGION:us-east-1}
cloud.aws.stack.auto=false

# AWS Secrets Manager — secret name for database credentials (cr-java-0069)
# The secret must be a JSON object: {"username":"...","password":"..."}
# Override with DB_SECRET_NAME environment variable in ECS task definition / EC2 user data.
cloud.aws.secretsmanager.secret-name=${DB_SECRET_NAME:resortslite/db/credentials}

# AWS SSM Parameter Store — cr-java-0071 FIX: externalised environment-specific URLs
# Each environment (dev/staging/prod) stores its own URL value in SSM under these parameter names.
# Override the parameter names via environment variables if needed.
# BookingController: inventory-service URL (replaces hard-coded http://inventory-service.internal:8081/rooms/available)
ssm.parameter.inventory-url=${SSM_PARAM_INVENTORY_URL:/resortslite/inventory/url}
# ReportService: report download base URL (replaces hard-coded http://reports.resorts-internal.com:8080/download/)
ssm.parameter.report-download-base-url=${SSM_PARAM_REPORT_DOWNLOAD_URL:/resortslite/reports/download-base-url}

# cr-java-0077 FIX: AWS SSM Parameter Store parameter name for the application server port.
# Replaces hard-coded SERVER_PORT = 8080 constant (original ReportService.java line 28).
# ECS task definition / EKS pod spec / Elastic Beanstalk injects SERVER_PORT env var at runtime.
# Override the SSM parameter name via SSM_PARAM_SERVER_PORT environment variable if needed.
ssm.parameter.server-port=${SSM_PARAM_SERVER_PORT:/resortslite/server/port}

# ---------------------------------------------------------------------------
# cr-java-0065 FIX: Spring Session backed by Amazon ElastiCache for Redis
# ---------------------------------------------------------------------------
# Instructs Spring Session to use Redis as the session store, replacing the
# default in-JVM HttpSession. All session attributes are stored in the shared
# Redis cluster so every application instance can serve any request without
# server affinity, enabling safe horizontal scaling behind the AWS ALB.
#
# Override REDIS_HOST and REDIS_PORT via environment variables injected by the
# ECS task definition, EKS pod spec, or Elastic Beanstalk environment config.
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.session.redis.namespace=resortslite:session
spring.session.redis.flush-mode=on-save

# ---------------------------------------------------------------------------
# cr-java-0067 FIX: Amazon ElastiCache for Redis — booking cache TTL
# ---------------------------------------------------------------------------
# TTL (in hours) applied to every booking cache entry written to Redis via
# RedisTemplate in BookingController. Entries expire automatically after this
# duration, preventing indefinite memory growth and stale data accumulation.
# Override via environment variable BOOKING_CACHE_TTL_HOURS injected by the
# ECS task definition, EKS pod spec, or Elastic Beanstalk environment config.
cache.booking.ttl-hours=${BOOKING_CACHE_TTL_HOURS:24}
