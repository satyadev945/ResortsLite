# ResortsLite - Application Configuration
spring.application.name=ResortsLite

# Server port — override via SERVER_PORT environment variable for container deployments
server.port=${SERVER_PORT:8080}

# H2 in-memory datasource (development/testing)
# For production, externalise credentials to AWS Secrets Manager / Parameter Store
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Java 25 Virtual Threads — enables Project Loom virtual threads for Tomcat
# Replaces platform thread pool with lightweight virtual threads for improved throughput
spring.threads.virtual.enabled=true

# Internal service endpoints — externalise via environment variables for cloud deployments
app.payment.endpoint=${PAYMENT_API_URL:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_API_URL:https://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_API_URL:https://notify.internal:7070/send}
