# ResortsLite - Cloud-ready Azure Configuration
spring.application.name=ResortsLite

server.port=${SERVER_PORT:${PORT:8080}}

spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal/send}
app.report.download-base-url=${REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download}
app.report.container-name=${REPORT_CONTAINER_NAME:reports}
app.report.backup-container-name=${REPORT_BACKUP_CONTAINER_NAME:report-backups}
app.report.storage-connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
app.report.service-bus-queue=${REPORT_SERVICEBUS_QUEUE:report-jobs}
app.report.schedule-delay-minutes=${REPORT_SCHEDULE_DELAY_MINUTES:5}
app.config.inventory-url=${APP_CONFIG_INVENTORY_URL:${app.inventory.endpoint}}
app.config.report-download-url=${APP_CONFIG_REPORT_DOWNLOAD_URL:${app.report.download-base-url}}
app.config.server-port=${APP_CONFIG_SERVER_PORT:${SERVER_PORT:${PORT:8080}}}
app.keyvault.url=${AZURE_KEYVAULT_URL:}
app.keyvault.db-user-secret=${AZURE_DB_USER_SECRET:db-user}
app.keyvault.db-password-secret=${AZURE_DB_PASSWORD_SECRET:db-password}
app.auth.aad-enabled=${AZURE_AAD_ENABLED:false}

spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session
spring.session.timeout=30m
app.cache.booking.ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:300}

spring.cloud.azure.appconfiguration.enabled=${AZURE_APP_CONFIGURATION_ENABLED:false}
spring.cloud.azure.appconfiguration.stores[0].connection-string=${AZURE_APP_CONFIGURATION_CONNECTION_STRING:}
spring.cloud.azure.servicebus.enabled=${AZURE_SERVICEBUS_ENABLED:false}
spring.cloud.azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
spring.cloud.azure.credential.managed-identity-enabled=${AZURE_MANAGED_IDENTITY_ENABLED:false}
