# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 [Hard-coded Ports]: Port externalised via SERVER_PORT environment variable.
# Value is injected at runtime by ECS task definition, EKS pod spec, or Elastic Beanstalk
# environment configuration. Falls back to 8080 for local development only.
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:oracle:thin:@db-prod.resorts-internal.com:1521:ORCL
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# -----------------------------------------------------------------------
# Amazon S3 configuration (cr-java-0061 — replaces hard-coded file paths)
# Values MUST be supplied via environment variables or AWS Parameter Store.
# -----------------------------------------------------------------------
# S3 bucket that stores all resort reports and backups
app.s3.bucket-name=${S3_BUCKET_NAME:resorts-lite-reports}
# S3 key prefix for monthly reports (trailing slash required)
app.s3.reports-prefix=${S3_REPORTS_PREFIX:reports/}
# S3 key prefix for nightly backups (trailing slash required)
app.s3.backup-prefix=${S3_BACKUP_PREFIX:backups/nightly/}

# -----------------------------------------------------------------------
# Amazon ElastiCache for Redis — Spring Session configuration (cr-java-0065)
# Replaces in-process HTTP session storage with a distributed Redis-backed
# session store.  All values MUST be supplied via environment variables or
# AWS Parameter Store / Secrets Manager at runtime.
# -----------------------------------------------------------------------
# ElastiCache primary endpoint (Redis cluster mode disabled) or configuration
# endpoint (cluster mode enabled).  Injected via REDIS_HOST env var.
spring.redis.host=${REDIS_HOST:localhost}
# ElastiCache port — default Redis port 6379.  Override via REDIS_PORT env var.
spring.redis.port=${REDIS_PORT:6379}
# Redis AUTH token (ElastiCache in-transit encryption + auth token).
# Leave blank for local development; always set in production via REDIS_PASSWORD.
spring.redis.password=${REDIS_PASSWORD:}
# Spring Session store type — must be 'redis' to activate ElastiCache-backed sessions.
spring.session.store-type=redis
# Session timeout — 30 minutes default; override via SESSION_TIMEOUT env var.
spring.session.timeout=${SESSION_TIMEOUT:1800}
# Redis namespace for Spring Session keys (avoids collisions with other apps).
spring.session.redis.namespace=resortsLite:session

# -----------------------------------------------------------------------
# Amazon ElastiCache for Redis — Booking cache TTL (cr-java-0067)
# Replaces unbounded in-memory HashMap cache with a distributed Redis cache
# that has a configurable TTL to prevent stale data and memory growth.
# -----------------------------------------------------------------------
# TTL (in minutes) for booking cache entries stored in ElastiCache for Redis.
# Override via BOOKING_CACHE_TTL_MINUTES env var; defaults to 30 minutes.
booking.cache.ttl.minutes=${BOOKING_CACHE_TTL_MINUTES:30}
