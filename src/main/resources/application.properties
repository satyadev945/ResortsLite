# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 FIX: Hard-coded port replaced with environment-variable-backed configuration.
# The SERVER_PORT environment variable is injected at runtime by ECS task definitions,
# EKS pod specs, or Elastic Beanstalk environment properties — values sourced from
# AWS Systems Manager Parameter Store (e.g. /resorts-lite/server/port).
# Enables dynamic port assignment required by container orchestration and service discovery.
server.port=${SERVER_PORT:8080}

# cr-java-0069 FIX: Hard-coded database credentials replaced with AWS Secrets Manager.
# DB username and password are no longer stored in source code or property files.
# At runtime, BookingService retrieves credentials from AWS Secrets Manager using the
# secret name specified by DB_SECRET_NAME environment variable (or the default below).
# The datasource URL is still externalised via environment variable DB_HOST.
spring.datasource.url=jdbc:oracle:thin:@${DB_HOST:db-prod.resorts-internal.com}:1521:ORCL
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# AWS Secrets Manager configuration for database credentials (cr-java-0069)
# Set DB_SECRET_NAME to the ARN or name of the secret in AWS Secrets Manager.
# The secret must be a JSON object with "username" and "password" keys, e.g.:
#   {"username":"admin","password":"Resort$Pass#2019!"}
aws.secretsmanager.secret-name=${DB_SECRET_NAME:resorts-lite/db-credentials}
aws.secretsmanager.region=${AWS_REGION:us-east-1}

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# AWS S3 configuration — replaces hard-coded file-path operations (cr-java-0061)
# Set AWS_S3_BUCKET_NAME, AWS_REGION via environment variables or AWS Parameter Store
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:resorts-lite-reports}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.report-prefix=${AWS_S3_REPORT_PREFIX:reports/}
aws.s3.backup-prefix=${AWS_S3_BACKUP_PREFIX:backups/nightly/}

# cr-java-0065 FIX: Spring Session backed by Amazon ElastiCache for Redis.
# HTTP session data is no longer stored in JVM memory on individual instances.
# All session attributes are persisted in a shared Redis cluster, enabling
# stateless application instances, horizontal scaling, and zero session loss
# during auto-scaling events or instance termination.
# Set REDIS_HOST to the ElastiCache primary endpoint (e.g. my-cluster.abc123.ng.0001.use1.cache.amazonaws.com).
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}
# Session timeout — default 30 minutes; override via SESSION_TIMEOUT_SECONDS env var
spring.session.redis.flush-mode=on-save
spring.session.timeout=${SESSION_TIMEOUT_SECONDS:1800}s

# cr-java-0067 FIX: Booking cache TTL for Amazon ElastiCache for Redis.
# Replaces the unbounded in-memory HashMap (bookingCache) in BookingController.
# Each booking entry stored in Redis will automatically expire after this many seconds,
# preventing indefinite memory growth and ensuring stale data is evicted consistently
# across all application instances. Override via BOOKING_CACHE_TTL_SECONDS env var
# or AWS Systems Manager Parameter Store (/resorts-lite/cache/booking-ttl-seconds).
# Default: 3600 seconds (1 hour).
cache.booking.ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:3600}
