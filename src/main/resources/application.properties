# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 remediation: Hard-coded port replaced with environment-variable binding.
# Container orchestration platforms (GCP Cloud Run, GKE) assign ports dynamically via the
# PORT environment variable. Spring Boot's relaxed binding maps SERVER_PORT → server.port,
# so setting PORT or SERVER_PORT in the runtime environment overrides this default.
server.port=${PORT:${SERVER_PORT:8080}}

# cr-java-0069 [Cloud Readiness / Critical]: Database credentials are no longer hard-coded.
# Credentials are resolved at runtime from Google Secret Manager via the sm:// URI scheme
# provided by Spring Cloud GCP Secret Manager (spring-cloud-gcp-starter-secretmanager).
# The GCP_PROJECT_ID environment variable must be set to the target GCP project.
# Secrets must be pre-created in Secret Manager:
#   gcloud secrets create db-username --replication-policy="automatic"
#   echo -n "admin" | gcloud secrets versions add db-username --data-file=-
#   gcloud secrets create db-password --replication-policy="automatic"
#   echo -n "Resort$Pass#2019!" | gcloud secrets versions add db-password --data-file=-
spring.datasource.url=jdbc:postgresql://db-prod.resorts-internal.com:5432/resortsdb
spring.datasource.username=${sm://projects/${GCP_PROJECT_ID}/secrets/db-username/versions/latest}
spring.datasource.password=${sm://projects/${GCP_PROJECT_ID}/secrets/db-password/versions/latest}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA-Hibernate properties (PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0071: Externalized environment-specific service URLs (Hard-coded Environment URLs fix).
# Override these via environment variables in each deployment environment so the same
# application artefact can be promoted from dev → staging → production without code changes.
#
# Inventory service URL — used by BookingController.checkAvailability()
# Set INVENTORY_SERVICE_URL env var in GCP Cloud Run / GKE to the environment-specific value.
app.inventory.service.url=${INVENTORY_SERVICE_URL:http://inventory-service.internal:8081/rooms/available}
#
# Report download base URL — used by ReportService.buildReportDownloadUrl()
# Set REPORT_DOWNLOAD_BASE_URL env var in GCP Cloud Run / GKE to the environment-specific value.
app.report.download.base.url=${REPORT_DOWNLOAD_BASE_URL:http://reports.resorts-internal.com:8080/download/}

# Google Cloud Storage configuration (cr-java-0061)
# Override gcs.bucket.name via the GCS_BUCKET_NAME environment variable in cloud deployments.
gcs.bucket.name=${GCS_BUCKET_NAME:resorts-lite-reports}
gcs.reports.prefix=${GCS_REPORTS_PREFIX:reports/}
gcs.backup.prefix=${GCS_BACKUP_PREFIX:backups/nightly/}

# Spring Cloud GCP Secret Manager — enable bootstrap-phase secret resolution
# so that sm:// references in application.properties are resolved before the
# application context is fully initialised.
spring.cloud.gcp.secretmanager.enabled=true

# ---------------------------------------------------------------------------
# cr-java-0065 remediation: Google Cloud Memorystore for Redis — session store
# ---------------------------------------------------------------------------
# Spring Data Redis connection — backed by Google Cloud Memorystore for Redis.
# Set REDIS_HOST to the Memorystore instance IP in each deployment environment.
# REDIS_PORT defaults to 6379 (standard Redis port).
# In GCP Cloud Run / GKE, inject these as environment variables via the
# deployment configuration (Secret Manager or environment variable bindings).
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# Spring Session — use Redis as the session store so that all application
# instances share session state through Memorystore for Redis.
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=spring:session:resortsLite

# Session TTL — configurable via SESSION_TTL_MINUTES env var (default: 30 min).
session.ttl.minutes=${SESSION_TTL_MINUTES:30}

# ---------------------------------------------------------------------------
# cr-java-0067 remediation: Booking cache TTL — Google Cloud Memorystore for Redis
# ---------------------------------------------------------------------------
# TTL for booking cache entries stored in Redis (key pattern: cache:booking:<bookingId>).
# Replaces the former unbounded static HashMap that had no expiration policy.
# Set CACHE_TTL_MINUTES env var in GCP Cloud Run / GKE to override the default.
cache.ttl.minutes=${CACHE_TTL_MINUTES:60}
