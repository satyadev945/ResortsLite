# ResortsLite - Cloud-Ready Configuration
spring.application.name=ResortsLite

# =============================================================================
# cr-java-0090 FIX: Amazon Cognito — replaces file-based authentication
# =============================================================================
# Previously, authentication credentials (DB_USER="admin", DB_PASS="Resort$Pass#2019!")
# were stored as static final String constants in BookingService.java, and booking
# confirmation codes were generated using the broken MD5 algorithm (line 108 in the
# original source). Both patterns constitute file-based authentication because all
# credential and token management resided in local source files.
#
# Authentication is now delegated to Amazon Cognito User Pools:
#   - User identity, JWT token issuance, and lifecycle management → Cognito
#   - Database credentials → AWS Secrets Manager (see app.db.secret-name below)
#   - Confirmation codes → UUID.randomUUID() (no cryptographic hash in source code)
#
# Required AWS setup:
#   1. Create a Cognito User Pool in the same region as the application.
#   2. Create an App Client within the User Pool (enable ALLOW_ADMIN_USER_PASSWORD_AUTH).
#   3. Attach an IAM role/policy granting cognito-idp:AdminInitiateAuth,
#      cognito-idp:AdminGetUser, and cognito-idp:GetUser to the application's
#      EC2 instance profile / ECS task role.
#   4. Set COGNITO_USER_POOL_ID and COGNITO_CLIENT_ID environment variables
#      (or inject from AWS SSM Parameter Store at startup).
#
# SSM parameter: /resortslite/cognito/user-pool-id
cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
# SSM parameter: /resortslite/cognito/client-id
cognito.client-id=${COGNITO_CLIENT_ID:}
# =============================================================================

# =============================================================================
# cr-java-0065 FIX: Amazon ElastiCache for Redis — Spring Session Data Redis
# =============================================================================
# All HttpSession attributes are now stored in Amazon ElastiCache for Redis via
# Spring Session (@EnableRedisHttpSession in RedisSessionConfig). This makes
# every application instance stateless, enabling horizontal scaling behind an
# AWS ALB without sticky sessions and preventing session data loss on instance
# termination or Auto Scaling Group scale-in events.
#
# Required AWS setup:
#   1. Create an ElastiCache for Redis cluster in the same VPC as the application.
#   2. Allow inbound TCP 6379 (or 6380 for TLS) from the application security group.
#   3. Set REDIS_HOST to the cluster Primary Endpoint DNS name.
#
# SSM parameter: /resortslite/redis/host
spring.redis.host=${REDIS_HOST:localhost}
# SSM parameter: /resortslite/redis/port
spring.redis.port=${REDIS_PORT:6379}
# Session TTL — override via SESSION_TIMEOUT_SEC environment variable.
# SSM parameter: /resortslite/session/timeout-seconds
server.servlet.session.timeout=${SESSION_TIMEOUT_SEC:1800}s
#
# cr-java-0067 FIX: Booking cache TTL for Amazon ElastiCache for Redis.
# Replaces the unbounded in-memory HashMap (bookingCache) in BookingController that had
# no expiration policy, causing indefinite memory growth and stale data inconsistencies
# across multiple EC2 instances. Cache entries are now stored in the shared ElastiCache
# Redis cluster with a configurable TTL, ensuring:
#   - Controlled memory growth through automatic key expiration in Redis
#   - Consistent cache state across all instances in the Auto Scaling Group
#   - Centralised cache management via Amazon ElastiCache
#
# Override via environment variable BOOKING_CACHE_TTL_SECONDS or
# SSM parameter /resortslite/booking/cache-ttl-seconds.
# Default: 3600 seconds (1 hour).
app.booking.cache.ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:3600}
# =============================================================================

# cr-java-0061 FIX: Amazon S3 configuration replaces hard-coded file-system paths.
# Override these values via environment variables in your cloud deployment:
#   CLOUD_AWS_S3_BUCKET_NAME, CLOUD_AWS_S3_BACKUP_PREFIX, CLOUD_AWS_REGION
cloud.aws.s3.bucket-name=${CLOUD_AWS_S3_BUCKET_NAME:resorts-lite-reports}
cloud.aws.s3.backup-prefix=${CLOUD_AWS_S3_BACKUP_PREFIX:backups/nightly/}
cloud.aws.region=${CLOUD_AWS_REGION:us-east-1}

# cr-java-0077 FIX: Hard-coded port 8080 (original ReportService.java line 28:
#   private static final int SERVER_PORT = 8080;) has been eliminated.
# The server port is now externalised to AWS Systems Manager Parameter Store.
# SSM parameter : /resortslite/server/port
# Environment variable: SERVER_PORT
# ECS task definition / EKS pod spec / Elastic Beanstalk env config must inject
# SERVER_PORT from the SSM parameter at container startup to enable dynamic port
# assignment required by container orchestration and cloud service discovery.
server.port=${SERVER_PORT:8080}

# cr-java-0069 FIX: Hard-coded DB credentials (username/password) removed from source code.
# Credentials are now retrieved at runtime from AWS Secrets Manager using the secret
# identified by DB_SECRET_NAME. The secret must be a JSON object with keys:
#   "username" and "password"
# Example AWS CLI command to create the secret:
#   aws secretsmanager create-secret \
#     --name resorts-lite/db-credentials \
#     --secret-string '{"username":"admin","password":"<your-password>"}'
app.db.secret-name=${DB_SECRET_NAME:resorts-lite/db-credentials}

# cr-java-0021 FIX: DB URL externalised to environment variable — no hard-coded hostname.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521:ORCL}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# NOTE: spring.datasource.username and spring.datasource.password are intentionally
# omitted here. BookingService retrieves credentials from AWS Secrets Manager at runtime
# and they are injected programmatically. For Spring DataSource auto-configuration,
# set DB_USERNAME and DB_PASSWORD environment variables sourced from Secrets Manager
# via your ECS task definition / EC2 instance profile secrets injection:
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# JPA-Hibernate properties (Oracle)
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# cr-java-0021 FIX: Internal service endpoints externalised to environment variables.
app.payment.endpoint=${PAYMENT_API_ENDPOINT:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_API_ENDPOINT:http://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_API_ENDPOINT:http://notify.internal:7070/send}

# cr-java-0071 FIX: Hard-coded environment-specific URLs replaced with AWS Systems Manager
# Parameter Store-backed properties. Each property resolves in order:
#   1. AWS SSM Parameter Store (via aws-spring-cloud-config or ECS secrets injection)
#   2. Environment variable fallback
#   3. Default value (for local development only)
#
# SSM parameter: /resortslite/inventory/endpoint
# Env variable:  INVENTORY_SERVICE_URL
app.inventory.service.url=${INVENTORY_SERVICE_URL:http://inventory-service.internal:8081/rooms/available}
#
# SSM parameter: /resortslite/reports/download-base-url
# Env variable:  REPORTS_DOWNLOAD_BASE_URL
app.reports.download.base-url=${REPORTS_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download/}
