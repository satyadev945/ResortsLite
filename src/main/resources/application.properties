spring.application.name=ResortsLite
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.database.host=${DB_HOST:localhost}
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal/send}
app.report.base-path=${REPORT_BASE_PATH:./reports}
app.report.backup-path=${REPORT_BACKUP_PATH:./backups/nightly}
app.report.base-url=${REPORT_BASE_URL:https://reports.resorts-internal.com/download}

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
