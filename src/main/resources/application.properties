spring.application.name=ResortsLite
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.payment.endpoint=${APP_PAYMENT_ENDPOINT:https://payment-svc.internal/charge}
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms}
app.notification.endpoint=${APP_NOTIFICATION_ENDPOINT:https://notify.internal/send}
app.report.download-base-url=${APP_REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download}
app.report.server-port=${APP_REPORT_SERVER_PORT:${SERVER_PORT:8080}}
app.report.container-name=${AZURE_BLOB_REPORTS_CONTAINER:reports}
app.report.backup-container-name=${AZURE_BLOB_BACKUPS_CONTAINER:report-backups}
app.report.schedule-queue=${AZURE_SERVICEBUS_REPORT_QUEUE:report-jobs}
app.report.schedule-delay-minutes=${AZURE_SERVICEBUS_REPORT_DELAY_MINUTES:5}

azure.app.configuration.connection-string=${AZURE_APP_CONFIGURATION_CONNECTION_STRING:}
azure.keyvault.url=${AZURE_KEYVAULT_URL:}
azure.storage.blob.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:}
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}

spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.password=${SPRING_REDIS_PASSWORD:}
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session
app.cache.ttl-seconds=${APP_CACHE_TTL_SECONDS:300}

spring.cloud.azure.active-directory.enabled=${AZURE_AD_ENABLED:false}
