# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# -----------------------------------------------------------------------
# cr-java-0065 FIX: Spring Session — Amazon ElastiCache for Redis
# All HTTP session state is now stored in a centralised Amazon ElastiCache
# for Redis cluster via Spring Session (spring-session-data-redis).
# This replaces server-local HttpSession storage, enabling stateless
# application instances that can be freely load-balanced by AWS ALB,
# auto-scaled, and replaced without any session data loss.
#
# Required environment variables for cloud deployment:
#   REDIS_HOST  — ElastiCache primary endpoint (e.g. my-cluster.abc123.ng.0001.use1.cache.amazonaws.com)
#   REDIS_PORT  — ElastiCache port (default: 6379)
#   REDIS_SSL   — Set to true when using ElastiCache in-transit encryption (recommended)
#
# For local development the defaults below connect to a local Redis instance.
# -----------------------------------------------------------------------

# Spring Session store type: redis (backed by Amazon ElastiCache for Redis)
spring.session.store-type=redis
# Session timeout (30 minutes); override via SESSION_TIMEOUT env var
spring.session.timeout=${SESSION_TIMEOUT:1800s}
# Flush session to Redis immediately on each setAttribute call
spring.session.redis.flush-mode=on_save
# Redis namespace for session keys
spring.session.redis.namespace=spring:session:resortslite

# Amazon ElastiCache for Redis connection settings
# Override REDIS_HOST with the ElastiCache primary endpoint in cloud deployments
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
# Enable SSL/TLS for ElastiCache in-transit encryption (set REDIS_SSL=true in production)
spring.redis.ssl=${REDIS_SSL:false}
# Connection pool settings for Lettuce (default Redis client)
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=2
spring.redis.lettuce.pool.max-wait=-1ms

# -----------------------------------------------------------------------
# cr-java-0069 FIX: AWS Secrets Manager — DB credentials
# Hard-coded DB_USER and DB_PASS constants have been removed from
# BookingService.java.  At runtime, AwsSecretsManagerUtil fetches the
# secret named below from AWS Secrets Manager and caches the credentials.
# Override via environment variable DB_SECRET_NAME in cloud deployments.
# -----------------------------------------------------------------------
aws.db.secret.name=${DB_SECRET_NAME:resortslite/db/credentials}


# -----------------------------------------------------------------------
# cr-java-0077 FIX: Hard-coded port replaced with environment variable injection.
# The SERVER_PORT environment variable is injected at runtime by ECS task definitions,
# EKS pod specs, or Elastic Beanstalk environment configuration, enabling dynamic port
# assignment required by container orchestration platforms and AWS service discovery.
# AWS Systems Manager Parameter Store can supply this value via the SERVER_PORT env var.
# Override at runtime: set SERVER_PORT environment variable in your deployment config.
# -----------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:oracle:thin:@db-prod.resorts-internal.com:1521:ORCL
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0061: Amazon S3 configuration — replaces hard-coded file-system paths.
# Set app.s3.reports.bucket via environment variable (AWS_S3_REPORTS_BUCKET) or
# AWS Parameter Store / Secrets Manager injection at deploy time.
app.s3.reports.bucket=${AWS_S3_REPORTS_BUCKET:resortslite-reports}
# Optional key prefix inside the bucket (defaults to "reports/")
app.s3.reports.prefix=${AWS_S3_REPORTS_PREFIX:reports/}
# AWS region used by the S3 client bean
aws.region=${AWS_REGION:us-east-1}

# -----------------------------------------------------------------------
# cr-java-0071 FIX: AWS SSM Parameter Store — environment-specific URLs
# Hard-coded URL literals in BookingController and ReportService have been
# replaced with values fetched from AWS SSM Parameter Store at startup.
# Override the parameter paths via environment variables in cloud deployments.
# -----------------------------------------------------------------------
# SSM parameter path for the inventory-service URL
# (BookingController.checkAvailability — original hard-coded: http://inventory-service.internal:8081/rooms/available)
aws.ssm.inventory.url.param=${SSM_INVENTORY_URL_PARAM:/resortslite/inventory/service-url}
# SSM parameter path for the report-download base URL
# (ReportService.buildReportDownloadUrl — original hard-coded: http://reports.resorts-internal.com:8080/download/)
aws.ssm.report.download.url.param=${SSM_REPORT_DOWNLOAD_URL_PARAM:/resortslite/reports/download-url}

# -----------------------------------------------------------------------
# cr-java-0090 FIX: Amazon Cognito — User Identity and Authentication
# File-based authentication (hard-coded DB_USER, DB_PASS, DB_HOST constants
# stored in source files) has been replaced with:
#   1. AWS Secrets Manager — for database credentials (via AwsSecretsManagerUtil)
#   2. Amazon Cognito     — for user identity management (via CognitoTokenValidator)
#
# Cognito provides centralised, encrypted, and auditable authentication with
# built-in user lifecycle management (sign-up, sign-in, MFA, password reset).
# JWT tokens issued by Cognito are validated on every authenticated request,
# replacing the previous file-based credential lookup pattern.
#
# Required environment variables for cloud deployment:
#   COGNITO_USER_POOL_ID  — Cognito User Pool ID (e.g. us-east-1_AbCdEfGhI)
#   COGNITO_REGION        — AWS region of the User Pool (e.g. us-east-1)
#   COGNITO_CLIENT_ID     — App Client ID registered in the Cognito User Pool
#
# Set aws.cognito.validation.enabled=false for local development to bypass
# token validation when running without AWS credentials.
# -----------------------------------------------------------------------

# Cognito User Pool ID — override via COGNITO_USER_POOL_ID environment variable
aws.cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
# AWS region where the Cognito User Pool is hosted
aws.cognito.region=${COGNITO_REGION:us-east-1}
# Cognito App Client ID registered for this application
aws.cognito.client-id=${COGNITO_CLIENT_ID:}
# Enable/disable Cognito JWT validation (set to true in production)
aws.cognito.validation.enabled=${COGNITO_VALIDATION_ENABLED:true}
