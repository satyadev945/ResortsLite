# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# -----------------------------------------------------------------------
# Amazon ElastiCache for Redis — cr-java-0065 remediation
# HTTP session state migrated from instance-local HttpSession to distributed
# Redis store via Spring Session, enabling stateless horizontal scaling.
#
# Set REDIS_HOST to your ElastiCache Primary Endpoint, e.g.:
#   my-cluster.abc123.ng.0001.use1.cache.amazonaws.com
# Set REDIS_PORT to 6379 (default ElastiCache port).
# Set SESSION_TTL_SECONDS to control session expiry (default: 1800 = 30 min).
#
# Spring Session stores all session data in Redis automatically once
# @EnableRedisHttpSession is active (see RedisSessionConfig.java).
# -----------------------------------------------------------------------
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session
SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:1800}

# -----------------------------------------------------------------------
# Amazon ElastiCache for Redis — cr-java-0067 remediation
# In-memory HashMap cache (bookingCache) replaced with Redis-backed cache
# with TTL to prevent unbounded memory growth and ensure cache consistency
# across all horizontally-scaled EC2 instances.
# BOOKING_CACHE_TTL_SECONDS controls how long booking entries are cached (default: 1 hour).
# -----------------------------------------------------------------------
BOOKING_CACHE_TTL_SECONDS=${BOOKING_CACHE_TTL_SECONDS:3600}

# -----------------------------------------------------------------------
# Amazon S3 configuration — cr-java-0061 remediation
# Hard-coded file paths replaced with S3 bucket/prefix (override via env)
# -----------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:resorts-reports-bucket}
aws.s3.backup-prefix=${AWS_S3_BACKUP_PREFIX:backups/nightly/}

# -----------------------------------------------------------------------
# AWS Secrets Manager configuration — cr-java-0069 remediation
# Hard-coded DB_USER and DB_PASS replaced with AWS Secrets Manager lookup.
# Set DB_SECRET_NAME env var to the secret name/ARN in AWS Secrets Manager.
# -----------------------------------------------------------------------
aws.secretsmanager.secret-name=${DB_SECRET_NAME:resortslite/db/credentials}

# -----------------------------------------------------------------------
# AWS Systems Manager Parameter Store configuration — cr-java-0071 remediation
# Hard-coded environment-specific URLs replaced with SSM Parameter Store lookups.
# Set the env vars below to the SSM parameter names/paths for each environment.
#
# Required SSM parameters (create in AWS Console or CLI):
#   /resortslite/inventory/url      -> e.g. https://inventory-service.internal:8081/rooms/available
#   /resortslite/reports/base-url   -> e.g. https://reports.resorts-internal.com:8080/download/
# -----------------------------------------------------------------------
aws.ssm.inventory-url-param=${SSM_INVENTORY_URL_PARAM:/resortslite/inventory/url}
aws.ssm.reports-base-url-param=${SSM_REPORTS_BASE_URL_PARAM:/resortslite/reports/base-url}

# Fallback values used when SSM Parameter Store is unavailable (local dev / non-AWS environments).
# These replace the previously hard-coded URLs and use HTTPS per cloud security standards.
app.inventory.endpoint.fallback=${APP_INVENTORY_ENDPOINT:https://inventory-service.internal:8081/rooms/available}
app.reports.base-url.fallback=${APP_REPORTS_BASE_URL:https://reports.resorts-internal.com:8080/download/}

# -----------------------------------------------------------------------
# Server port configuration — cr-java-0077 remediation
# Hard-coded port 8080 replaced with environment-variable injection backed by
# AWS Systems Manager Parameter Store (/resortslite/server/port).
# ECS / EKS / Elastic Beanstalk inject SERVER_PORT at container startup for
# dynamic port assignment and cloud service-discovery compatibility.
# -----------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
aws.ssm.server-port-param=${SSM_SERVER_PORT_PARAM:/resortslite/server/port}
# Fallback used when SSM Parameter Store is unavailable (local dev / non-AWS)
app.server.port.fallback=${SERVER_PORT:8080}

# -----------------------------------------------------------------------
# Amazon Cognito configuration — cr-java-0090 remediation
# File-based authentication replaced with Amazon Cognito User Pools for
# centralized, encrypted, and auditable user identity management.
#
# Required environment variables:
#   COGNITO_USER_POOL_ID          - Cognito User Pool ID
#                                   (e.g. us-east-1_AbCdEfGhI)
#   COGNITO_APP_CLIENT_ID         - Cognito App Client ID
#                                   (e.g. 1example23456789)
#   COGNITO_APP_CLIENT_SECRET_NAME - Secrets Manager secret name holding the
#                                    Cognito App Client Secret
#                                    (default: resortslite/cognito/app-client-secret)
#
# Create the Cognito User Pool and App Client via AWS Console or CLI, then
# store the App Client Secret in AWS Secrets Manager under the secret name
# configured by COGNITO_APP_CLIENT_SECRET_NAME.
# -----------------------------------------------------------------------
aws.cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
aws.cognito.app-client-id=${COGNITO_APP_CLIENT_ID:}
aws.cognito.app-client-secret-name=${COGNITO_APP_CLIENT_SECRET_NAME:resortslite/cognito/app-client-secret}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:oracle:thin:@db-prod.resorts-internal.com:1521:ORCL
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send
