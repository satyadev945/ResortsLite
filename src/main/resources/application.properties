# ResortsLite - Legacy Configuration

# Azure App Configuration for externalized configuration management
# FIXED cr-java-0071: Using Azure App Configuration for environment-specific URLs
spring.cloud.azure.appconfiguration.enabled=${AZURE_APP_CONFIG_ENABLED:false}
spring.cloud.azure.appconfiguration.stores[0].endpoint=${AZURE_APP_CONFIG_ENDPOINT:https://resorts-appconfig.azconfig.io}
spring.cloud.azure.appconfiguration.stores[0].connection-string=${AZURE_APP_CONFIG_CONNECTION_STRING:}
# Load configuration with label matching the environment (dev, staging, prod)
spring.cloud.azure.appconfiguration.stores[0].selects[0].label-filter=${AZURE_APP_CONFIG_LABEL:prod}

spring.application.name=ResortsLite

# FIXED cr-java-0077: Externalized server port to environment variable for Azure container orchestration
# Port is dynamically assigned by Azure Container Apps / AKS and passed via environment variable
server.port=${SERVER_PORT:8080}

# Azure Key Vault Configuration for secure credential management
azure.keyvault.uri=${AZURE_KEYVAULT_URI:https://resorts-keyvault.vault.azure.net/}
azure.keyvault.enabled=${AZURE_KEYVAULT_ENABLED:true}

# Database configuration using Azure Key Vault references
# Credentials are retrieved from Azure Key Vault at runtime using DefaultAzureCredential
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@${DB_HOST:db-prod.resorts-internal.com}:1521:ORCL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Service Endpoints Configuration
# FIXED cr-java-0071: Externalized environment-specific URLs to Azure App Configuration
# These can be overridden via environment variables or Azure App Configuration
app.payment.endpoint=${APP_PAYMENT_ENDPOINT:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:http://inventory-svc.internal:8081/rooms}
app.notification.endpoint=http://notify.internal:7070/send
# Report download base URL for cloud-native report access
app.reports.download.baseurl=${APP_REPORTS_DOWNLOAD_BASEURL:https://reports.resorts-internal.com}

# Azure Blob Storage Configuration for cloud-native file storage
# Replace hard-coded file paths with Azure Blob Storage
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=https;AccountName=resortstorage;AccountKey=placeholder;EndpointSuffix=core.windows.net}
azure.storage.container.reports=${AZURE_STORAGE_CONTAINER_REPORTS:reports}
azure.storage.container.backups=${AZURE_STORAGE_CONTAINER_BACKUPS:backups}
azure.storage.enabled=${AZURE_STORAGE_ENABLED:true}

# Azure Cache for Redis Configuration for session state management
# FIXED cr-java-0065: Externalized HTTP session state to Azure Cache for Redis
# Enables stateless application architecture and horizontal scaling
spring.redis.host=${AZURE_REDIS_HOST:resorts-cache.redis.cache.windows.net}
spring.redis.port=${AZURE_REDIS_PORT:6380}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.redis.ssl=true
spring.redis.timeout=2000ms
# Spring Session configuration
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session

# Azure Active Directory (Entra ID) Configuration for centralized authentication
# FIXED cr-java-0090: Migrated from file-based authentication to Azure AD with Spring Security
# Azure AD provides centralized identity management, SSO, and MFA capabilities
spring.cloud.azure.active-directory.enabled=${AZURE_AD_ENABLED:true}
spring.cloud.azure.active-directory.profile.tenant-id=${AZURE_AD_TENANT_ID:}
spring.cloud.azure.active-directory.credential.client-id=${AZURE_AD_CLIENT_ID:}
spring.cloud.azure.active-directory.credential.client-secret=${AZURE_AD_CLIENT_SECRET:}
# Azure AD application ID URI for API access
spring.cloud.azure.active-directory.app-id-uri=${AZURE_AD_APP_ID_URI:api://resortslite}
# Authorization configuration
spring.cloud.azure.active-directory.authorization-clients.graph.scopes=https://graph.microsoft.com/User.Read
# JWT token validation
spring.cloud.azure.active-directory.jwt-connect-timeout=5000
spring.cloud.azure.active-directory.jwt-read-timeout=5000
spring.cloud.azure.active-directory.jwt-size-limit=50000

# Azure Service Bus Configuration for distributed scheduled message delivery
# FIXED cr-java-0111: Replaced java.util.Timer with Azure Service Bus scheduled messages
# Provides timezone-agnostic, distributed task scheduling across Azure regions
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.namespace=${AZURE_SERVICEBUS_NAMESPACE:resorts-servicebus}
azure.servicebus.queue.scheduled-reports=${AZURE_SERVICEBUS_QUEUE_SCHEDULED_REPORTS:scheduled-reports}
azure.servicebus.enabled=${AZURE_SERVICEBUS_ENABLED:true}
