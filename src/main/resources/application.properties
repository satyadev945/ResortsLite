spring.application.name=ResortsLite

server.port=${SERVER_PORT:${APP_SERVER_PORT:8080}}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=${SPRING_H2_CONSOLE_PATH:/h2-console}

app.payment.endpoint=${APP_PAYMENT_ENDPOINT:https://payment.example.internal/charge}
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:https://inventory.example.internal/rooms/available}
app.notification.endpoint=${APP_NOTIFICATION_ENDPOINT:https://notify.example.internal/send}
app.report.download-base-url=${APP_REPORT_DOWNLOAD_BASE_URL:https://reports.example.internal/download}
app.report.server-port=${APP_REPORT_SERVER_PORT:${SERVER_PORT:${APP_SERVER_PORT:8080}}}
app.report.container-name=${AZURE_BLOB_REPORTS_CONTAINER:reports}
app.report.backup-container-name=${AZURE_BLOB_BACKUP_CONTAINER:report-backups}
app.report.storage-connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
app.report.storage-endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:}
app.report.schedule-queue=${AZURE_SERVICEBUS_REPORT_QUEUE:report-jobs}
app.report.schedule-delay-minutes=${REPORT_SCHEDULE_DELAY_MINUTES:5}
app.config.connection-string=${AZURE_APP_CONFIGURATION_CONNECTION_STRING:}
app.config.report-download-url-key=${AZURE_APP_CONFIG_REPORT_DOWNLOAD_URL_KEY:app.report.download-base-url}
app.config.inventory-url-key=${AZURE_APP_CONFIG_INVENTORY_URL_KEY:app.inventory.endpoint}
app.config.report-port-key=${AZURE_APP_CONFIG_REPORT_PORT_KEY:app.report.server-port}
app.config.payment-url-key=${AZURE_APP_CONFIG_PAYMENT_URL_KEY:app.payment.endpoint}
app.keyvault.url=${AZURE_KEYVAULT_URL:}
app.keyvault.db-host-secret=${AZURE_KEYVAULT_DB_HOST_SECRET:db-host}
app.keyvault.db-user-secret=${AZURE_KEYVAULT_DB_USER_SECRET:db-user}
app.keyvault.db-password-secret=${AZURE_KEYVAULT_DB_PASSWORD_SECRET:db-password}
app.redis.ttl-seconds=${AZURE_REDIS_TTL_SECONDS:900}
app.auth.mode=${APP_AUTH_MODE:azure-ad}

spring.session.store-type=redis
spring.session.redis.namespace=${SPRING_SESSION_REDIS_NAMESPACE:resortslite:session}
spring.session.redis.flush-mode=on_save
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.password=${SPRING_REDIS_PASSWORD:}
spring.redis.ssl=${SPRING_REDIS_SSL:false}

spring.cloud.azure.active-directory.enabled=${AZURE_AD_ENABLED:false}
spring.cloud.azure.active-directory.profile.tenant-id=${AZURE_TENANT_ID:}
spring.cloud.azure.active-directory.credential.client-id=${AZURE_CLIENT_ID:}
