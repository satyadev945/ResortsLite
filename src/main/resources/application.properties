# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cz-java-0061: Port externalized via SERVER_PORT env var (AKS ConfigMap)
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:postgresql://db-prod.resorts-internal.com:5432/ResortsDB
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# JPA-Hibernate properties (PostgreSQL) — IDENTITY keys, same entity shape as the Oracle Doctor
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# Externalized file paths (cz-java-0057) - inject via Kubernetes ConfigMap / env vars
app.report.base-path=${REPORT_BASE_PATH:/app/reports/}
app.backup.base-path=${BACKUP_BASE_PATH:/app/backups/}

# Health check endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# cz-java-0063: Spring Session backed by Azure Cache for Redis.
# REDIS_HOST / REDIS_PORT / REDIS_PASSWORD injected from Azure Key Vault via Secrets Store CSI Driver (AKS).
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session
spring.session.timeout=30m
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6380}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL_ENABLED:true}

# cz-java-0069: Redis-backed sessions - persist session writes immediately so they survive pod restarts/scaling
spring.session.redis.flush-mode=immediate
spring.session.redis.save-mode=on_set_attribute

# cz-java-0070: TTL for booking cache entries stored in Azure Cache for Redis
app.cache.booking-ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:3600}
