# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
# Port externalised: supplied by Azure App Service / Container Apps (PORT / WEBSITES_PORT) or Azure App Configuration
server.port=${SERVER_PORT:${PORT:${WEBSITES_PORT:0}}}
# Report download service host/port externalised (Azure App Configuration / environment variables)
app.reports.download.host=${REPORTS_DOWNLOAD_HOST:reports.resorts-internal.com}
app.reports.download.port=${REPORTS_DOWNLOAD_PORT:${SERVER_PORT:${PORT:${WEBSITES_PORT:0}}}}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:sqlserver://db-prod.resorts-internal.com:1433;databaseName=ResortsDB;encrypt=false;trustServerCertificate=true
# Credentials are sourced from Azure Key Vault (secrets db-username / db-password) and
# injected as environment variables (e.g. Key Vault references); nothing is stored here.
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
app.keyvault.uri=${AZURE_KEYVAULT_URI:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA-Hibernate properties (SQL Server) — IDENTITY keys, same entity shape as the Oracle Doctor
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# Azure Blob Storage (cr-java-0061) - externalised via environment variables
# Use either a connection string or an account endpoint (Managed Identity / DefaultAzureCredential)
app.storage.azure.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
app.storage.azure.endpoint=${AZURE_STORAGE_ENDPOINT:}
app.storage.azure.reports-container=${AZURE_STORAGE_REPORTS_CONTAINER:resort-reports}
app.storage.azure.reports-prefix=${AZURE_STORAGE_REPORTS_PREFIX:reports/}
app.storage.azure.backup-prefix=${AZURE_STORAGE_BACKUP_PREFIX:backups/nightly/}

# Azure Cache for Redis (cr-java-0065) - externalised booking/session state
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6380}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.redis.ssl=${AZURE_REDIS_SSL:true}
spring.redis.timeout=${AZURE_REDIS_TIMEOUT:5000ms}
app.state.ttl-minutes=${APP_STATE_TTL_MINUTES:30}
