# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:postgresql://db-prod.resorts-internal.com:5432/resortslite
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA-Hibernate properties (PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cz-java-0062 FIX: Payment API URL externalised from hardcoded IP "10.0.1.45".
# Override PAYMENT_API_URL via Kubernetes ConfigMap / EKS Pod env var at runtime.
# Use the Kubernetes cluster-internal DNS service name for intra-cluster communication
# on Amazon EKS (e.g. http://payment-service.default.svc.cluster.local:9090/payments/charge).
PAYMENT_API_URL=${PAYMENT_API_URL:http://payment-service.default.svc.cluster.local:9090/payments/charge}

# cz-java-0057 FIX: Default fallback values for absolute file path environment variables.
# Override REPORT_BASE_PATH and BACKUP_PATH via Kubernetes ConfigMap / EKS Pod env vars.
REPORT_BASE_PATH=/var/reports
BACKUP_PATH=/var/backups/nightly

# health-check-endpoint: Expose Spring Boot Actuator health endpoint for container probes.
# Kubernetes liveness and readiness probes should target GET /actuator/health.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# cz-java-0069 FIX: Spring Session backed by Amazon ElastiCache for Redis.
# All HttpSession operations are transparently delegated to Redis by Spring Session's
# SessionRepositoryFilter, making sessions durable across pod restarts and shared
# across all EKS pod replicas for stateless horizontal scaling.
#
# Override spring.redis.host and spring.redis.port at runtime via environment variables
# SPRING_REDIS_HOST and SPRING_REDIS_PORT injected through a Kubernetes Secret or ConfigMap
# pointing to the Amazon ElastiCache for Redis primary endpoint.
#
# Example Kubernetes env var injection:
#   env:
#     - name: SPRING_REDIS_HOST
#       valueFrom:
#         secretKeyRef:
#           name: elasticache-secret
#           key: redis-host
#     - name: SPRING_REDIS_PORT
#       value: "6379"
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}

# Spring Session store type — use Redis for distributed session management
spring.session.store-type=redis
# Session timeout (30 minutes); override via SPRING_SESSION_TIMEOUT env var if needed
spring.session.timeout=1800s
