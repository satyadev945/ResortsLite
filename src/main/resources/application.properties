# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0061 FIX: Amazon S3 configuration for report storage.
# Replaces hardcoded absolute file paths (/var/legacy/reports/, C:\ResortBackups\nightly\).
# Override these values via environment variables: AWS_S3_REPORTS_BUCKET, etc.
aws.s3.reports.bucket=${AWS_S3_REPORTS_BUCKET:resorts-reports-bucket}
aws.s3.reports.prefix=${AWS_S3_REPORTS_PREFIX:reports/}
aws.s3.backup.prefix=${AWS_S3_BACKUP_PREFIX:backups/nightly/}

# cr-java-0077 FIX: Hard-coded port 8080 replaced with environment variable injection.
# AWS ECS/EKS/Elastic Beanstalk injects SERVER_PORT at runtime via task-definition / env config.
# AWS Systems Manager Parameter Store parameter: /resortslite/server/port
# Fallback default (8080) is used only for local development when SERVER_PORT is not set.
server.port=${SERVER_PORT:8080}

# cr-java-0069 FIX: Hard-coded DB credentials removed. Credentials are now retrieved at
# runtime from AWS Secrets Manager via BookingService.getDbCredentials().
# The datasource URL is externalised to an environment variable; no credentials in source.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@db-prod.resorts-internal.com:1521:ORCL}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# spring.datasource.username and spring.datasource.password are intentionally omitted here.
# They are supplied at runtime by the AWS Secrets Manager integration in BookingService.

# AWS Secrets Manager configuration (cr-java-0069)
# Set DB_SECRET_NAME env var to the Secrets Manager secret name holding DB credentials JSON.
# Expected secret format: {"username":"<user>","password":"<pass>"}
aws.secretsmanager.db.secret-name=${DB_SECRET_NAME:resortslite/db/credentials}
aws.region=${AWS_REGION:us-east-1}

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0071 FIX: Hard-coded environment URLs externalized via AWS Systems Manager Parameter Store.
# These properties are resolved at runtime from SSM Parameter Store parameters:
#   /resortslite/inventory/service/url  → app.inventory.service.url
#   /resortslite/reports/download/base-url → app.reports.download.base-url
# Override via environment variables INVENTORY_SERVICE_URL / REPORTS_DOWNLOAD_BASE_URL,
# or supply the SSM parameter names through Spring Cloud AWS SSM integration.
# Default values below are safe fallbacks for local development only.
app.inventory.service.url=${INVENTORY_SERVICE_URL:https://inventory-service.internal:8081/rooms/available}
app.reports.download.base-url=${REPORTS_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download/}

# cr-java-0065 FIX: Spring Session backed by Amazon ElastiCache for Redis.
# Activating Redis as the session store makes all HttpSession data distributed and
# shared across every application instance. AWS ALB can route requests to any instance
# without sticky sessions; auto-scaling and failover no longer cause session data loss.
#
# Set the following environment variables in your ECS task definition / EC2 launch config:
#   REDIS_HOST  — ElastiCache primary endpoint (e.g. my-cluster.abc123.ng.0001.use1.cache.amazonaws.com)
#   REDIS_PORT  — ElastiCache port (default 6379)
#   REDIS_SSL   — set to 'true' when using in-transit encryption on ElastiCache
#
# Spring Session store type — must be 'redis' to activate Redis-backed sessions
spring.session.store-type=redis
# Session timeout (30 minutes); adjust to match your application's idle-session policy
spring.session.timeout=1800
# Redis connection details — resolved from environment variables at runtime
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.ssl=${REDIS_SSL:false}
# Redis namespace prefix for Spring Session keys (avoids collisions with other apps)
spring.session.redis.namespace=resortslite:session

# cr-java-0067 FIX: Amazon ElastiCache for Redis — booking cache TTL configuration.
# Replaces the unbounded in-memory HashMap (bookingCache) that caused indefinite memory
# growth and stale data inconsistencies across multiple application instances.
# All booking cache entries are stored in the shared ElastiCache Redis cluster with a
# configurable TTL so they expire automatically and remain consistent across instances.
#
# Set BOOKING_CACHE_TTL_SECONDS in your ECS task definition / EC2 launch config, or
# supply the value via AWS Systems Manager Parameter Store:
#   /resortslite/booking/cache/ttl-seconds
# Default: 3600 seconds (1 hour). Adjust to match your booking session lifecycle.
app.booking.cache.ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:3600}
