services:
  resortlite-mono1:
    image: resortlite-mono1:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}"
      REDIS_HOST: "${REDIS_HOST:?set REDIS_HOST}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_SSL: "${REDIS_SSL:-false}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD}"
      PAYMENT_API_URL: "${PAYMENT_API_URL:?set PAYMENT_API_URL}"
      CACHE_TTL: "${CACHE_TTL:-1h}"
      REPORT_PATH: /app/reports
      BACKUP_PATH: /app/backups
    volumes:
      - reports-data:/app/reports
      - backups-data:/app/backups
    restart: unless-stopped

volumes:
  reports-data:
  backups-data:
