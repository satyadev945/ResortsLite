version: "3.8"

services:
  resortslite:
    image: resortslite:latest
    container_name: resortslite-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Spring Boot profile
      SPRING_PROFILES_ACTIVE: docker

      # Server configuration
      SERVER_PORT: "8080"

      # PostgreSQL Database connection (provide via .env or environment)
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL:-jdbc:postgresql://localhost:5432/resortslite}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME:-admin}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD:-changeme}"

      # Redis / ElastiCache session store
      REDIS_HOST: "${REDIS_HOST:-localhost}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_SSL: "${REDIS_SSL:-false}"

      # Booking cache TTL (seconds)
      BOOKING_CACHE_TTL_SECONDS: "${BOOKING_CACHE_TTL_SECONDS:-3600}"

      # Internal service endpoints
      PAYMENT_SERVICE_URL: "${PAYMENT_SERVICE_URL:-http://payment-service:9090/payments/charge}"

      # File paths
      REPORT_BASE_PATH: "${REPORT_BASE_PATH:-/reports}"
      BACKUP_PATH: "${BACKUP_PATH:-/backups}"

      # JVM options
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

    volumes:
      - reports-data:/reports
      - backups-data:/backups

    networks:
      - app-network

    restart: unless-stopped

volumes:
  reports-data:
  backups-data:

networks:
  app-network:
    driver: bridge
