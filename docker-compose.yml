version: "3.8"

services:
  resortslite:
    build:
      context: .
      dockerfile: Dockerfile
    image: resortslite:latest
    container_name: resortslite-app
    ports:
      - "8080:8080"
    environment:
      # Spring profile
      SPRING_PROFILES_ACTIVE: docker

      # JVM options
      JAVA_OPTS: >-
        -Xmx512m -Xms256m
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -Djava.security.egd=file:/dev/./urandom
        -Dfile.encoding=UTF-8
        -Duser.timezone=UTC

      # Database connection (provide via .env or environment)
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://<DB_HOST>:5432/<DB_NAME>}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-admin}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-changeme}

      # Redis / ElastiCache session store
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL: ${REDIS_SSL:-false}

      # Booking cache TTL
      BOOKING_CACHE_TTL_SECONDS: ${BOOKING_CACHE_TTL_SECONDS:-3600}

      # Internal service endpoints
      PAYMENT_API_URL: ${PAYMENT_API_URL:-http://payment-svc.default.svc.cluster.local:9090/payments/charge}
      APP_INVENTORY_ENDPOINT: ${APP_INVENTORY_ENDPOINT:-http://inventory-svc.internal:8081/rooms}
      APP_NOTIFICATION_ENDPOINT: ${APP_NOTIFICATION_ENDPOINT:-http://notify.internal:7070/send}

      # File paths
      REPORTS_BASE_PATH: ${REPORTS_BASE_PATH:-/var/reports}
      BACKUP_PATH: ${BACKUP_PATH:-/var/backups/resort/nightly}

    volumes:
      - reports-data:/var/reports
      - backup-data:/var/backups/resort/nightly

    networks:
      - app-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  reports-data:
  backup-data:

networks:
  app-network:
    driver: bridge
