version: "3.8"

services:
  resortslite:
    image: resortslite:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resortslite
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: "8080"
      TZ: UTC
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xms256m"
      # External SQL Server (supply via shell env or .env file)
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      # External Redis / ElastiCache for Spring Session
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED:-false}
      REDIS_HEALTH_ENABLED: ${REDIS_HEALTH_ENABLED:-true}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
      BOOKING_CACHE_TTL_SECONDS: ${BOOKING_CACHE_TTL_SECONDS:-3600}
      REPORT_BASE_PATH: /app/reports/
      REPORT_BACKUP_PATH: /app/backups/nightly/
    volumes:
      - ./data/reports:/app/reports
      - ./data/backups:/app/backups
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
