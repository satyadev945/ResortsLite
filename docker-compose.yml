version: "3.8"

services:
  resortslite:
    image: resortslite:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resortslite
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: UTC
      SERVER_PORT: "8080"
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xms256m"
      # External SQL Server (override hardcoded value in application.properties)
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL:-jdbc:sqlserver://db-prod.resorts-internal.com:1433;databaseName=ResortsDB;encrypt=false;trustServerCertificate=true}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME:-admin}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD:-}"
      # External Redis (session store)
      REDIS_HOST: "${REDIS_HOST:-host.docker.internal}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_SSL_ENABLED: "${REDIS_SSL_ENABLED:-false}"
      BOOKING_CACHE_TTL_SECONDS: "${BOOKING_CACHE_TTL_SECONDS:-3600}"
      PAYMENT_API_URL: "${PAYMENT_API_URL:-http://payment-svc.internal:9090/payments/charge}"
      REPORT_BASE_PATH: /app/reports/
      BACKUP_BASE_PATH: /app/backups/
    volumes:
      - ./config:/app/config
      - resortslite-reports:/app/reports
      - resortslite-backups:/app/backups
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  resortslite-reports:
  resortslite-backups:
