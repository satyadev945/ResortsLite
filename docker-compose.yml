version: '3.8'

services:
  resortslite:
    image: resortslite:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resortslite-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UnlockExperimentalVMOptions -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8"
      SPRING_DATASOURCE_URL: jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      APP_PAYMENT_ENDPOINT: https://payment.example.internal/charge
      APP_INVENTORY_ENDPOINT: https://inventory.example.internal/rooms
      APP_NOTIFICATION_ENDPOINT: https://notify.example.internal/send
      CACHE_PROVIDER: redis
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
