version: "3.8"

services:
  resortslite:
    image: resortslite:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resortslite-app
    ports:
      - "8080:8080"
    environment:
      # JVM settings
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      SPRING_PROFILES_ACTIVE: "docker"
      TZ: "UTC"
      # Database connection (override with actual values)
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/resortsdb}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME:-postgres}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD:-}"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "${SPRING_DATASOURCE_DRIVER_CLASS_NAME:-org.postgresql.Driver}"
      SPRING_JPA_DATABASE_PLATFORM: "${SPRING_JPA_DATABASE_PLATFORM:-org.hibernate.dialect.PostgreSQLDialect}"
      # Application secrets (inject from secrets manager in production)
      JWT_SIGNING_SECRET: "${JWT_SIGNING_SECRET:-changeme-use-secrets-manager-in-prod}"
      # Memcached (Amazon ElastiCache)
      MEMCACHED_ENDPOINT: "${MEMCACHED_ENDPOINT:-localhost:11211}"
      CACHE_TTL_SECONDS: "${CACHE_TTL_SECONDS:-3600}"
      # EFS-backed paths
      REPORT_BASE_PATH: "${REPORT_BASE_PATH:-/mnt/efs/reports/}"
      BACKUP_PATH: "${BACKUP_PATH:-/mnt/efs/backups/nightly/}"
      # Internal service endpoints
      PAYMENT_API_URL: "${PAYMENT_API_URL:-http://payment-service:9090/payments/charge}"
      # ALB sticky session duration
      ALB_STICKY_SESSION_DURATION_SECONDS: "${ALB_STICKY_SESSION_DURATION_SECONDS:-86400}"
      # Server port
      SERVER_PORT: "8080"
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
