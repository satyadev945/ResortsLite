version: "3.8"

services:
  resortsLite:
    image: resortsLite:latest
    container_name: resortsLite-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - TZ=UTC
      # Oracle Database connection — supply at runtime
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:oracle:thin:@<DB_HOST>:1521:<DB_SID>}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-admin}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-changeme}
      # Redis / ElastiCache connection — supply at runtime
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST:-localhost}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT:-6379}
      # Application-specific endpoints — supply at runtime
      - PAYMENT_API_URL=${PAYMENT_API_URL:-http://payment-service:9090/payments/charge}
      - REPORT_BASE_PATH=${REPORT_BASE_PATH:-/var/reports}
      - BACKUP_PATH=${BACKUP_PATH:-/var/backups/nightly}
      - SERVER_PORT=${SERVER_PORT:-8080}
    volumes:
      - reports-data:/var/reports
      - backups-data:/var/backups/nightly
    networks:
      - app-network
    restart: unless-stopped

volumes:
  reports-data:
  backups-data:

networks:
  app-network:
    driver: bridge
