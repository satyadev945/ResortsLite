version: "3.9"

services:
  orcappdbmmono:
    image: orcappdbmmono:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orcappdbmmono
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # PostgreSQL Database connection — supply real values at runtime
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://<DB_HOST>:5432/<DB_NAME>}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-admin}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-changeme}
      # Azure Cache for Redis
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6380}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL: ${REDIS_SSL:-true}
      # Internal service endpoints
      PAYMENT_API_URL: ${PAYMENT_API_URL:-http://payment-service:9090/payments/charge}
      APP_PAYMENT_ENDPOINT: ${APP_PAYMENT_ENDPOINT:-http://payment-svc.internal:9090/charge}
      APP_INVENTORY_ENDPOINT: ${APP_INVENTORY_ENDPOINT:-http://inventory-svc.internal:8081/rooms}
      APP_NOTIFICATION_ENDPOINT: ${APP_NOTIFICATION_ENDPOINT:-http://notify.internal:7070/send}
      # Report paths
      REPORTS_BASE_PATH: ${REPORTS_BASE_PATH:-/var/reports}
      REPORTS_BACKUP_PATH: ${REPORTS_BACKUP_PATH:-/var/backups/nightly}
      # JVM options
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -Xms256m
        -Xmx512m
        -Dfile.encoding=UTF-8
        -Duser.timezone=UTC
    volumes:
      - reports-data:/var/reports
      - backups-data:/var/backups/nightly
    networks:
      - app-network
    restart: unless-stopped

volumes:
  reports-data:
  backups-data:

networks:
  app-network:
    driver: bridge
