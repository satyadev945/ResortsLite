version: "3.9"

# =============================================================================
# ResortsLite - Docker Compose (Application Only)
# NOTE: Database, Kafka, Redis, and other infrastructure services are NOT
#       included here. They are provided separately via environment variables.
# =============================================================================

services:
  resortsLite:
    build:
      context: .
      dockerfile: Dockerfile
    image: resortsLite:latest
    container_name: resortsLite-app
    ports:
      - "8080:8080"
    environment:
      # JVM settings
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      # Spring profile
      SPRING_PROFILES_ACTIVE: docker
      # Application port
      SERVER_PORT: "8080"
      # JWT secret — override with a strong secret in production
      JWT_SECRET: "${JWT_SECRET:-default-dev-secret-change-in-production}"
      # Amazon ElastiCache (Memcached) endpoint
      MEMCACHED_ENDPOINT: "${MEMCACHED_ENDPOINT:-localhost:11211}"
      # ECS Service Connect / inter-service URLs
      INVENTORY_SERVICE_URL: "${INVENTORY_SERVICE_URL:-http://inventory-service:8081}"
      PAYMENT_SERVICE_URL: "${PAYMENT_SERVICE_URL:-http://payment-service:9090/payments/charge}"
      # Database host (resolved via Service Connect or RDS endpoint)
      DB_HOST: "${DB_HOST:-db-service}"
      # EFS-backed report base path
      APP_REPORT_BASE_PATH: "${APP_REPORT_BASE_PATH:-/mnt/efs/reports}"
      # Timezone
      TZ: UTC
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  app-network:
    driver: bridge
