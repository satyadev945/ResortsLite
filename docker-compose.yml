version: "3.9"

services:
  resortslite:
    image: resortslite:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resortslite-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Redis / Google Cloud Memorystore
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # External service endpoints
      PAYMENT_API_URL: ${PAYMENT_API_URL:-http://payment-svc.payments.svc.cluster.local:9090/payments/charge}
      REPORT_BASE_PATH: ${REPORT_BASE_PATH:-/var/legacy/reports/}
      # JVM options
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -Xms256m
        -Xmx512m
    volumes:
      - reports-data:/var/legacy/reports
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  reports-data:

networks:
  app-network:
    driver: bridge
