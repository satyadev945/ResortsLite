version: "3.9"

services:
  resortslite:
    image: resortslite:latest
    container_name: resortslite-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Spring profile
      SPRING_PROFILES_ACTIVE: docker

      # JVM options
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

      # Oracle datasource — override with real values at runtime
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL:-jdbc:oracle:thin:@<DB_HOST>:1521:<DB_SID>}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME:-admin}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD:-changeme}"

      # Redis (Amazon ElastiCache or local Redis)
      REDIS_HOST: "${REDIS_HOST:-localhost}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_SSL: "${REDIS_SSL:-false}"

      # Session
      SESSION_TIMEOUT_SECONDS: "${SESSION_TIMEOUT_SECONDS:-1800}"

      # Booking cache TTL
      BOOKING_CACHE_TTL_SECONDS: "${BOOKING_CACHE_TTL_SECONDS:-3600}"

      # Payment API
      PAYMENT_API_URL: "${PAYMENT_API_URL:-http://payment-service:9090/payments/charge}"

      # File paths
      REPORT_BASE_PATH: "${REPORT_BASE_PATH:-/var/reports}"
      BACKUP_PATH: "${BACKUP_PATH:-/var/backups}"

    volumes:
      - reports-data:/var/reports
      - backups-data:/var/backups

    networks:
      - app-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  reports-data:
  backups-data:

networks:
  app-network:
    driver: bridge
