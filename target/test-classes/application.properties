# Test configuration — uses H2 in-memory database instead of PostgreSQL
spring.application.name=ResortsLite-Test

# H2 in-memory datasource for unit/integration tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Disable PostgreSQL-specific init
spring.sql.init.mode=never

# Internal service endpoints (test values)
app.payment.endpoint=https://payment-svc.internal:9090/charge
app.inventory.endpoint=https://inventory-svc.internal:8081/rooms
app.notification.endpoint=https://notify.internal:7070/send

# Report storage
app.report.base-path=/tmp/reports/
app.report.download-url=https://reports.resorts-internal.com/download/
