# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:oracle:thin:@db-prod.resorts-internal.com:1521:ORCL
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cz-java-0062: Payment API URL — replaces the hardcoded IP 10.0.1.45 in BookingService.java.
# Override via Kubernetes ConfigMap env var PAYMENT_API_URL or set app.payment.api.url directly.
# Use the cluster-internal DNS name for inter-service communication on Amazon EKS.
app.payment.api.url=${PAYMENT_API_URL:http://payment-service.payments.svc.cluster.local:9090/payments/charge}

# cz-java-0057: File path configuration — override via Kubernetes ConfigMap env vars
# REPORTS_BASE_PATH and BACKUP_PATH injected into the Pod spec from a ConfigMap
app.reports.base-path=${REPORTS_BASE_PATH:/mnt/reports}
app.backup.path=${BACKUP_PATH:/mnt/backups}

# health-check-endpoint: Expose /actuator/health for Kubernetes liveness and readiness probes
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# cz-java-0063: Amazon ElastiCache for Redis connection — externalised via environment variables
# injected by Kubernetes Secrets / EKS IRSA. Override REDIS_HOST and REDIS_PORT in the Pod spec.
# Default values are safe for local development only.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# cz-java-0063: Spring Session store type — delegates HttpSession to Redis via Spring Session
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortsLite:session
