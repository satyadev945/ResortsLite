# ResortsLite - PostgreSQL-Compatible Configuration
spring.application.name=ResortsLite

# Server port — externalised to environment variable for cloud/container deployments (ECS/EKS)
# Fix czr-port-001: Use ${PORT:8080} to allow dynamic port assignment by container orchestration
server.port=${PORT:8080}

# PostgreSQL DataSource Configuration
# Fix cr-java-0021: Connection URL externalised to environment variable.
# Set SPRING_DATASOURCE_URL in AWS Parameter Store / Secrets Manager / container env.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resortdb}

# Fix sec-cred-001: Credentials externalised to environment variables.
# Inject via AWS Secrets Manager, Kubernetes Secret, or ECS task definition secrets.
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# PostgreSQL JDBC driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Use snake_case naming strategy for PostgreSQL compatibility
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Connection pool settings (HikariCP — Spring Boot default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# H2 console disabled — not applicable for PostgreSQL
spring.h2.console.enabled=false

# Fix cr-java-0021: Internal service endpoints externalised to environment variables.
# Set these in AWS Parameter Store / ECS task definition / Kubernetes ConfigMap.
app.payment.endpoint=${APP_PAYMENT_ENDPOINT:https://payment-svc/charge}
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:https://inventory-svc/rooms}
app.notification.endpoint=${APP_NOTIFICATION_ENDPOINT:https://notify-svc/send}

# Fix czr-java-001: Report base path externalised to environment variable.
# Use S3 bucket path or a mounted volume path in container environments.
app.report.base-path=${APP_REPORT_BASE_PATH:/tmp/reports/}
