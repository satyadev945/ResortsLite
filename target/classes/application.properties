# ResortsLite - Modernized Configuration
spring.application.name=ResortsLite

# Dynamic port assignment for container orchestration (ECS/EKS)
server.port=${PORT:8080}

# Database configuration externalized via environment variables
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Externalized service endpoints via environment variables
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal:8443/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal:8443/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal:8443/send}

# Report paths externalized via environment variables
app.report.base-path=${REPORT_BASE_PATH:./reports}
app.report.backup-path=${REPORT_BACKUP_PATH:./backups}
