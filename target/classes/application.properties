# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# Health check endpoint (health-check-endpoint): Spring Boot Actuator exposes /actuator/health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# cz-java-0057: Absolute file paths replaced with environment variables.
# Set REPORT_BASE_PATH and BACKUP_PATH as environment variables or mount via Azure Key Vault CSI Driver on AKS.

# cz-java-0070 / cz-java-0069: Redis connection configuration for distributed booking cache.
# Replaces the local in-memory static HashMap (bookingCache) in BookingController that was
# identified as a cz-java-0070 Local Cache violation breaking horizontal scaling on AKS.
#
# Redis is deployed in-cluster on AKS using the Bitnami Redis Helm chart backed by
# Azure Managed Disk persistent volumes (Azure Disk PVC). Deployment command:
#   helm repo add bitnami https://charts.bitnami.com/bitnami
#   helm install redis bitnami/redis \
#     --set architecture=standalone \
#     --set auth.enabled=false \
#     --set master.persistence.enabled=true \
#     --set master.persistence.storageClass=managed-premium \
#     --set master.persistence.size=8Gi \
#     --namespace resortslite --create-namespace
#
# Set REDIS_HOST and REDIS_PORT as environment variables in AKS pod spec or ConfigMap:
#   REDIS_HOST=redis-master.resortslite.svc.cluster.local
#   REDIS_PORT=6379
# KEDA Redis Queue-Based Autoscaler uses these Redis metrics to scale AKS pods dynamically.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# cz-java-0070 / cz-java-0069: Booking cache TTL in seconds. Configurable via BOOKING_CACHE_TTL_SECONDS env var.
# Default: 3600 seconds (1 hour). Adjust based on booking session lifecycle requirements.
BOOKING_CACHE_TTL_SECONDS=${BOOKING_CACHE_TTL_SECONDS:3600}

# cz-java-0082: Azure Service Bus configuration for async decoupled messaging between AKS microservices.
# Replaces tightly-coupled synchronous cross-domain calls (BookingController -> BookingService
# and BookingService -> PAYMENT_API) with Azure Service Bus topics/queues.
# Set AZURE_SERVICE_BUS_CONNECTION_STRING via AKS pod spec or Azure Key Vault CSI Driver.
# Never hardcode the connection string — it contains shared access keys.
AZURE_SERVICE_BUS_CONNECTION_STRING=${AZURE_SERVICE_BUS_CONNECTION_STRING:}

# cz-java-0082: Azure Service Bus queue name for booking creation events.
# The downstream booking processor microservice on AKS subscribes to this queue.
AZURE_SERVICE_BUS_BOOKING_QUEUE=${AZURE_SERVICE_BUS_BOOKING_QUEUE:booking-events-queue}

# cz-java-0082: Azure Service Bus queue name for report/payment processing events.
# The downstream report processor microservice on AKS subscribes to this queue.
AZURE_SERVICE_BUS_REPORT_QUEUE=${AZURE_SERVICE_BUS_REPORT_QUEUE:report-events-queue}
