# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:sqlserver://db-prod.resorts-internal.com:1433;databaseName=ResortsDB;encrypt=false;trustServerCertificate=true
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA-Hibernate properties (SQL Server) — IDENTITY keys, same entity shape as the Oracle Doctor
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send
# cz-java-0062: payment API URL supplied via PAYMENT_API_URL (AKS ConfigMap / Key Vault CSI Driver)
app.payment.api-url=${PAYMENT_API_URL:http://payment-svc.internal:9090/payments/charge}

# Health check endpoint (/actuator/health)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# cz-java-0063: Spring Session backed by Azure Cache for Redis.
# REDIS_HOST / REDIS_PORT / REDIS_PASSWORD are injected from Azure Key Vault via the
# Secrets Store CSI Driver on AKS (synced as a Kubernetes Secret exposed as env vars).
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session
spring.session.timeout=30m
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6380}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL_ENABLED:true}
