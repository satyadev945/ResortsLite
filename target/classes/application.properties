# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:oracle:thin:@db-prod.resorts-internal.com:1521:ORCL
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cz-java-0057 FIX: Externalized absolute file paths via environment variables.
# Override these via Kubernetes ConfigMap (REPORT_BASE_PATH / BACKUP_PATH env vars)
# or Azure App Configuration for centralized path management across environments.
app.report.base-path=${REPORT_BASE_PATH:/tmp/reports}
app.backup.path=${BACKUP_PATH:/tmp/backups}

# Health check endpoint configuration (Spring Boot Actuator)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

# cz-java-0063 FIX: Spring Session backed by Azure Cache for Redis.
# Redis host and password are injected from Azure Key Vault using the Secrets Store
# CSI Driver on AKS. Mount the Key Vault secrets as environment variables:
#   REDIS_HOST     -> Azure Cache for Redis hostname (e.g. my-cache.redis.cache.windows.net)
#   REDIS_PORT     -> Redis TLS port (default 6380 for Azure Cache for Redis)
#   REDIS_PASSWORD -> Azure Cache for Redis primary access key
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6380}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=true
spring.redis.timeout=2000ms

# cz-java-0070 FIX: Local in-process HashMap cache replaced with Azure Cache for Redis.
# RedisTemplate<String, Object> is auto-configured by spring-boot-starter-data-redis.
# Booking cache entries are stored under the key prefix "bookingCache:" with a 1-hour TTL,
# ensuring cache consistency across all AKS pod replicas during horizontal scale-out.
# Redis connection details are shared with the session store above (REDIS_HOST / REDIS_PASSWORD
# injected from Azure Key Vault via the Secrets Store CSI Driver with Workload Identity).
# Default serializer is configured to use JSON for human-readable cache inspection.
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
