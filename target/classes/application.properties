# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cz-java-0062 FIX: Payment API URL externalised from hardcoded IP (10.0.1.45) to environment variable.
# Set PAYMENT_API_URL in Kubernetes ConfigMap to the cluster-internal DNS service name on EKS.
# Example: PAYMENT_API_URL=http://payment-service.default.svc.cluster.local:9090/payments/charge
PAYMENT_API_URL=${PAYMENT_API_URL:http://payment-service:9090/payments/charge}

# Health check endpoint configuration (containerization requirement)
# cz-java-0063: Spring Session backed by Amazon ElastiCache (Redis) for distributed session storage.
# Redis connection is configured via environment variables injected by Kubernetes ConfigMap/Secret.
# REDIS_HOST and REDIS_PORT must be set to the ElastiCache cluster endpoint in EKS deployment.
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=spring:session
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# cz-java-0070: Booking cache TTL for Amazon ElastiCache (Redis) distributed cache.
# Replaces the local in-memory HashMap (bookingCache) in BookingController with a
# Redis-backed distributed cache shared across all EKS pod replicas.
# Set BOOKING_CACHE_TTL_SECONDS in Kubernetes ConfigMap to control cache entry lifetime.
# Default: 3600 seconds (1 hour). Adjust based on booking data freshness requirements.
booking.cache.ttl.seconds=${BOOKING_CACHE_TTL_SECONDS:3600}
