# ResortsLite - Configuration
# Fixed: Externalised infrastructure values to environment variables for cloud compatibility
spring.application.name=ResortsLite

# Fixed: Use environment variable for port to allow dynamic assignment by ECS/EKS
server.port=${SERVER_PORT:8080}

# Fixed: Externalised DB configuration to environment variables
spring.datasource.url=${DATASOURCE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATASOURCE_USERNAME:sa}
spring.datasource.password=${DATASOURCE_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Fixed: Externalised service endpoints to environment variables
app.payment.endpoint=${PAYMENT_ENDPOINT:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:http://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:http://notify.internal:7070/send}
