# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:oracle:thin:@db-prod.resorts-internal.com:1521:ORCL
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# Health check endpoint configuration (containerization requirement)
# Exposes /actuator/health for liveness/readiness probes in EKS/ECS
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.defaults.enabled=true
app.reports.base-path=${REPORTS_BASE_PATH:/var/reports}
app.backup.path=${BACKUP_PATH:/var/backups/resort/nightly}

# FIX cz-java-0063: Spring Session backed by Amazon ElastiCache for Redis.
# Session state is externalised so all EKS pod replicas share the same store,
# enabling stateless horizontal scaling and surviving container restarts.
# REDIS_HOST and REDIS_PORT must be injected via Kubernetes ConfigMap / EKS Pod env vars.
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session
spring.session.timeout=1800
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}
spring.redis.timeout=2000ms

# FIX cz-java-0070: Amazon ElastiCache (Redis) distributed booking cache configuration.
# Replaces the local in-memory HashMap bookingCache that was instance-local and invisible
# to other EKS pod replicas. All pod replicas now share the same distributed cache via Redis.
# BOOKING_CACHE_TTL_SECONDS is injected via Kubernetes ConfigMap / EKS Pod env vars.
# REDIS_HOST, REDIS_PORT, REDIS_PASSWORD are already configured above (shared Redis instance).
BOOKING_CACHE_TTL_SECONDS=${BOOKING_CACHE_TTL_SECONDS:3600}
spring.cache.redis.key-prefix=booking:
