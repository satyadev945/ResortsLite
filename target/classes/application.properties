# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:oracle:thin:@db-prod.resorts-internal.com:1521:ORCL
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cz-java-0062 [FIXED]: Hardcoded IP address (10.0.1.45) in BookingService.java replaced
# with environment variable. Override via Kubernetes ConfigMap or environment variable.
# Example AKS ConfigMap entry: PAYMENT_API_URL=http://payment-service.payments.svc.cluster.local:9090/payments/charge
PAYMENT_API_URL=${PAYMENT_API_URL:http://payment-service:9090/payments/charge}

# cz-java-0057 [FIXED]: Externalized absolute file paths via environment variables / ConfigMap
# Override these via Kubernetes ConfigMap or environment variables (REPORT_BASE_PATH, BACKUP_PATH)
app.report.base-path=${REPORT_BASE_PATH:/var/reports}
app.backup.path=${BACKUP_PATH:/var/backups/nightly}

# cz-java-0063 [FIXED]: Spring Session backed by Azure Cache for Redis.
# Redis credentials are injected at runtime from Azure Key Vault using the
# Secrets Store CSI Driver on AKS. Set the following environment variables
# (or mount them as Kubernetes Secrets via the CSI SecretProviderClass):
#   REDIS_HOST     – Azure Cache for Redis hostname (e.g. my-cache.redis.cache.windows.net)
#   REDIS_PORT     – Redis TLS port (default 6380 for Azure Cache for Redis)
#   REDIS_PASSWORD – Primary/secondary access key from Azure Key Vault
#   REDIS_SSL      – "true" to enforce TLS (required by Azure Cache for Redis)
#   SESSION_TIMEOUT_SECONDS – session TTL in seconds (default 1800 = 30 min)
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=spring:session
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6380}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:true}
spring.redis.timeout=5000

# Health check endpoint configuration (containerization requirement)
# Exposes /actuator/health for liveness/readiness probes in Kubernetes / AKS
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# cz-java-0070 [FIXED]: Booking cache TTL for Azure Cache for Redis distributed cache.
# Replaces the former local static HashMap (bookingCache) in BookingController which was
# instance-local and invisible to other AKS pod replicas. Override via Kubernetes ConfigMap
# or environment variable. Default is 3600 seconds (1 hour).
BOOKING_CACHE_TTL_SECONDS=${BOOKING_CACHE_TTL_SECONDS:3600}
