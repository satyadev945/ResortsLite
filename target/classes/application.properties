# ResortsLite - Application Configuration
spring.application.name=ResortsLite

# Server port — externalised to environment variable for dynamic assignment by ECS/EKS
# Falls back to 8080 for local development
server.port=${SERVER_PORT:8080}

# PostgreSQL 16 datasource — credentials and host externalised to environment variables.
# In production, inject via AWS Parameter Store / Secrets Manager or Kubernetes Secrets.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resortdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings for PostgreSQL
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# PostgreSQL schema initialisation
spring.sql.init.mode=always
spring.sql.init.platform=postgresql

# Internal service endpoints — externalised to environment variables for cloud VPC routing.
# Override via ECS task definition environment, Kubernetes ConfigMap, or Parameter Store.
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal:7070/send}

# Report storage — externalised to environment variable; use S3 bucket path in production.
app.report.base-path=${REPORT_BASE_PATH:/tmp/reports/}
