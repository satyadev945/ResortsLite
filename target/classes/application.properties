# ResortsLite - Application Configuration
# Updated for Java 25 / Spring Boot 3.3.x / Jakarta EE 10 compatibility

spring.application.name=ResortsLite

# NOTE: Fixed port — consider externalising to environment variable for ECS/EKS dynamic port binding
server.port=8080

# ─── Data Source ──────────────────────────────────────────────────────────────
# NOTE: Credentials and hostname should be externalised to AWS Secrets Manager /
# Parameter Store or environment variables for cloud deployments.
spring.datasource.url=jdbc:oracle:thin:@db-prod.resorts-internal.com:1521:ORCL
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
# Updated from org.hibernate.dialect.Oracle12cDialect (removed in Hibernate 6 / Spring Boot 3.x)
# to org.hibernate.dialect.OracleDialect (Hibernate 6+ unified dialect).
# JAVA8_TO_25_JAKARTA_EE_MIGRATION: Hibernate 6 dropped all legacy dialect class names.
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# ─── Internal Service Endpoints ───────────────────────────────────────────────
# NOTE: These hostnames should be externalised to environment variables or
# service discovery for cloud VPC / container-based deployments.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send
