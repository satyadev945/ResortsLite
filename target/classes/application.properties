# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:oracle:thin:@db-prod.resorts-internal.com:1521:ORCL
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cz-java-0057: Externalized absolute file paths — override via REPORT_BASE_PATH / BACKUP_PATH env vars
# In EKS, inject these via ConfigMap or environment variables in the Pod spec
app.report.base-path=${REPORT_BASE_PATH:/var/reports}
app.backup.path=${BACKUP_PATH:/var/backups}

# health-check-endpoint: Expose Spring Boot Actuator health endpoint at /actuator/health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# cz-java-0063: Spring Session backed by Amazon ElastiCache for Redis.
# REDIS_HOST and REDIS_PORT are injected as environment variables in the EKS Pod spec
# (e.g., via a ConfigMap or Secrets Manager sidecar). This externalises all session state
# from JVM heap to a shared Redis cluster, enabling horizontal scaling and pod-restart safety.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}
# cz-java-0063: Session timeout — override via SESSION_TIMEOUT_SECONDS env var (default 30 min)
spring.session.timeout=${SESSION_TIMEOUT_SECONDS:1800}
spring.session.store-type=redis

# cz-java-0070: Booking cache TTL for Amazon ElastiCache for Redis.
# Controls how long booking entries are retained in the shared Redis cache.
# Override via BOOKING_CACHE_TTL_SECONDS env var injected via Kubernetes ConfigMap in EKS Pod spec.
# Default: 3600 seconds (1 hour). Applies to all booking entries stored via RedisTemplate.
app.cache.booking.ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:3600}
