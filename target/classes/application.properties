# ResortsLite - PostgreSQL 16 Configuration
spring.application.name=ResortsLite

# Server port — externalised via environment variable for cloud/container deployments
# Override with: SERVER_PORT env var or --server.port JVM arg
server.port=${SERVER_PORT:8080}

# ─── PostgreSQL 16 DataSource ────────────────────────────────────────────────
# Migrated from: jdbc:h2:mem:resortdb (H2 in-memory) to PostgreSQL 16
# Connection parameters are externalised to environment variables so that
# credentials are never stored in source code (replaces hardcoded sa/empty creds).
# Set the following environment variables at runtime (AWS Parameter Store / Secrets Manager):
#   DB_HOST     — PostgreSQL host (e.g. resortdb.cluster-xyz.us-east-1.rds.amazonaws.com)
#   DB_PORT     — PostgreSQL port (default 5432)
#   DB_NAME     — Database name  (e.g. resortdb)
#   DB_USER     — Database user
#   DB_PASSWORD — Database password
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:resortdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── Connection Pool (HikariCP) ──────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
# PostgreSQL dialect for Hibernate 6 (Spring Boot 3.x auto-detects, but explicit is safer)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# validate — schema must already exist; use 'update' only in dev, never in prod
spring.jpa.hibernate.ddl-auto=validate
# Log SQL in development; set to false in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Use snake_case column naming to match PostgreSQL conventions
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ─── Service Endpoints ───────────────────────────────────────────────────────
# Externalised to environment variables — replaces hardcoded internal hostnames
# that are non-routable in cloud VPC environments.
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal:7070/send}

# ─── Report Storage ──────────────────────────────────────────────────────────
# Externalised report base path — replaces hardcoded /var/legacy/reports/
# In production, point to a mounted volume or use cloud object storage (S3).
app.report.base-path=${REPORT_BASE_PATH:/tmp/reports/}
