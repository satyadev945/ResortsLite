# ResortsLite - Legacy Configuration
# IMPROVED: Configuration externalized for cloud deployment
spring.application.name=ResortsLite

# Server port - can be overridden by environment variable SERVER_PORT
server.port=8080

# Database configuration - H2 in-memory for development
# In production, use externalized configuration with AWS Secrets Manager
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Initialize database schema on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# IMPROVED: Service endpoints using HTTPS for cloud compatibility
# These should be overridden in production with actual service discovery endpoints
app.payment.endpoint=https://payment-svc.internal:9090/charge
app.inventory.endpoint=https://inventory-svc.internal:8081/rooms
app.notification.endpoint=https://notify.internal:7070/send

# Report and backup paths - container-friendly defaults
app.report.path=/tmp/reports/
app.backup.path=/tmp/backups/

# Spring Boot Actuator configuration for monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
management.metrics.export.prometheus.enabled=true
management.info.env.enabled=true
