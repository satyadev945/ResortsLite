# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cz-java-0057: EFS-backed file paths — override via APP_REPORT_BASE_PATH / APP_BACKUP_PATH
# environment variables in the ECS Fargate task definition, pointing to the EFS mount point.
app.report.base-path=${APP_REPORT_BASE_PATH:/mnt/efs/reports}

# cz-java-0082: ECS Service Connect inter-service URLs — set these environment variables in
# the ECS Fargate task definition. ECS Service Connect provides automatic service discovery,
# mTLS, and traffic observability between independently deployed Fargate services.
# INVENTORY_SERVICE_URL: base URL for the inventory Fargate service (no trailing slash).
# PAYMENT_SERVICE_URL:   full charge endpoint URL for the payment Fargate service.
INVENTORY_SERVICE_URL=${INVENTORY_SERVICE_URL:http://inventory-service:8081}

# cz-java-0070: Amazon ElastiCache (Memcached) endpoint for distributed caching.
# Injected from AWS SSM Parameter Store via ECS Fargate task definition environment variable.
# Store the value in SSM: /resortslite/memcached/endpoint = <cluster-endpoint>:11211
# Reference in ECS task definition valueFrom:
#   arn:aws:ssm:<region>:<account>:parameter/resortslite/memcached/endpoint
MEMCACHED_ENDPOINT=${MEMCACHED_ENDPOINT:localhost:11211}

# health-check-endpoint: Spring Boot Actuator health endpoint configuration.
# Exposes /actuator/health for container liveness/readiness probes in ECS Fargate.
# The actuator dependency (spring-boot-starter-actuator) is already declared in pom.xml.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.defaults.enabled=true
