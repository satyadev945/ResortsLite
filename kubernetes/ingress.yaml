apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-comp1-ingress
  namespace: test-comp1
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/backend-path-prefix: "/"
spec:
  rules:
    - host: test-comp1.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: test-comp1-service
                port:
                  number: 80
