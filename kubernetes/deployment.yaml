apiVersion: v1
kind: Secret
metadata:
  name: resortslite-secrets
  namespace: resortslite
  labels:
    app: resortslite
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "{{DB_USERNAME}}"
  SPRING_DATASOURCE_PASSWORD: "{{DB_PASSWORD}}"
  REDIS_PASSWORD: "{{REDIS_PASSWORD}}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resortslite
  namespace: resortslite
  labels:
    app: resortslite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resortslite
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: resortslite
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: resortslite
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: SERVER_PORT
              value: "8080"
            - name: TZ
              value: "UTC"
            - name: JAVA_OPTS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xms256m -Dfile.encoding=UTF-8 -Duser.timezone=UTC -Djava.security.egd=file:/dev/./urandom"
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info"
            - name: SPRING_DATASOURCE_URL
              value: "{{DB_URL}}"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: resortslite-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resortslite-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
            - name: REDIS_SSL
              value: "{{REDIS_SSL}}"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resortslite-secrets
                  key: REDIS_PASSWORD
            - name: APP_PAYMENT_ENDPOINT
              value: "{{PAYMENT_ENDPOINT}}"
            - name: APP_INVENTORY_ENDPOINT
              value: "{{INVENTORY_ENDPOINT}}"
            - name: APP_NOTIFICATION_ENDPOINT
              value: "{{NOTIFICATION_ENDPOINT}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
