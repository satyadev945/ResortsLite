apiVersion: apps/v1
kind: Deployment
metadata:
  name: resortslite
  namespace: resortslite
  labels:
    app: resortslite
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resortslite
  template:
    metadata:
      labels:
        app: resortslite
        version: v1
    spec:
      containers:
      - name: resortslite
        image: {{IMAGE_URI}}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        # Spring Boot Configuration
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        
        # Database Configuration (Oracle)
        - name: SPRING_DATASOURCE_URL
          value: "{{DATABASE_URL}}"
        - name: SPRING_DATASOURCE_USERNAME
          value: "{{DATABASE_USERNAME}}"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "{{DATABASE_PASSWORD}}"
        
        # Redis Configuration (Amazon ElastiCache)
        - name: REDIS_HOST
          value: "{{REDIS_HOST}}"
        - name: REDIS_PORT
          value: "{{REDIS_PORT}}"
        - name: REDIS_PASSWORD
          value: "{{REDIS_PASSWORD}}"
        - name: REDIS_SSL
          value: "true"
        
        # External Service Endpoints
        - name: PAYMENT_API_URL
          value: "{{PAYMENT_API_URL}}"
        
        # Application Paths
        - name: REPORT_PATH
          value: "/app/reports"
        - name: BACKUP_PATH
          value: "/app/backups"
        
        # JVM Settings
        - name: JAVA_OPTS
          value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
        
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        
        volumeMounts:
        - name: reports
          mountPath: /app/reports
        - name: backups
          mountPath: /app/backups
      
      volumes:
      - name: reports
        emptyDir: {}
      - name: backups
        emptyDir: {}
      
      restartPolicy: Always
