apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-comp1
  namespace: test-comp1
  labels:
    app: test-comp1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-comp1
  template:
    metadata:
      labels:
        app: test-comp1
    spec:
      containers:
        - name: test-comp1
          image: "{{IMAGE_URI}}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: SERVER_PORT
              value: "8080"
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m -XX:+UnlockExperimentalVMOptions -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8"
            - name: SPRING_DATASOURCE_URL
              value: "{{SPRING_DATASOURCE_URL}}"
            - name: SPRING_DATASOURCE_USERNAME
              value: "{{SPRING_DATASOURCE_USERNAME}}"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "{{SPRING_DATASOURCE_PASSWORD}}"
            - name: PAYMENT_ENDPOINT
              value: "{{PAYMENT_ENDPOINT}}"
            - name: INVENTORY_ENDPOINT
              value: "{{INVENTORY_ENDPOINT}}"
            - name: NOTIFICATION_ENDPOINT
              value: "{{NOTIFICATION_ENDPOINT}}"
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
            - name: REDIS_PASSWORD
              value: "{{REDIS_PASSWORD}}"
            - name: REDIS_SSL
              value: "{{REDIS_SSL}}"
            - name: REPORT_BASE_PATH
              value: "/app/data/reports"
            - name: BACKUP_PATH
              value: "/app/data/backups"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
