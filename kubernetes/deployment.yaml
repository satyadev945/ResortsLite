apiVersion: apps/v1
kind: Deployment
metadata:
  name: resortsLite
  namespace: resortsLite
  labels:
    app: resortsLite
    version: "1.0.0"
    managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resortsLite
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: resortsLite
        version: "1.0.0"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: resortsLite
          image: {{IMAGE_URI}}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: TZ
              value: "UTC"
            - name: SERVER_PORT
              value: "8080"
            # PostgreSQL Database — inject via Secret
            - name: SPRING_DATASOURCE_URL
              value: "{{SPRING_DATASOURCE_URL}}"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: resortsLite-db-secret
                  key: db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resortsLite-db-secret
                  key: db-password
            # Redis / Amazon ElastiCache — inject via Secret
            - name: SPRING_REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: resortsLite-redis-secret
                  key: redis-host
            - name: SPRING_REDIS_PORT
              value: "6379"
            # Payment service endpoint — inject via ConfigMap
            - name: PAYMENT_API_URL
              value: "{{PAYMENT_API_URL}}"
            # Report and backup paths — inject via ConfigMap
            - name: REPORT_BASE_PATH
              value: "{{REPORT_BASE_PATH}}"
            - name: BACKUP_PATH
              value: "{{BACKUP_PATH}}"
            # JVM options
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - name: reports-volume
              mountPath: /var/reports
            - name: backups-volume
              mountPath: /var/backups/nightly
      volumes:
        - name: reports-volume
          emptyDir: {}
        - name: backups-volume
          emptyDir: {}
