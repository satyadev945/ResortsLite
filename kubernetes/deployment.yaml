apiVersion: apps/v1
kind: Deployment
metadata:
  name: resortslite
  namespace: resortslite
  labels:
    app: resortslite
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resortslite
  template:
    metadata:
      labels:
        app: resortslite
        version: "1.0.0"
    spec:
      containers:
        - name: resortslite
          image: {{IMAGE_URI}}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: TZ
              value: "UTC"
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
            # Oracle Database — inject via Kubernetes Secret
            - name: SPRING_DATASOURCE_URL
              value: "{{SPRING_DATASOURCE_URL}}"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: resortslite-db-secret
                  key: db-username
                  optional: true
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resortslite-db-secret
                  key: db-password
                  optional: true
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: "oracle.jdbc.OracleDriver"
            # Redis / ElastiCache — inject via Kubernetes Secret
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resortslite-redis-secret
                  key: redis-password
                  optional: true
            - name: REDIS_SSL
              value: "{{REDIS_SSL}}"
            # Internal service endpoints
            - name: PAYMENT_API_URL
              value: "{{PAYMENT_API_URL}}"
            - name: APP_PAYMENT_ENDPOINT
              value: "{{APP_PAYMENT_ENDPOINT}}"
            - name: APP_INVENTORY_ENDPOINT
              value: "{{APP_INVENTORY_ENDPOINT}}"
            - name: APP_NOTIFICATION_ENDPOINT
              value: "{{APP_NOTIFICATION_ENDPOINT}}"
            # File paths via ConfigMap
            - name: REPORT_BASE_PATH
              value: "{{REPORT_BASE_PATH}}"
            - name: BACKUP_PATH
              value: "{{BACKUP_PATH}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: reports-volume
              mountPath: /var/reports
            - name: backups-volume
              mountPath: /var/backups/nightly
      volumes:
        - name: reports-volume
          emptyDir: {}
        - name: backups-volume
          emptyDir: {}
      terminationGracePeriodSeconds: 30
