apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-msql
  namespace: java-msql
  labels:
    app: java-msql
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-msql
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: java-msql
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: java-msql
          image: {{IMAGE_URI}}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: TZ
              value: "UTC"
            - name: SERVER_PORT
              value: "8080"
            - name: JAVA_OPTS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8 -Duser.timezone=UTC"
            - name: SPRING_DATASOURCE_URL
              value: "{{SPRING_DATASOURCE_URL}}"
            - name: SPRING_DATASOURCE_USERNAME
              value: "{{SPRING_DATASOURCE_USERNAME}}"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: java-msql-secrets
                  key: db-password
                  optional: true
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: java-msql-secrets
                  key: redis-password
                  optional: true
            - name: REDIS_SSL_ENABLED
              value: "{{REDIS_SSL_ENABLED}}"
            - name: PAYMENT_API_URL
              value: "{{PAYMENT_API_URL}}"
            - name: APP_INVENTORY_ENDPOINT
              value: "{{APP_INVENTORY_ENDPOINT}}"
            - name: APP_NOTIFICATION_ENDPOINT
              value: "{{APP_NOTIFICATION_ENDPOINT}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: reports
              mountPath: /app/reports
            - name: backups
              mountPath: /app/backups
      volumes:
        - name: reports
          emptyDir: {}
        - name: backups
          emptyDir: {}
