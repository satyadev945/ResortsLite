apiVersion: apps/v1
kind: Deployment
metadata:
  name: resortslite
  namespace: resortslite
  labels:
    app: resortslite
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resortslite
  template:
    metadata:
      labels:
        app: resortslite
        version: "1.0.0"
    spec:
      containers:
        - name: resortslite
          image: {{IMAGE_URI}}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Spring Boot profile
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"

            # Server port
            - name: SERVER_PORT
              value: "8080"

            # PostgreSQL Database connection
            - name: SPRING_DATASOURCE_URL
              value: "{{SPRING_DATASOURCE_URL}}"
            - name: SPRING_DATASOURCE_USERNAME
              value: "{{SPRING_DATASOURCE_USERNAME}}"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "{{SPRING_DATASOURCE_PASSWORD}}"

            # Redis / ElastiCache session store
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
            - name: REDIS_SSL
              value: "{{REDIS_SSL}}"

            # Booking cache TTL
            - name: BOOKING_CACHE_TTL_SECONDS
              value: "{{BOOKING_CACHE_TTL_SECONDS}}"

            # Payment service URL
            - name: PAYMENT_SERVICE_URL
              value: "{{PAYMENT_SERVICE_URL}}"

            # File paths
            - name: REPORT_BASE_PATH
              value: "/reports"
            - name: BACKUP_PATH
              value: "/backups"

            # JVM options
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UnlockExperimentalVMOptions -Djava.security.egd=file:/dev/./urandom"

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3

          volumeMounts:
            - name: reports-volume
              mountPath: /reports
            - name: backups-volume
              mountPath: /backups

      volumes:
        - name: reports-volume
          emptyDir: {}
        - name: backups-volume
          emptyDir: {}

      terminationGracePeriodSeconds: 30
