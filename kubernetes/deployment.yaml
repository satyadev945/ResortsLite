apiVersion: apps/v1
kind: Deployment
metadata:
  name: resortslite
  namespace: resortslite
  labels:
    app: resortslite
    version: "1.0.0"
    app.kubernetes.io/name: resortslite
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resortslite
  template:
    metadata:
      labels:
        app: resortslite
        version: "1.0.0"
    spec:
      containers:
        - name: resortslite
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: SERVER_PORT
              value: "8080"
            - name: TZ
              value: "UTC"
            # Redis distributed cache
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
            - name: BOOKING_CACHE_TTL_SECONDS
              value: "{{BOOKING_CACHE_TTL_SECONDS}}"
            # Azure Service Bus
            - name: AZURE_SERVICE_BUS_CONNECTION_STRING
              value: "{{AZURE_SERVICE_BUS_CONNECTION_STRING}}"
            - name: AZURE_SERVICE_BUS_BOOKING_QUEUE
              value: "{{AZURE_SERVICE_BUS_BOOKING_QUEUE}}"
            - name: AZURE_SERVICE_BUS_REPORT_QUEUE
              value: "{{AZURE_SERVICE_BUS_REPORT_QUEUE}}"
            # JWT secret key
            - name: JWT_SECRET_KEY
              value: "{{JWT_SECRET_KEY}}"
            # Report / backup paths
            - name: REPORT_BASE_PATH
              value: "/mnt/reports"
            - name: BACKUP_PATH
              value: "/mnt/backups"
            # Database host
            - name: DB_HOST
              value: "{{DB_HOST}}"
            # JVM options
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: reports-volume
              mountPath: /mnt/reports
            - name: backups-volume
              mountPath: /mnt/backups
      volumes:
        - name: reports-volume
          emptyDir: {}
        - name: backups-volume
          emptyDir: {}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
