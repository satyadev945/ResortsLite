apiVersion: apps/v1
kind: Deployment
metadata:
  name: resortslite
  namespace: resortslite
  labels:
    app: resortslite
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resortslite
  template:
    metadata:
      labels:
        app: resortslite
        version: "1.0"
    spec:
      containers:
        - name: resortslite
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
            - name: GCP_PROJECT_ID
              value: "{{GCP_PROJECT_ID}}"
            - name: PUBSUB_BOOKING_TOPIC
              value: "{{PUBSUB_BOOKING_TOPIC}}"
            - name: PUBSUB_REPORT_TOPIC
              value: "{{PUBSUB_REPORT_TOPIC}}"
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: resortslite-secrets
                  key: jwt-signing-key
            - name: REPORT_BASE_PATH
              value: "{{REPORT_BASE_PATH}}"
            - name: BOOKING_CACHE_TTL_SECONDS
              value: "{{BOOKING_CACHE_TTL_SECONDS}}"
            - name: PAYMENT_API_URL
              value: "{{PAYMENT_API_URL}}"
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: reports-volume
              mountPath: /var/reports
      volumes:
        - name: reports-volume
          emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      terminationGracePeriodSeconds: 30
