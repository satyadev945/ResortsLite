apiVersion: apps/v1
kind: Deployment
metadata:
  name: resortslite
  namespace: resortslite
  labels:
    app: resortslite
    version: "1.0.0"
    managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resortslite
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: resortslite
        version: "1.0.0"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: resortslite
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Spring profile
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"

            # Oracle Database
            - name: SPRING_DATASOURCE_URL
              value: "{{SPRING_DATASOURCE_URL}}"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: resortslite-db-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resortslite-db-secret
                  key: password

            # Redis / Amazon ElastiCache
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resortslite-redis-secret
                  key: password
                  optional: true
            - name: REDIS_SSL
              value: "{{REDIS_SSL}}"

            # Internal service endpoints
            - name: PAYMENT_API_URL
              value: "{{PAYMENT_API_URL}}"
            - name: APP_INVENTORY_ENDPOINT
              value: "{{APP_INVENTORY_ENDPOINT}}"
            - name: APP_NOTIFICATION_ENDPOINT
              value: "{{APP_NOTIFICATION_ENDPOINT}}"

            # Report storage
            - name: REPORT_BASE_PATH
              value: "/var/reports"

            # JVM options
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1

          volumeMounts:
            - name: reports-volume
              mountPath: /var/reports

      volumes:
        - name: reports-volume
          emptyDir: {}
