apiVersion: apps/v1
kind: Deployment
metadata:
  name: resortslite
  namespace: resortslite
  labels:
    app: resortslite
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resortslite
  template:
    metadata:
      labels:
        app: resortslite
        version: "1.0.0"
    spec:
      containers:
        - name: resortslite
          image: {{IMAGE_URI}}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: TZ
              value: "UTC"
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
            # Oracle Database connection
            - name: SPRING_DATASOURCE_URL
              value: "{{SPRING_DATASOURCE_URL}}"
            - name: SPRING_DATASOURCE_USERNAME
              value: "{{SPRING_DATASOURCE_USERNAME}}"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "{{SPRING_DATASOURCE_PASSWORD}}"
            # Redis / ElastiCache connection
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
            - name: REDIS_PASSWORD
              value: "{{REDIS_PASSWORD}}"
            - name: REDIS_SSL
              value: "{{REDIS_SSL}}"
            # Internal service endpoints
            - name: PAYMENT_API_URL
              value: "{{PAYMENT_API_URL}}"
            # Report storage path
            - name: REPORT_BASE_PATH
              value: "{{REPORT_BASE_PATH}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: reports-storage
              mountPath: /var/reports
      volumes:
        - name: reports-storage
          emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
