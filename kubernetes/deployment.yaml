apiVersion: apps/v1
kind: Deployment
metadata:
  name: resortslite
  namespace: resortslite
  labels:
    app: resortslite
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resortslite
  template:
    metadata:
      labels:
        app: resortslite
        version: v1
    spec:
      containers:
      - name: resortslite
        image: {{IMAGE_URI}}
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: management
          containerPort: 8081
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: JAVA_OPTS
          value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
        - name: TZ
          value: "UTC"
        # Database Configuration
        - name: SPRING_DATASOURCE_URL
          value: "{{SPRING_DATASOURCE_URL}}"
        - name: SPRING_DATASOURCE_USERNAME
          value: "{{SPRING_DATASOURCE_USERNAME}}"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "{{SPRING_DATASOURCE_PASSWORD}}"
        # Redis Configuration
        - name: REDIS_HOST
          value: "{{REDIS_HOST}}"
        - name: REDIS_PORT
          value: "{{REDIS_PORT}}"
        - name: REDIS_PASSWORD
          value: "{{REDIS_PASSWORD}}"
        # External Service Endpoints
        - name: PAYMENT_API_URL
          value: "{{PAYMENT_API_URL}}"
        - name: APP_PAYMENT_ENDPOINT
          value: "{{APP_PAYMENT_ENDPOINT}}"
        - name: APP_INVENTORY_ENDPOINT
          value: "{{APP_INVENTORY_ENDPOINT}}"
        - name: APP_NOTIFICATION_ENDPOINT
          value: "{{APP_NOTIFICATION_ENDPOINT}}"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
